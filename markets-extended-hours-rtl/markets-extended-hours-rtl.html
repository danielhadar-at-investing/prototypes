<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Markets Extended Hours RTL (OS-3709)</title>
<style>
/* ============================================================
   Built from the investing-prototype starter (iPhone 14 Pro, 393 x 852).
   Tokens: references/design-tokens.md. Example values only.
   ============================================================ */

/* ---------- 1. DESIGN TOKENS (light) ---------- */
:root {
  --bg-primary:      #FFFFFF;
  --bg-primary-3:    #FFFFFF;
  --bg-secondary:    #EFEFEF;
  --bg-tertiary:     #F8F8F8;
  --bg-info:         #F1F7FF;
  --text-primary:    #000000;
  --text-secondary:  #8C8C8C;
  --text-active:     #3372F6;
  --glass:           rgba(148,148,149,.2);
  --orange:          #FFA500;
  --gray-1:          #949495;
  --gray-3:          #D6D6D6;
  --green-up:        #008932;
  --red-down:        #E9152D;
  --divider:         #DEDEDE;
  --icon-secondary:  #8C8C8C;
  --chrome-bg:       rgba(249,249,249,.94);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  --statusbar-h: 54px;
  --nav-h: 44px;
  --tabbar-h: 49px;
  --home-h: 34px;
  --margin: 16px;
  --ease-ios: cubic-bezier(.32,.72,0,1);
  --price-up: var(--green-up);
  --price-down: var(--red-down);
}

/* ---------- 2. DARK ---------- */
[data-theme="dark"] {
  --bg-primary:      #1F242A;
  --bg-primary-3:    #0D1016;
  --bg-secondary:    #0D1016;
  --bg-tertiary:     #2C3037;
  --bg-info:         #212A3A;
  --text-primary:    #FFFFFF;
  --text-secondary:  #C7CACD;
  --text-active:     #FFFFFF;
  --gray-1:          #949495;
  --gray-3:          #40474F;
  --divider:         #2C3037;
  --icon-secondary:  #7D8287;
  --green-up:        #6AC64C;
  --red-down:        #E7544D;
  --chrome-bg:       rgba(13,16,22,.94);
}

/* ---------- 3. RESET + FRAME ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font);
  background: #E8E8ED;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
[data-theme="dark"] body { background: #17171C; }
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
svg { display: block; }

#phone {
  position: relative;
  width: 393px;
  height: 100vh;
  max-height: 852px;
  margin: 0 auto;
  background: var(--bg-primary-3);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 80px rgba(0,0,0,.14);
}
@media (min-height: 853px) { #phone { margin-top: calc((100vh - 852px) / 2); border-radius: 47px; } }
@media (max-width: 420px)  { #phone { width: 100%; max-height: none; box-shadow: none; border-radius: 0; } }

/* ---------- 4. STATUS BAR ---------- */
.status-bar {
  position: relative;
  height: var(--statusbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 28px 8px;
  background: var(--bg-primary-3);
  z-index: 10;
}
.status-time { font-size: 16px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.status-icons { display: flex; align-items: center; gap: 6px; color: var(--text-primary); }
.dynamic-island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 125px; height: 36px; background: #000; border-radius: 20px;
}

/* ---------- 5. NAV BAR ---------- */
.nav-bar {
  position: relative;
  height: var(--nav-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--margin);
  background: var(--bg-primary-3);
  z-index: 9;
}
.nav-title {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; letter-spacing: -.2px;
  color: var(--text-primary);
  pointer-events: none;
}
.nav-right { display: flex; align-items: center; gap: 11px; z-index: 1; margin-inline-start: auto; }
.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  color: var(--text-primary);
}
.icon-btn:active { background: rgba(128,128,128,.18); }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- 6. SEGMENTED TABS ---------- */
.seg-tabs {
  display: flex; gap: 20px;
  padding: 0 var(--margin);
  background: var(--bg-primary-3);
  box-shadow: inset 0 -.5px 0 0 var(--divider);
}
.seg-tab {
  position: relative;
  padding: 12px 0;
  font-size: 15px; font-weight: 510;
  color: var(--text-secondary);
}
.seg-tab.active { color: var(--text-primary); }
.seg-tab::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--orange); border-radius: 1px;
  transform: scaleX(0); transition: transform .22s var(--ease-ios);
}
.seg-tab.active::after { transform: scaleX(1); }

/* ---------- 7. SCROLL BODY + LIST ---------- */
.screen-body {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
  background: var(--bg-secondary);
  padding-top: 8px;
}
.screen-body::-webkit-scrollbar { display: none; }

.card {
  background: var(--bg-primary);
  margin: 0 0 8px;
}
.row {
  display: flex; align-items: center; justify-content: space-between;
  min-height: 50px;
  padding: 0 var(--margin);
  position: relative;
}
.row:active { background: rgba(128,128,128,.1); }
.row + .row::before {
  content: ""; position: absolute; top: 0; left: var(--margin); right: 0;
  height: .5px; background: var(--divider);
}
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-ticker { font-size: 15px; font-weight: 510; color: var(--text-primary); }
.row-name {
  font-size: 13px; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
}
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.price { font-size: 14px; font-weight: 510; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.change { font-size: 14px; font-weight: 510; font-variant-numeric: tabular-nums; }
.up   { color: var(--price-up); }
.down { color: var(--price-down); }

/* ---------- 8. EXTENDED-HOURS ROW (OS-3709 scope) ----------
   The label sits on its own line. The values row is a flex row, so the
   visual order follows the DOM order and the phone's direction. The
   order is set in renderExt() per data-order. */
.ext {
  padding: 0 var(--margin) 10px;
  margin-top: -4px;
}
.ext-label {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 510; color: var(--text-secondary);
  margin-bottom: 4px;
}
.ext-label svg { width: 14px; height: 14px; color: var(--icon-secondary); }
.ext-values {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}
.ext-values > * { flex: 1 1 0; min-width: 0; }
.ext-values .ext-clock { flex: 0 0 auto; width: 16px; display: flex; justify-content: center; color: var(--icon-secondary); }
.ext-values .ext-clock svg { width: 16px; height: 16px; }
.ext-val { font-size: 13px; font-weight: 510; }
.ext-val.up   { color: var(--price-up); }
.ext-val.down { color: var(--price-down); }
.ext-val.price-ext { color: var(--text-primary); }

.footnote {
  font-size: 12px; color: var(--text-secondary);
  padding: 12px var(--margin) 24px;
  line-height: 16px;
}

/* ---------- 9. TAB BAR ---------- */
.tab-bar {
  flex-shrink: 0;
  height: calc(var(--tabbar-h) + var(--home-h));
  background: var(--chrome-bg);
  backdrop-filter: blur(10px);
  box-shadow: 0 -.5px 0 0 rgba(128,128,128,.35);
  display: flex; flex-direction: column;
  z-index: 9;
}
.tabs { height: var(--tabbar-h); display: flex; }
.tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--gray-1);
}
.tab.active { color: var(--orange); }
.tab svg { width: 24px; height: 24px; }
.tab span { font-size: 10px; font-weight: 510; letter-spacing: -.24px; }
.home-indicator { height: var(--home-h); display: flex; align-items: center; justify-content: center; }
.home-indicator::after {
  content: ""; width: 134px; height: 5px; border-radius: 100px;
  background: var(--text-primary); opacity: .9; margin-bottom: 3px;
}

/* ---------- 10. TOAST ---------- */
#toast {
  position: fixed; bottom: 110px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: rgba(30,30,32,.94);
  color: #FFF;
  font-size: 14px; font-weight: 510;
  padding: 12px 18px; border-radius: 22px;
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 100; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 11. DEV CONTROLS (prototype only) ---------- */
#devbar {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(20px);
  border-radius: 20px; padding: 5px;
  box-shadow: 0 4px 20px rgba(0,0,0,.12);
  z-index: 200;
  max-width: calc(100vw - 32px);
}
#devbar button { font-size: 12px; font-weight: 600; color: #333; padding: 6px 12px; border-radius: 15px; }
#devbar button[aria-pressed="true"] { background: #1F242A; color: #FFF; }
#devbar button:active { background: rgba(0,0,0,.07); }
@media (max-width: 420px) { #devbar { display: none; } }
</style>
</head>
<body>

<!-- Prototype controls. Hidden on phone widths. -->
<div id="devbar" role="group" aria-label="Prototype controls">
  <button id="btn-current" aria-pressed="false" onclick="setOrder('current')">Current order</button>
  <button id="btn-target" aria-pressed="true" onclick="setOrder('target')">Target order</button>
  <button onclick="toggleTheme()">Theme</button>
</div>

<!-- dir="rtl": the RTL layout this ticket covers. -->
<div id="phone" dir="rtl" data-order="target">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="dynamic-island"></div>
    <div class="status-time">9:41</div>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 11.5 6.2 8.9a3.6 3.6 0 0 1 4.6 0L8.5 11.5Zm5-5.6a8.6 8.6 0 0 0-10 0L2.1 4.3a10.6 10.6 0 0 1 12.8 0L13.5 5.9ZM11.6 7.6a5.9 5.9 0 0 0-6.2 0L4 6a7.9 7.9 0 0 1 9 0L11.6 7.6Z"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.2" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><path d="M24 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <!-- NAV BAR -->
  <div class="nav-bar">
    <div class="nav-title">Markets</div>
    <div class="nav-right">
      <button class="icon-btn" onclick="toast('Search')" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
  </div>

  <!-- SEGMENTED TABS -->
  <div class="seg-tabs" role="tablist">
    <button class="seg-tab active" role="tab" onclick="setSeg(this)">Popular</button>
    <button class="seg-tab" role="tab" onclick="setSeg(this)">Stocks</button>
    <button class="seg-tab" role="tab" onclick="setSeg(this)">ETFs</button>
  </div>

  <!-- SCROLL BODY -->
  <div class="screen-body">
    <div class="card" id="list"><!-- rows injected by JS --></div>
    <div class="footnote">Example values for layout review only. Not live market data.</div>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <div class="tabs">
      <button class="tab active" onclick="setTab(this,'Markets')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 6-8"/><path d="M15 7h4v4"/></svg>
        <span>Markets</span>
      </button>
      <button class="tab" onclick="setTab(this,'News')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h6M7 13h10M7 17h10"/></svg>
        <span>News</span>
      </button>
      <button class="tab" onclick="setTab(this,'Calendar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Calendar</span>
      </button>
      <button class="tab" onclick="setTab(this,'Watchlist')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/></svg>
        <span>Watchlist</span>
      </button>
      <button class="tab" onclick="setTab(this,'More')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span>More</span>
      </button>
    </div>
    <div class="home-indicator"></div>
  </div>

</div>

<div id="toast"></div>

<script>
/* ---- Toast ---- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---- Tabs ---- */
function setTab(el, name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (name !== 'Markets') toast(name);
}
function setSeg(el) {
  document.querySelectorAll('.seg-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

/* ---- Theme ---- */
function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
}

/* ---- Order toggle: current vs target (OS-3709) ----
   Visual L->R on screen:
     current: price, PT change, % change, icon
     target : PT change, % change, price, icon
   In an RTL flex row, the first DOM child sits on the right. So the
   DOM order is the reverse of the visual order, with the icon first. */
let order = 'target';
function setOrder(name) {
  order = name;
  document.getElementById('phone').dataset.order = name;
  document.getElementById('btn-current').setAttribute('aria-pressed', String(name === 'current'));
  document.getElementById('btn-target').setAttribute('aria-pressed', String(name === 'target'));
  renderAll();
}

/* ---- Example data. Numbers are internally consistent:
        pct = pt / previous close, previous close = price - change. ---- */
const ROWS = [
  { sym: 'AAPL',  name: 'Apple Inc',      price: 228.52, chg:  1.84, pctTxt: '+0.81%',
    ext: { label: 'Pre-Market', price: '229.10', pt: '+0.58', pct: '+0.25%', dir: 'up' } },
  { sym: 'NVDA',  name: 'NVIDIA Corp',    price: 174.31, chg:  3.12, pctTxt: '+1.82%',
    ext: { label: 'After Hours', price: '176.02', pt: '+1.71', pct: '+0.98%', dir: 'up' } },
  { sym: 'TSLA',  name: 'Tesla Inc',      price: 334.09, chg: -2.47, pctTxt: '-0.73%',
    ext: { label: 'After Hours', price: '331.20', pt: '-2.89', pct: '-0.87%', dir: 'down' } },
  { sym: 'MSFT',  name: 'Microsoft Corp', price: 512.76, chg:  0.43, pctTxt: '+0.08%',
    ext: { label: 'Pre-Market', price: '514.90', pt: '+2.14', pct: '+0.42%', dir: 'up' } }
];

const CLOCK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6.3"/><path d="M8 4.6V8l2.2 1.4"/></svg>';

/* Builds the extended-hours values row in the requested visual order.
   DOM is written in RTL-reversed order (icon first, then price/pct/pt
   for target; icon first, then pct/pt/price for current). */
function extValues(e) {
  const cell = (cls, txt) => '<span class="' + cls + '">' + txt + '</span>';
  const ptCell  = cell('ext-val ' + e.dir, e.pt);
  const pctCell = cell('ext-val ' + e.dir, e.pct);
  const prCell  = cell('ext-val price-ext', e.price);
  const icon    = '<span class="ext-clock">' + CLOCK + '</span>';
  if (order === 'target') {
    return icon + prCell + pctCell + ptCell;   // RTL: visual PT, %, price, icon
  }
  return icon + pctCell + ptCell + prCell;     // RTL: visual price, PT, %, icon
}

function renderAll() {
  document.getElementById('list').innerHTML = ROWS.map(r => {
    const up  = r.chg >= 0;
    const cls = up ? 'up' : 'down';
    const pt  = (up ? '+' : '') + r.chg.toFixed(2);
    return '<div class="row">' +
      '<div class="row-main">' +
        '<div class="row-ticker">' + r.sym + '</div>' +
        '<div class="row-name">' + r.name + '</div>' +
      '</div>' +
      '<div class="row-side">' +
        '<div class="price">' + r.price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</div>' +
        '<div class="change ' + cls + '">' + pt + ' (' + r.pctTxt + ')</div>' +
      '</div>' +
    '</div>' +
    '<div class="ext">' +
      '<div class="ext-label">' + CLOCK + '<span>' + r.ext.label + '</span></div>' +
      '<div class="ext-values">' + extValues(r.ext) + '</div>' +
    '</div>';
  }).join('');
}

renderAll();
</script>
</body>
</html>
