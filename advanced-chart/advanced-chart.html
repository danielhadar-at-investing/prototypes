<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Advanced Chart - SNDK - Investing.com iOS</title>
<style>
/* ============================================================
   INVESTING.COM iOS PROTOTYPE - Full-screen Advanced Chart (SNDK)
   iPhone 14 Pro - 393 x 852 portrait / 852 x 393 landscape
   Tokens from the iOS Design System Figma file.
   ============================================================ */

/* ---------- 1. DESIGN TOKENS (light) ---------- */
:root {
  --bg-primary:      #FFFFFF;
  --bg-primary-2:    #F8F8F8;
  --bg-primary-3:    #FFFFFF;
  --bg-secondary:    #EFEFEF;
  --bg-tertiary:     #F8F8F8;
  --bg-info:         #F1F7FF;

  --text-primary:    #000000;
  --text-secondary:  #8C8C8C;
  --text-secondary-2:#686869;
  --text-active:     #3372F6;

  --gray-1:          #949495;
  --gray-3:          #D6D6D6;
  --gray-4:          #E2E2E2;
  --glass:           rgba(148,148,149,.2);
  --orange:          #FFA500;
  --blue-bright:     #1E6EF4;
  --dark-blue:       #3C5C99;
  --green-up:        #008932;
  --red-down:        #E9152D;

  --divider:           #DEDEDE;
  --divider-secondary: #E7E7E8;
  --icon-primary:      #0D1016;
  --icon-secondary:    #8C8C8C;

  --pro-orange:      #FF6B00;
  --chrome-bg:       rgba(249,249,249,.94);
  --scrim:           rgba(0,0,0,.45);

  --price-up:   var(--green-up);
  --price-down: var(--red-down);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  --statusbar-h: 54px;
  --nav-h: 44px;
  --home-h: 34px;
  --margin: 16px;

  --ease-ios: cubic-bezier(.32,.72,0,1);
  --ease-spring: cubic-bezier(.34,1.38,.64,1);
}

/* ---------- 2. RESET ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font);
  background: #E8E8ED;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { display: block; }
.tnum { font-variant-numeric: tabular-nums; }
.up   { color: var(--price-up); }
.down { color: var(--price-down); }

/* ---------- 3. PAGE + STAGE ---------- */
.page {
  position: absolute; inset: 0 0 110px 0;
  display: flex; align-items: center; justify-content: center;
}
.stage { transform-origin: center center; transition: transform .5s var(--ease-ios); }

#phone {
  position: relative;
  width: 393px; height: 852px;
  border-radius: 47px;
  background: var(--bg-primary-3);
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 0 0 10px #1A1A1E, 0 0 0 11px rgba(255,255,255,.35), 0 30px 80px rgba(0,0,0,.22);
  transition: width .5s var(--ease-ios), height .5s var(--ease-ios);
}
#phone.landscape { width: 852px; height: 393px; }

.view {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg-primary-3);
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease;
}
.view.active { opacity: 1; pointer-events: auto; }

/* ---------- 4. STATUS BAR + DYNAMIC ISLAND ---------- */
.status-bar {
  position: relative;
  height: var(--statusbar-h); flex-shrink: 0;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px;
  background: var(--bg-primary-3);
  z-index: 10;
}
.status-time { font-size: 16px; font-weight: 600; letter-spacing: .2px; font-variant-numeric: tabular-nums; }
.status-icons { display: flex; align-items: center; gap: 6px; color: var(--text-primary); }
.dynamic-island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 125px; height: 36px; background: #000; border-radius: 20px;
}
.island-side {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 125px; background: #000; border-radius: 20px; z-index: 20;
}

/* ---------- 5. HOME INDICATOR ---------- */
.home-indicator { height: var(--home-h); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-primary-3); }
.home-indicator::after { content: ""; width: 134px; height: 5px; border-radius: 100px; background: var(--text-primary); opacity: .9; margin-bottom: 3px; }

/* ---------- 6. AI PILL ---------- */
.ai-pill {
  display: inline-flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 12px 0 6px;
  border-radius: 16px;
  border: .5px solid var(--divider);
  background: var(--bg-primary);
  font-size: 13px; font-weight: 510; color: var(--text-primary);
  transition: background .15s, transform .15s;
}
.ai-pill:active { background: var(--bg-secondary); transform: scale(.98); }
.ai-badge {
  height: 20px; padding: 0 6px; border-radius: 6px;
  background: var(--text-active); color: #FFF;
  font-size: 11px; font-weight: 700; letter-spacing: .2px;
  display: inline-flex; align-items: center; gap: 3px;
}
.ai-badge svg { width: 10px; height: 10px; }
.ai-pill.compact { height: 28px; border-radius: 14px; padding: 0 10px 0 5px; font-size: 12px; }
.ai-pill.compact .ai-badge { height: 18px; font-size: 10px; }

/* ---------- 9. CHART MODULE ---------- */
.chart-module {
  display: flex; flex-direction: column;
  flex: 1; min-height: 0;
  background: var(--bg-primary);
}
.chart-toolbar {
  height: 44px; flex-shrink: 0;
  display: flex; align-items: center; gap: 2px;
  padding: 0 8px;
  background: var(--bg-primary);
  position: relative; z-index: 2;
}
.chart-toolbar.top    { box-shadow: inset 0 -.5px 0 0 var(--divider); }
.chart-toolbar.bottom { box-shadow: inset 0 .5px 0 0 var(--divider); }
.tb-btn {
  height: 36px; min-width: 36px; padding: 0 7px;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  border-radius: 8px; color: var(--icon-primary);
  font-size: 15px; font-weight: 510; letter-spacing: -.2px;
  transition: background .15s;
  white-space: nowrap;
}
.tb-btn:active { background: rgba(128,128,128,.14); }
.tb-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.tb-btn svg.chev { width: 12px; height: 12px; color: var(--text-secondary); margin-left: 1px; }
.tb-btn.tb-text { padding: 0 8px; }
.tb-div { width: .5px; height: 20px; background: var(--divider); margin: 0 4px; flex-shrink: 0; }
.tb-spacer { flex: 1; }
.sym-pill {
  height: 32px; padding: 0 9px 0 8px;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 8px; background: var(--bg-secondary);
  font-size: 15px; font-weight: 700; letter-spacing: -.2px; color: var(--text-primary);
  transition: opacity .15s;
}
.sym-pill:active { opacity: .7; }
.sym-pill svg { width: 16px; height: 16px; color: var(--icon-primary); }
.sym-pill svg.chev { width: 12px; height: 12px; color: var(--text-secondary); }

.chart-area { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg-primary); }
.chart-svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; }

/* SVG styling */
.chart-svg line.grid { stroke: var(--divider-secondary); stroke-width: 1; shape-rendering: crispEdges; }
.chart-svg text.ax  { font-size: 11px; fill: var(--text-secondary); font-variant-numeric: tabular-nums; font-family: var(--font); }
.chart-svg .wm { font-size: 22px; font-weight: 700; fill: rgba(0,0,0,.09); letter-spacing: -.6px; font-family: var(--font); }
.chart-svg .cd.up   { fill: var(--price-up);   stroke: var(--price-up); }
.chart-svg .cd.down { fill: var(--price-down); stroke: var(--price-down); }
.chart-svg .cd line { stroke-width: 1; }
.chart-svg .cd rect { stroke-width: 1; }
.chart-svg .hollow .cd.up rect { fill: var(--bg-primary); }
.chart-svg .vol rect { opacity: .42; }
.chart-svg .vol rect.up { fill: var(--price-up); }
.chart-svg .vol rect.down { fill: var(--price-down); }
.chart-svg .lastline { stroke-dasharray: 3 3; stroke-width: 1; shape-rendering: crispEdges; }
.chart-svg .lastline.up   { stroke: var(--price-up); }
.chart-svg .lastline.down { stroke: var(--price-down); }
.chart-svg .tag text { fill: #FFF; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--font); }
.chart-svg .tag.up rect   { fill: var(--price-up); }
.chart-svg .tag.down rect { fill: var(--price-down); }
.chart-svg .tag.dark rect { fill: var(--icon-primary); }
.chart-svg .tag.blue rect { fill: var(--dark-blue); }
.chart-svg .tag.blue text { font-size: 12px; font-weight: 510; }
.chart-svg .xh { stroke: var(--gray-1); stroke-width: 1; stroke-dasharray: 4 3; shape-rendering: crispEdges; }
.chart-svg .pline { fill: none; stroke: var(--text-active); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.chart-svg .parea { fill: url(#areaGrad); }
.chart-svg .ohlc line { stroke-width: 1.4; }
.chart-svg .candles.intro > g { animation: candleIn .5s var(--ease-ios) both; transform-box: fill-box; transform-origin: center bottom; }
@keyframes candleIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Header overlay inside the chart */
.chart-head {
  position: absolute; top: 8px; left: 12px; right: 8px;
  pointer-events: none;
  font-size: 12px; line-height: 17px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden;
}
.ch-l1 { display: flex; align-items: baseline; gap: 6px; }
.ch-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.ch-chg  { font-size: 12px; font-weight: 510; }
.ch-int  { color: var(--text-secondary); }
.ch-l1.one-line { gap: 7px; }
.ch-l1.one-line .ch-l2 { margin-left: 2px; }
.ch-px-inline { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.ch-price { display: flex; align-items: baseline; gap: 8px; margin: 1px 0 3px; }
.ch-px { font-size: 22px; font-weight: 700; letter-spacing: -.4px; line-height: 26px; color: var(--text-primary); }
.ch-pchg { font-size: 13px; font-weight: 510; }
.ch-l2 { display: flex; gap: 7px; color: var(--text-secondary); }
.ch-l2 b { font-weight: 510; }
.ch-l2 .v { color: var(--text-primary); font-weight: 510; }
.ch-l3 { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--text-secondary-2); font-size: 11px; font-weight: 510; }
.ch-l3 .vol-v { color: var(--text-primary); font-variant-numeric: tabular-nums; }
.ch-l3::before { content: ""; width: 2px; height: 12px; border-radius: 1px; background: var(--gray-1); }

.reset-btn {
  position: absolute; right: 10px; bottom: 6px;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--bg-primary); border: .5px solid var(--divider);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  display: flex; align-items: center; justify-content: center;
  color: var(--icon-primary); z-index: 3;
  transition: transform .15s, background .15s;
}
.reset-btn:active { transform: scale(.94); background: var(--bg-secondary); }
.reset-btn svg { width: 18px; height: 18px; }

/* ---------- 7. FULL-SCREEN LAYOUT ---------- */
.chart-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#viewLandscape .chart-toolbar { padding: 0 59px; }
#viewLandscape .chart-toolbar.top { box-shadow: none; }
#viewLandscape .chart-toolbar.bottom { box-shadow: none; }
#viewLandscape .chart-area { margin: 0 59px; }
#viewLandscape .chart-head { right: 70px; }
#viewLandscape .chart-area::before,
#viewLandscape .chart-area::after { content: ""; position: absolute; left: 0; right: 0; height: .5px; background: var(--divider); z-index: 2; }
#viewLandscape .chart-area::before { top: 0; }
#viewLandscape .chart-area::after { bottom: 0; }
.home-zone-land { height: 21px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.home-zone-land::after { content: ""; width: 134px; height: 5px; border-radius: 100px; background: var(--text-primary); opacity: .9; margin-top: 2px; }

/* ---------- 12. SHEETS ---------- */
.backdrop {
  position: absolute; inset: 0; background: var(--scrim);
  opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40;
}
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  margin: 0 auto; max-width: 520px; max-height: 94%;
  display: flex; flex-direction: column;
  background: var(--bg-primary);
  border-radius: 16px 16px 0 0;
  padding: 8px 0 calc(var(--home-h) - 6px);
  transform: translateY(100%);
  transition: transform .34s var(--ease-ios);
  z-index: 41;
}
#phone.landscape .sheet { padding-bottom: 14px; }
.sheet.open { transform: translateY(0); }
.sheet-grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--gray-3); margin: 0 auto 10px; flex-shrink: 0; }
.sheet-title { font-size: 17px; font-weight: 510; letter-spacing: -.4px; text-align: center; padding: 0 16px 6px; flex-shrink: 0; }
.sheet-sub { font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: -4px; padding-bottom: 8px; }
.sheet-body { overflow-y: auto; min-height: 0; scrollbar-width: none; }
.sheet-body::-webkit-scrollbar { display: none; }
.row {
  display: flex; align-items: center; justify-content: space-between;
  min-height: 50px; padding: 0 var(--margin); position: relative;
  font-size: 15px; font-weight: 400; transition: background .15s;
}
.row:active { background: rgba(128,128,128,.1); }
.row + .row::before { content: ""; position: absolute; top: 0; left: var(--margin); right: 0; height: .5px; background: var(--divider); }
.row-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.row-sub { font-size: 12px; color: var(--text-secondary); }
.row-lead { display: flex; align-items: center; gap: 12px; }
.row-lead svg { width: 22px; height: 22px; color: var(--icon-primary); }
.row .check { width: 22px; height: 22px; color: var(--text-active); }
.row.destructive { color: var(--red-down); }
.row .toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--gray-4); position: relative; transition: background .2s; }
.row .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #FFF; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s var(--ease-ios); }
.row .toggle.on { background: var(--green-up); }
.row .toggle.on::after { transform: translateX(18px); }
.sheet-cancel { margin: 10px var(--margin) 0; height: 50px; border-radius: 6px; background: var(--glass); font-size: 17px; font-weight: 510; letter-spacing: -.4px; flex-shrink: 0; }
.sheet-cancel:active { opacity: .7; }
.search-field {
  margin: 4px var(--margin) 8px; height: 36px; border-radius: 10px;
  background: var(--bg-secondary); display: flex; align-items: center; gap: 6px; padding: 0 10px;
  color: var(--text-secondary); font-size: 16px;
}
.search-field svg { width: 18px; height: 18px; }
.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px var(--margin) 12px; }
.chip {
  height: 34px; padding: 0 14px; border-radius: 17px;
  background: var(--bg-tertiary); border: .5px solid var(--divider);
  font-size: 14px; font-weight: 510; color: var(--text-primary);
  transition: background .15s;
}
.chip.active { background: var(--text-primary); color: var(--bg-primary); border-color: transparent; }
.chip:active { opacity: .8; }
.ai-body { padding: 4px var(--margin) 8px; font-size: 14px; line-height: 20px; }
.ai-body p { margin-bottom: 10px; }
.ai-body p b { font-weight: 600; }
.ai-note { font-size: 12px; color: var(--text-secondary); line-height: 16px; }
.skeleton { height: 12px; border-radius: 4px; margin-bottom: 10px;
  background: linear-gradient(90deg, rgba(128,128,128,.10) 25%, rgba(128,128,128,.20) 37%, rgba(128,128,128,.10) 63%);
  background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* ---------- 13. TOAST ---------- */
#toast {
  position: fixed; bottom: 128px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: rgba(30,30,32,.94); color: #FFF;
  font-size: 14px; font-weight: 510;
  padding: 12px 18px; border-radius: 22px;
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 100; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 14. ORIENTATION PICKER (outside the phone) ---------- */
.picker-wrap {
  position: fixed; left: 0; right: 0; bottom: 26px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  z-index: 50;
}
.picker-caption { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #6B6B70; }
.orient-picker {
  position: relative; display: flex;
  width: 390px; height: 36px; padding: 2px; border-radius: 9px;
  background: rgba(118,118,128,.16);
}
.orient-thumb {
  position: absolute; top: 2px; left: 2px;
  width: calc(33.333% - 1.4px); height: 32px; border-radius: 7px;
  background: #FFF;
  box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
  transition: transform .32s var(--ease-ios);
}
.orient-picker[data-sel="landscape"] .orient-thumb { transform: translateX(100%); }
.orient-picker[data-sel="notes"] .orient-thumb { transform: translateX(200%); }
.orient-opt {
  position: relative; flex: 1; z-index: 1;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 13px; font-weight: 510; color: #3A3A3C;
  transition: color .2s, font-weight .2s;
}
.orient-opt.active { font-weight: 600; color: #000; }
.orient-opt svg { width: 15px; height: 15px; }
.orient-opt:not(.active):active { opacity: .6; }

/* ---------- 15. NOTES PANEL (picker third option) ---------- */
.page.hidden { display: none; }
#notesPanel {
  position: absolute; inset: 0 0 110px 0;
  display: none; justify-content: center; align-items: flex-start;
  padding: 48px 24px 24px; overflow-y: auto;
}
#notesPanel.show { display: flex; }
.notes-doc { width: 100%; max-width: 640px; }
.notes-file { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #6B6B70; margin-bottom: 14px; }
.notes-text {
  font-family: var(--font); font-size: 15px; line-height: 1.55; color: #1C1C1E;
  white-space: pre-wrap; overflow-wrap: anywhere; margin: 0;
}
.notes-text.muted { color: #6B6B70; font-size: 14px; }
</style>
</head>
<body>

<div class="page">
  <div class="stage" id="stage">
    <div id="phone">

      <!-- ================= PORTRAIT ================= -->
      <div class="view active" id="viewPortrait">
        <div class="status-bar">
          <div class="dynamic-island"></div>
          <div class="status-time">9:41</div>
          <div class="status-icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 11.5 6.2 8.9a3.6 3.6 0 0 1 4.6 0L8.5 11.5Zm5-5.6a8.6 8.6 0 0 0-10 0L2.1 4.3a10.6 10.6 0 0 1 12.8 0L13.5 5.9ZM11.6 7.6a5.9 5.9 0 0 0-6.2 0L4 6a7.9 7.9 0 0 1 9 0L11.6 7.6Z"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.2" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><path d="M24 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" fill-opacity=".4"/></svg>
          </div>
        </div>
        <div id="chartP" class="chart-wrap"></div>
        <div class="home-indicator"></div>
      </div>

      <!-- ================= LANDSCAPE ================= -->
      <div class="view" id="viewLandscape">
        <div class="island-side"></div>
        <div id="chartL" class="chart-wrap"></div>
        <div class="home-zone-land"></div>
      </div>

      <!-- OVERLAYS -->
      <div class="backdrop" id="backdrop" onclick="closeOverlays()"></div>
      <div class="sheet" id="sheet">
        <div class="sheet-grabber"></div>
        <div class="sheet-title" id="sheetTitle"></div>
        <div class="sheet-body" id="sheetBody"></div>
        <button class="sheet-cancel" onclick="closeOverlays()">Cancel</button>
      </div>

    </div>
  </div>
</div>

<div id="notesPanel">
  <div class="notes-doc">
    <div class="notes-file">notes.txt</div>
    <pre class="notes-text" id="notesText"></pre>
  </div>
</div>

<div class="picker-wrap">
  <div class="picker-caption">View</div>
  <div class="orient-picker" id="orientPicker" data-sel="portrait">
    <div class="orient-thumb"></div>
    <button class="orient-opt active" data-o="portrait" onclick="setMode('portrait')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6.5" y="2.5" width="11" height="19" rx="2.2"/><path d="M10.5 18.5h3" stroke-linecap="round"/></svg>

/* ============================================================
   CHART RENDERER (inline SVG, redraws on demand)
   ============================================================ */
function Chart(root, land) {
  this.root = root;
  this.land = land;
  this.svg = root.querySelector('.chart-svg');
  this.ohlcEl = root.querySelector('.ohlc-line');
  this.volEl = root.querySelector('.vol-line');
  this.hover = null;
  this.first = true;
  this.bind();
  /* Redraw whenever the SVG's box changes (orientation switch, window resize, late layout). */
  if (window.ResizeObserver) {
    this._ro = new ResizeObserver(() => {
      const w = this.svg.clientWidth, h = this.svg.clientHeight;
      if (w && h && (w !== this.W || h !== this.H)) this.draw();
    });
    this._ro.observe(this.svg);
  }
}

Chart.prototype.draw = function () {
  const svg = this.svg;
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return;
  this.W = W; this.H = H;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const AX = 64, XA = 24, HEAD = this.land ? 46 : 88;
  const plotW = W - AX;
  const plotBottom = H - XA;
  const volH = Math.round((plotBottom - HEAD) * 0.17);
  const priceBottom = plotBottom - volH - 10;
  const n = BARS.length;
  const slot = plotW / (n + 1.6);
  const xAt = i => slot * (i + 0.6);

  let lo = Infinity, hi = -Infinity, vmax = 0;
  BARS.forEach(b => { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); vmax = Math.max(vmax, b.v); });
  const pad = (hi - lo) * 0.05; lo -= pad; hi += pad;
  const yAt = p => priceBottom - (p - lo) / (hi - lo) * (priceBottom - HEAD);
  const pAt = y => lo + (priceBottom - y) / (priceBottom - HEAD) * (hi - lo);
  this.geom = { AX, XA, plotW, plotBottom, slot, xAt, yAt, pAt, HEAD, priceBottom, n };

  /* grid + y labels (extend below the price domain, like the web chart) */
  const step = niceStep((hi - lo) / 5);
  let grid = '', ylab = '';
  const yMin = 8, yMax = plotBottom - 4;
  const lastY = r(yAt(LAST.c)) + .5;
  const vStart = Math.floor(pAt(yMax) / step) * step, vEnd = pAt(yMin);
  for (let v = vStart; v <= vEnd; v += step) {
    const y = r(yAt(v)) + .5;
    if (y < yMin || y > yMax) continue;
    grid += `<line class="grid" x1="0" x2="${plotW}" y1="${y}" y2="${y}"/>`;
    if (Math.abs(y - lastY) > 15) ylab += `<text class="ax" x="${plotW + 8}" y="${y + 4}">${fmt(v)}</text>`;
  }

  /* volume */
  const bw = Math.max(3, Math.round(slot * 0.62));
  let vol = '';
  BARS.forEach((b, i) => {
    const h = Math.max(1, (b.v / vmax) * volH);
    vol += `<rect class="${b.c >= b.o ? 'up' : 'down'}" x="${(xAt(i) - bw / 2).toFixed(1)}" y="${(plotBottom - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}"/>`;
  });

  /* price series */
  let series = '';
  const type = state.type;
  if (type === 'candles' || type === 'hollow') {
    BARS.forEach((b, i) => {
      const x = r(xAt(i)) + .5;
      const up = b.c >= b.o;
      const yo = yAt(b.o), yc = yAt(b.c);
      const top = Math.min(yo, yc), hgt = Math.max(1, Math.abs(yo - yc));
      series += `<g class="cd ${up ? 'up' : 'down'}" style="animation-delay:${(i * 9)}ms">` +
        `<line x1="${x}" x2="${x}" y1="${yAt(b.h).toFixed(1)}" y2="${yAt(b.l).toFixed(1)}"/>` +
        `<rect x="${(x - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw}" height="${hgt.toFixed(1)}" rx=".5"/></g>`;
    });
    series = `<g class="candles ${type === 'hollow' ? 'hollow' : ''} ${this.first ? 'intro' : ''}">${series}</g>`;
  } else if (type === 'bars') {
    BARS.forEach((b, i) => {
      const x = r(xAt(i)) + .5, up = b.c >= b.o, t = Math.max(2, bw / 2);
      series += `<g class="cd ohlc ${up ? 'up' : 'down'}" style="animation-delay:${(i * 9)}ms">` +
        `<line x1="${x}" x2="${x}" y1="${yAt(b.h).toFixed(1)}" y2="${yAt(b.l).toFixed(1)}"/>` +
        `<line x1="${x - t}" x2="${x}" y1="${yAt(b.o).toFixed(1)}" y2="${yAt(b.o).toFixed(1)}"/>` +
        `<line x1="${x}" x2="${x + t}" y1="${yAt(b.c).toFixed(1)}" y2="${yAt(b.c).toFixed(1)}"/></g>`;
    });
    series = `<g class="candles ${this.first ? 'intro' : ''}">${series}</g>`;
  } else {
    const pts = BARS.map((b, i) => `${xAt(i).toFixed(1)},${yAt(b.c).toFixed(1)}`).join(' ');
    if (type === 'area') {
      series += `<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3372F6" stop-opacity=".22"/><stop offset="1" stop-color="#3372F6" stop-opacity="0"/></linearGradient></defs>`;
      series += `<path class="parea" d="M${xAt(0).toFixed(1)},${priceBottom} L${pts.replace(/ /g, ' L')} L${xAt(n - 1).toFixed(1)},${priceBottom} Z"/>`;
    }
    series += `<polyline class="pline" points="${pts}"/>`;
  }

  /* last price line + tag */
  const ly = r(yAt(LAST.c)) + .5;
  const lcls = LAST.c >= PREV.c ? 'up' : 'down';
  const lastp = `<line class="lastline ${lcls}" x1="0" x2="${plotW}" y1="${ly}" y2="${ly}"/>` +
    `<g class="tag ${lcls}"><rect x="${plotW + 3}" y="${ly - 10}" width="${AX - 6}" height="20" rx="4"/>` +
    `<text x="${plotW + AX / 2}" y="${ly + 4}" text-anchor="middle">${fmt(LAST.c)}</text></g>`;

  /* x labels */
  const every = Math.max(1, Math.round(n / Math.max(2, Math.floor(plotW / (this.land ? 56 : 62)))));
  let xlab = '';
  for (let i = 0; i < n - 1; i += every) {
    const lx = xAt(i), edge = lx < 18;
    xlab += `<text class="ax" x="${(edge ? 2 : lx).toFixed(1)}" y="${H - 8}" text-anchor="${edge ? 'start' : 'middle'}">${BARS[i].date}</text>`;
  }

  const wm = `<text class="wm" x="12" y="${plotBottom - 8}">Investing.com</text>`;

  svg.innerHTML = `<g class="gridg">${grid}</g>${wm}<g class="vol">${vol}</g>${series}${lastp}<g class="axes">${ylab}${xlab}</g><g class="xhg"></g>`;
  this.xh = svg.querySelector('.xhg');
  this.first = false;
  if (this.hover !== null) this.setHover(this.hover.i, this.hover.y); else this.updateHead(n - 1);
};

Chart.prototype.updateHead = function (i) {
  const b = BARS[i], prev = BARS[i - 1] || b;
  const up = b.c >= b.o;
  const c = up ? 'up' : 'down';
  const pct = (b.c - prev.c) / prev.c * 100;
  const pcls = pct >= 0 ? 'up' : 'down';
  this.ohlcEl.innerHTML =
    `<span><b>O:</b> <span class="v ${c}">${fmt(b.o)}</span></span>` +
    `<span><b>H:</b> <span class="v">${fmt(b.h)}</span></span>` +
    `<span><b>L:</b> <span class="v">${fmt(b.l)}</span></span>` +
    `<span><b>C:</b> <span class="v ${c}">${fmt(b.c)}</span>${this.land ? '' : ` <span class="${pcls}">(${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%)</span>`}</span>`;
  this.volEl.textContent = fmtVol(b.v);
};

Chart.prototype.setHover = function (i, py) {
  const g = this.geom; if (!g) return;
  i = clamp(i, 0, g.n - 1);
  py = clamp(py, 10, g.plotBottom - 2);
  this.hover = { i, y: py };
  const b = BARS[i];
  const x = r(g.xAt(i)) + .5;
  const yy = r(py) + .5;
  const price = g.pAt(py);
  const pw = 100;
  const px = clamp(x - pw / 2, 2, g.plotW - pw - 2);
  this.xh.innerHTML =
    `<line class="xh" x1="${x}" x2="${x}" y1="0" y2="${g.plotBottom}"/>` +
    `<line class="xh" x1="0" x2="${g.plotW}" y1="${yy}" y2="${yy}"/>` +
    `<g class="tag dark"><rect x="${g.plotW + 3}" y="${yy - 10}" width="${g.AX - 6}" height="20" rx="4"/>` +
    `<text x="${g.plotW + g.AX / 2}" y="${yy + 4}" text-anchor="middle">${fmt(price)}</text></g>` +
    `<g class="tag blue"><rect x="${px}" y="${g.plotBottom + 2}" width="${pw}" height="21" rx="5"/>` +
    `<text x="${px + pw / 2}" y="${g.plotBottom + 17}" text-anchor="middle">${b.date}, 2026</text></g>`;
  this.updateHead(i);
};

Chart.prototype.clear = function () {
  this.hover = null;
  if (this.xh) this.xh.innerHTML = '';
  if (this.geom) this.updateHead(this.geom.n - 1);
};

Chart.prototype.bind = function () {
  const svg = this.svg;
  const self = this;
  let down = false;
  function local(e) {
    const rect = svg.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / rect.width * self.W, y: (e.clientY - rect.top) / rect.height * self.H };
  }
  function move(e) {
    if (!self.geom) return;
    const p = local(e);
    if (p.x > self.geom.plotW) return;
    const i = Math.round(p.x / self.geom.slot - 0.6);
    self.setHover(i, p.y);
  }
  svg.addEventListener('pointerdown', e => { down = true; move(e); });
  svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || down) move(e); });
  svg.addEventListener('pointerup', e => { down = false; if (e.pointerType !== 'mouse') self.clear(); });
  svg.addEventListener('pointercancel', () => { down = false; self.clear(); });
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') self.clear(); });
};

/* ============================================================
   BUILD BOTH CHART MODULES
   ============================================================ */
document.getElementById('chartP').innerHTML = chartModuleHTML('chartModuleP', false);
document.getElementById('chartL').innerHTML = chartModuleHTML('chartModuleL', true);
const charts = {
  portrait:  new Chart(document.getElementById('chartModuleP'), false),
  landscape: new Chart(document.getElementById('chartModuleL'), true)
};
function drawAll() { charts[state.orientation].draw(); charts[state.orientation === 'portrait' ? 'landscape' : 'portrait'].first = true; }
function refreshLabels() {
  document.querySelectorAll('.interval-label').forEach(el => el.textContent = state.interval);
  document.querySelectorAll('.ch-int').forEach(el => el.innerHTML = '&middot; ' + state.interval);
  document.querySelectorAll('.range-label').forEach(el => el.textContent = state.range === 'Date range' ? 'Date range' : state.range);
  const t = TYPES.find(t => t.value === state.type);
  document.querySelectorAll('.type-icon').forEach(el => el.innerHTML = t.icon);
}

/* ============================================================
   ORIENTATION
   ============================================================ */
let switching = false;
function applyScale() {
  const land = state.orientation === 'landscape';
  const pw = land ? 852 : 393, ph = land ? 393 : 852;
  const availH = window.innerHeight - 150, availW = window.innerWidth - 40;
  const s = Math.min(1, availH / ph, availW / pw);
  document.getElementById('stage').style.transform = `scale(${s.toFixed(3)})`;
}
function setOrientation(o) {
  if (o === state.orientation || switching) return;
  switching = true;
  closeOverlays();
  const prev = state.orientation;
  state.orientation = o;
  const cur = document.getElementById(prev === 'portrait' ? 'viewPortrait' : 'viewLandscape');
  const next = document.getElementById(o === 'portrait' ? 'viewPortrait' : 'viewLandscape');
  charts[prev].clear();
  cur.classList.remove('active');
  const phone = document.getElementById('phone');
  let done = false;
  function finish() {
    if (done) return; done = true;
    phone.removeEventListener('transitionend', onEnd);
    charts[o].first = true;
    charts[o].draw();
    next.classList.add('active');
    switching = false;
  }
  function onEnd(e) { if (e.target === phone && e.propertyName === 'width') finish(); }
  setTimeout(() => {
    phone.addEventListener('transitionend', onEnd);
    phone.classList.toggle('landscape', o === 'landscape');
    applyScale();
    setTimeout(finish, 800);   /* fallback if transitionend never fires */
  }, 180);
}
window.addEventListener('resize', applyScale);

/* ============================================================
   VIEW MODE: portrait | landscape | notes (picker below the phone)
   ============================================================ */
let mode = 'portrait';
function syncPicker(m) {
  const picker = document.getElementById('orientPicker');
  picker.dataset.sel = m;
  picker.querySelectorAll('.orient-opt').forEach(b => b.classList.toggle('active', b.dataset.o === m));
}
function setMode(m) {
  if (m === mode) return;
  if (m !== 'notes' && switching) return;
  mode = m;
  syncPicker(m);
  const page = document.querySelector('.page');
  const panel = document.getElementById('notesPanel');
  if (m === 'notes') {
    closeOverlays();
    page.classList.add('hidden');
    panel.classList.add('show');
    loadNotes();
  } else {
    panel.classList.remove('show');
    page.classList.remove('hidden');
    setOrientation(m);
  }
}
function loadNotes() {
  const el = document.getElementById('notesText');
  const fail = () => { el.textContent = 'Could not load notes.txt. Open this page via the local server (python3 -m http.server) instead of file://.'; el.classList.add('muted'); };
  if (!window.fetch) { fail(); return; }
  fetch('notes.txt', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => { el.textContent = t; el.classList.remove('muted'); })
    .catch(fail);
}

/* ============================================================
   SHEETS
   ============================================================ */
const sheetEl = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
function openSheet(title, bodyHTML, sub) {
  document.getElementById('sheetTitle').innerHTML = title + (sub ? `<div class="sheet-sub">${sub}</div>` : '');
  sheetBody.innerHTML = bodyHTML;
  document.getElementById('backdrop').classList.add('open');
  sheetEl.classList.add('open');
}
function closeOverlays() {
  document.querySelectorAll('.sheet.open, .backdrop.open').forEach(el => el.classList.remove('open'));
}
function rowsHTML(items, selected) {
  return items.map(it =>
    `<div class="row ${it.destructive ? 'destructive' : ''}" data-pick="${it.value}">` +
      `<div class="row-lead">${it.icon || ''}<div class="row-main"><span>${it.label}</span>${it.sub ? `<span class="row-sub">${it.sub}</span>` : ''}</div></div>` +
      `${selected === it.value ? ICO.check : ''}` +
    `</div>`).join('');
}

const INTERVALS = ['1m','5m','15m','30m','1H','4H','1D','1W','1M'].map(v => ({ label: v === '1m' ? '1 minute' : v === '5m' ? '5 minutes' : v === '15m' ? '15 minutes' : v === '30m' ? '30 minutes' : v === '1H' ? '1 hour' : v === '4H' ? '4 hours' : v === '1D' ? '1 day' : v === '1W' ? '1 week' : '1 month', value: v, sub: v }));
const TYPES = [
  { label: 'Candles', value: 'candles', icon: ICO.candle },
  { label: 'Hollow candles', value: 'hollow', icon: ICO.hollow },
  { label: 'Bars', value: 'bars', icon: ICO.ohlc },
  { label: 'Line', value: 'line', icon: ICO.line },
  { label: 'Area', value: 'area', icon: ICO.area }
];
const INDICATORS = ['Volume', 'Moving Average (20)', 'Moving Average (50)', 'Bollinger Bands', 'RSI (14)', 'MACD', 'VWAP'];
const RANGES = ['1D','5D','1M','3M','6M','YTD','1Y','5Y','Max'];

let pickHandler = null;
function openPicker(title, items, selected, onPick, sub) {
  pickHandler = onPick;
  openSheet(title, rowsHTML(items, selected), sub);
}
function openMenu(title, items, sub) {
  pickHandler = v => toast(v);
  openSheet(title, rowsHTML(items.map(it => ({ label: it.label, value: it.toast || it.label, icon: it.icon, sub: it.sub, destructive: it.destructive })), null), sub);
}
function openIndicators() {
  pickHandler = null;
  openSheet('Indicators', INDICATORS.map(name =>
    `<div class="row" data-ind="${name}"><span>${name}</span><span class="toggle ${state.indicators[name] ? 'on' : ''}"></span></div>`).join(''),
    'Overlays and studies on the current chart');
}
function openRange() {
  pickHandler = null;
  openSheet('Date range',
    `<div class="chip-grid">${RANGES.map(v => `<button class="chip ${state.range === v ? 'active' : ''}" data-range="${v}">${v}</button>`).join('')}</div>` +
    `<div class="row" data-pick="__custom">${'<div class="row-lead">' + ICO.calendar + '<div class="row-main"><span>Custom range</span><span class="row-sub">Pick start and end dates</span></div></div>'}</div>`,
    'Showing daily bars, Jul 24 - Sep 23, 2026');
}
function openSymbolSearch() {
  pickHandler = v => toast('Switch to ' + v + ' (mock only)');
  const recents = [
    { label: 'SNDK', value: 'SNDK', sub: 'SanDisk Corp' },
    { label: 'WDC',  value: 'WDC',  sub: 'Western Digital Corp' },
    { label: 'MU',   value: 'MU',   sub: 'Micron Technology Inc' },
    { label: 'STX',  value: 'STX',  sub: 'Seagate Technology Holdings' },
    { label: 'NVDA', value: 'NVDA', sub: 'NVIDIA Corp' }
  ];
  openSheet('Symbol', `<div class="search-field">${ICO.search}<span>Search symbol or company</span></div>` + rowsHTML(recents, 'SNDK'));
}
function openAnalyze() {
  pickHandler = null;
  openSheet('AI chart analysis',
    `<div class="ai-body" id="aiBody"><div class="skeleton" style="width:92%"></div><div class="skeleton" style="width:78%"></div><div class="skeleton" style="width:86%"></div><div class="skeleton" style="width:60%"></div></div>`,
    'SNDK &middot; ' + state.interval + ' &middot; last 43 sessions');
  setTimeout(() => {
    const el = document.getElementById('aiBody'); if (!el) return;
    el.innerHTML =
      `<p><b>Trend.</b> Price recovered from the late-July low near 990 and has been trading in a 1,400 to 1,800 range since mid-August. The latest session gapped down 4.9% to 1,553.50 on above-average volume.</p>` +
      `<p><b>Levels.</b> Support sits around 1,500 (late-August lows). Resistance is the 1,790 to 1,815 zone tested on Aug 19 and Sep 10.</p>` +
      `<p><b>Volume.</b> Selling volume on down sessions has been fading since late July, while the Sep 10 breakout printed the highest volume of the period.</p>` +
      `<div class="ai-note">Generated from price and volume patterns for information only. Not investment advice.</div>`;
  }, 900);
}

/* Sheet interactions */
sheetBody.addEventListener('click', e => {
  const ind = e.target.closest('[data-ind]');
  if (ind) {
    const name = ind.dataset.ind;
    state.indicators[name] = !state.indicators[name];
    ind.querySelector('.toggle').classList.toggle('on', state.indicators[name]);
    toast((state.indicators[name] ? 'Added ' : 'Removed ') + name);
    return;
  }
  const chip = e.target.closest('[data-range]');
  if (chip) {
    state.range = chip.dataset.range;
    sheetBody.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.range === state.range));
    refreshLabels();
    setTimeout(closeOverlays, 160);
    return;
  }
  const row = e.target.closest('[data-pick]');
  if (row) {
    const v = row.dataset.pick;
    closeOverlays();
    if (v === '__custom') { toast('Custom date range'); return; }
    if (pickHandler) pickHandler(v);
  }
});

/* ============================================================
   ACTIONS (event delegation)
   ============================================================ */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  switch (act) {
    case 'symbol':     openSymbolSearch(); break;
    case 'interval':   openPicker('Interval', INTERVALS, state.interval, v => { state.interval = v; refreshLabels(); toast('Interval: ' + v); }); break;
    case 'type':       openPicker('Chart type', TYPES, state.type, v => { state.type = v; refreshLabels(); drawAll(); }); break;
    case 'indicators': openIndicators(); break;
    case 'templates':  openMenu('Templates', [
                         { label: 'Default', icon: ICO.folder, sub: 'Candles, Volume', toast: 'Template: Default' },
                         { label: 'Swing setup', icon: ICO.folder, sub: 'MA 20/50, RSI', toast: 'Template: Swing setup' },
                         { label: 'Momentum', icon: ICO.folder, sub: 'MACD, VWAP, Volume', toast: 'Template: Momentum' },
                         { label: 'Save current as template', icon: ICO.save, toast: 'Template saved' }
                       ]); break;
    case 'more':       openMenu('More', [
                         { label: 'Compare symbol', icon: ICO.compare, toast: 'Compare symbol' },
                         { label: 'Chart settings', icon: ICO.gear, toast: 'Chart settings' },
                         { label: 'Share chart', icon: ICO.share, toast: 'Share chart' },
                         { label: 'Reset chart', icon: ICO.reset, toast: 'Chart reset', destructive: true }
                       ]); break;
    case 'compare':    openMenu('Compare', [
                         { label: 'WDC', sub: 'Western Digital Corp', icon: ICO.compare, toast: 'Compare with WDC' },
                         { label: 'MU', sub: 'Micron Technology Inc', icon: ICO.compare, toast: 'Compare with MU' },
                         { label: 'SOX', sub: 'PHLX Semiconductor Index', icon: ICO.compare, toast: 'Compare with SOX' },
                         { label: 'Search another symbol', icon: ICO.search, toast: 'Search symbol' }
                       ], 'Overlay a second instrument'); break;
    case 'draw':       openMenu('Drawing tools', [
                         { label: 'Trend line', icon: ICO.trend, toast: 'Trend line' },
                         { label: 'Horizontal line', icon: ICO.hline, toast: 'Horizontal line' },
                         { label: 'Fibonacci retracement', icon: ICO.fib, toast: 'Fibonacci retracement' },
                         { label: 'Rectangle', icon: ICO.rect, toast: 'Rectangle' },
                         { label: 'Text', icon: ICO.text, toast: 'Text' },
                         { label: 'Clear all drawings', icon: ICO.trash, toast: 'Drawings cleared', destructive: true }
                       ]); break;
    case 'range':      openRange(); break;
    case 'exitfs':     toast('Would close the full-screen chart'); break;
    case 'reset':      charts[state.orientation].clear(); toast('Back to latest bar'); break;
    case 'analyze':    openAnalyze(); break;
  }
});

/* ============================================================
   INIT
   ============================================================ */
refreshLabels();
applyScale();
requestAnimationFrame(() => charts.portrait.draw());
</script>
