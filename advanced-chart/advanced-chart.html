<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Advanced Chart - SNDK - Investing.com iOS</title>
<style>
/* ============================================================
   INVESTING.COM iOS PROTOTYPE - Full-screen Advanced Chart (SNDK)
   iPhone 14 Pro - 393 x 852 portrait / 852 x 393 landscape
   Tokens from the iOS Design System Figma file.
   ============================================================ */

/* ---------- 1. DESIGN TOKENS (light) ---------- */
:root {
  --bg-primary:      #FFFFFF;
  --bg-primary-2:    #F8F8F8;
  --bg-primary-3:    #FFFFFF;
  --bg-secondary:    #EFEFEF;
  --bg-tertiary:     #F8F8F8;
  --bg-info:         #F1F7FF;

  --text-primary:    #000000;
  --text-secondary:  #8C8C8C;
  --text-secondary-2:#686869;
  --text-active:     #3372F6;

  --gray-1:          #949495;
  --gray-3:          #D6D6D6;
  --gray-4:          #E2E2E2;
  --glass:           rgba(148,148,149,.2);
  --orange:          #FFA500;
  --blue-bright:     #1E6EF4;
  --dark-blue:       #3C5C99;
  --green-up:        #008932;
  --red-down:        #E9152D;

  --divider:           #DEDEDE;
  --divider-secondary: #E7E7E8;
  --icon-primary:      #0D1016;
  --icon-secondary:    #8C8C8C;

  --pro-orange:      #FF6B00;
  --brand-sndk:      #E11B22;   /* SanDisk brand red, logo placeholder only */
  --accent-orange:   #F5822A;   /* Investing.com switch accent */
  --head-tint:       rgba(255,255,255,.72);
  --accent-bg:       rgba(255,107,0,.12);   /* active layout row tint (web uses #FFE4D1) */
  --cmp-1: #3A5BE0; --cmp-2: #D63864; --cmp-3: #F07B1F; --cmp-4: #3DBCC9; --cmp-5: #8BBE45;   /* compare series palette, in order of addition */
  --chip-bg: #F2F3F5; --chip-border: #E3E5E8;
  --chrome-bg:       rgba(249,249,249,.94);
  --scrim:           rgba(0,0,0,.45);

  --price-up:   var(--green-up);
  --price-down: var(--red-down);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  --statusbar-h: 54px;
  --nav-h: 44px;
  --home-h: 34px;
  --margin: 16px;

  --ease-ios: cubic-bezier(.32,.72,0,1);
  --ease-spring: cubic-bezier(.34,1.38,.64,1);
}

/* ---------- 2. RESET ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font);
  background: #E8E8ED;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { display: block; }
.tnum { font-variant-numeric: tabular-nums; }
.up   { color: var(--price-up); }
.down { color: var(--price-down); }

/* ---------- 3. PAGE + STAGE ---------- */
.page {
  position: absolute; inset: 0 0 110px 0;
  display: flex; align-items: center; justify-content: center;
}
.stage { transform-origin: center center; transition: transform .5s var(--ease-ios); }

#phone {
  position: relative;
  width: 393px; height: 852px;
  border-radius: 47px;
  background: var(--bg-primary-3);
  overflow: hidden; overflow: clip;
  box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 0 0 10px #1A1A1E, 0 0 0 11px rgba(255,255,255,.35), 0 30px 80px rgba(0,0,0,.22);
  transition: width .5s var(--ease-ios), height .5s var(--ease-ios);
}
#phone.landscape { width: 852px; height: 393px; }

.view {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg-primary-3);
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease;
}
.view.active { opacity: 1; pointer-events: auto; }

/* ---------- 4. STATUS BAR + DYNAMIC ISLAND ---------- */
.status-bar {
  position: relative;
  height: var(--statusbar-h); flex-shrink: 0;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px;
  background: var(--bg-primary-3);
  z-index: 10;
}
.status-time { font-size: 16px; font-weight: 600; letter-spacing: .2px; font-variant-numeric: tabular-nums; }
.status-icons { display: flex; align-items: center; gap: 6px; color: var(--text-primary); }
.dynamic-island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 125px; height: 36px; background: #000; border-radius: 20px;
}
.island-side {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 125px; background: #000; border-radius: 20px; z-index: 20;
}

/* ---------- 5. HOME INDICATOR ---------- */
.home-indicator { height: var(--home-h); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-primary-3); }
.home-indicator::after { content: ""; width: 134px; height: 5px; border-radius: 100px; background: var(--text-primary); opacity: .9; margin-bottom: 3px; }

/* ---------- 6. AI PILL ---------- */
/* "Analyze chart" pill over the plot, top-right, gradient border blue -> orange */
.an-wrap { position: absolute; top: 4px; right: 8px; display: flex; align-items: center; z-index: 3; transition: opacity .15s; }
#viewLandscape .an-wrap { right: 70px; }
.an-pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px 0 7px;   /* centre y=18, same as header row 1 (panel y 8 to 28); 4px below the top bar line */
  border-radius: 10px; border: 1.5px solid var(--text-primary);
  background: var(--bg-primary);
  font-size: 13px; font-weight: 600; color: var(--text-primary); white-space: nowrap;   /* same type as the company name */
  transition: transform .15s, opacity .15s;
}
.an-pill:active { transform: scale(.97); opacity: .85; }
.an-badge { width: 18px; height: 18px; border-radius: 5px; background: var(--text-primary); color: #FFF; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; letter-spacing: .2px; }
/* the name gives way (ellipsis) before the pill ever shrinks */
.ch-l1.ch-main { max-width: calc(100% - 140px); }
.ch-l1.one-line .ch-main { max-width: calc(100% - 140px); }
.ch-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 9. CHART MODULE ---------- */
.chart-module {
  display: flex; flex-direction: column;
  flex: 1; min-height: 0;
  background: var(--bg-primary);
}
.chart-toolbar {
  height: 44px; flex-shrink: 0;
  display: flex; align-items: center; gap: 2px;
  padding: 0 8px;
  background: var(--bg-primary);
  position: relative; z-index: 2;
}
.chart-toolbar.top    { box-shadow: inset 0 -.5px 0 0 var(--divider); }
.chart-toolbar.bottom { box-shadow: inset 0 .5px 0 0 var(--divider); }
.tb-btn {
  height: 44px; min-width: 36px; padding: 0 7px; position: relative;   /* 36px layout width, 44pt hit area via ::before */
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  border-radius: 10px; color: var(--icon-primary);
  font-size: 15px; font-weight: 510; letter-spacing: -.2px;
  transition: background .15s;
  white-space: nowrap;
}
.tb-btn::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; right: -1px; }   /* full 44px height, each button owns half the 2px gap */
.tb-btn:active { background: rgba(128,128,128,.14); }
.tb-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.tb-btn svg.chev { width: 12px; height: 12px; color: var(--text-secondary); margin-left: 1px; }
.tb-btn.tb-text { padding: 0 8px; }
.tb-btn.tb-sym { font-weight: 700; letter-spacing: -.2px; height: 32px; padding: 0 9px; margin-left: 4px; border: 1px solid var(--text-primary); border-radius: 8px; }   /* 1px black outline; the box's left edge sits on the header's left padding line (logo circle left edge) */
.tb-btn.tb-sym::before { top: -6px; bottom: -6px; }   /* keep the 44pt hit height */
#viewLandscape .tb-sym { margin-left: 12px; }
.chart-toolbar.three { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.tb-l, .tb-c, .tb-r { display: flex; align-items: center; gap: 2px; }
.tb-r { justify-self: end; }
.chart-toolbar.spread { justify-content: space-between; padding: 0 12px; }
.pencil-btn { position: relative; }
.pencil-btn.tool-on::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--text-active); border: 1.5px solid var(--bg-primary); }
.save-btn { position: relative; }
.save-dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--green-up); border: 1.5px solid var(--bg-primary); opacity: 0; transform: scale(.5); transition: opacity .15s, transform .15s var(--ease-spring); }
.save-btn.dirty .save-dot { opacity: 1; transform: none; }
.layout-btn { padding: 0 5px; }
.layout-btn .layout-name { font-size: 14px; font-weight: 510; letter-spacing: -.2px; max-width: 48px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 2px; }
.layout-btn .layout-name:empty, .layout-btn .layout-name:empty + .chev { display: none; }
#viewLandscape .layout-btn .layout-name { max-width: 110px; }
/* layouts list rows */
.lay-row { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px var(--margin); position: relative; transition: background .15s; }
.lay-row:active { background: rgba(128,128,128,.1); }
.lay-row + .lay-row::before { content: ""; position: absolute; top: 0; left: var(--margin); right: 0; height: .5px; background: var(--divider); }
.lay-glyph { width: 26px; height: 20px; border-radius: 3px; border: 1px solid var(--text-secondary-2); flex-shrink: 0; }
.lay-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.lay-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-sub { font-size: 12px; color: var(--text-secondary); }
.lay-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-active); flex-shrink: 0; }
.lay-empty { text-align: center; color: var(--text-secondary); font-size: 14px; line-height: 20px; padding: 40px 24px; }
.lay-empty b { display: block; color: var(--text-primary); font-weight: 600; font-size: 15px; margin-bottom: 4px; }
/* manage layouts */
.manage-body { display: flex; flex-direction: column; min-height: 0; height: 100%; }   /* fills the sheet body so the footer pins to the bottom */
.manage-list { flex: 1; overflow-y: auto; min-height: 0; padding: 4px 8px; }
.manage-list .lay-row { border-radius: 10px; padding: 6px 8px 6px 10px; }
.manage-list .lay-row + .lay-row::before { display: none; }
.manage-list .lay-row.active { background: var(--accent-bg); }
.lay-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.sort-row { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; font-size: 15px; }
.sort-row .check { width: 20px; height: 20px; color: var(--text-active); }
.lay-act { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--icon-secondary); }
.lay-act:active { background: rgba(128,128,128,.14); }
.lay-act.danger { color: var(--red-down); }
.lay-act svg { width: 18px; height: 18px; }
/* small menu inside a sheet ("..." on Layouts) */
.sheet-menu { position: absolute; top: 48px; right: 12px; width: 240px; z-index: 5; }
/* Layout Name modal */
.modal-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 60; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; padding: 24px; }
.modal-scrim.open { opacity: 1; pointer-events: auto; }
.modal { width: 100%; max-width: 340px; background: var(--bg-primary); border-radius: 16px; padding: 20px 20px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.22); transform: scale(.96); transition: transform .2s var(--ease-spring); }
.modal-scrim.open .modal { transform: none; }
.modal-title { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
.modal-sub { font-size: 15px; color: var(--text-secondary); line-height: 20px; margin: 4px 0 14px; }
.modal-input { width: 100%; height: 44px; border-radius: 10px; border: 1.5px solid var(--divider); padding: 0 12px; font: inherit; font-size: 16px; color: var(--text-primary); background: var(--bg-primary); outline: none; -webkit-appearance: none; appearance: none; }
.modal-input:focus { border-color: var(--text-active); box-shadow: 0 0 0 3px rgba(51,114,246,.18); }
.modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.btn-secondary { height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--divider); font-size: 15px; font-weight: 510; color: var(--text-primary); }
.btn-primary { height: 40px; padding: 0 16px; border-radius: 10px; background: var(--text-active); color: #FFF; font-size: 15px; font-weight: 600; transition: opacity .15s; }
.btn-primary:disabled { opacity: .4; }
/* toast with an action */
#toast .toast-act { margin-left: 12px; color: #7FB2FF; font-weight: 600; }
.tb-div { width: .5px; height: 20px; background: var(--divider); margin: 0 4px; flex-shrink: 0; }
.tb-sep { width: 1px; height: 20px; background: var(--divider); margin: 0 2px; flex-shrink: 0; align-self: center; }
.tb-spacer { flex: 1; }
.sym-pill {
  height: 32px; padding: 0 9px 0 8px;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 8px; background: var(--bg-secondary);
  font-size: 15px; font-weight: 700; letter-spacing: -.2px; color: var(--text-primary);
  transition: opacity .15s;
}
.sym-pill:active { opacity: .7; }
.sym-pill svg { width: 16px; height: 16px; color: var(--icon-primary); }
.sym-pill svg.chev { width: 12px; height: 12px; color: var(--text-secondary); }

.chart-area { position: relative; flex: 1; min-height: 0; overflow: hidden; overflow: clip; background: var(--bg-primary); }
.chart-svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.chart-svg.panning { cursor: grabbing; }

/* SVG styling */
.chart-svg line.grid { stroke: var(--divider-secondary); stroke-width: 1; shape-rendering: crispEdges; }
.chart-svg text.ax  { font-size: 11px; fill: var(--text-secondary); font-variant-numeric: tabular-nums; font-family: var(--font); }
.chart-svg text.ylab.under-pill, .chart-svg text.ylab.under-head { visibility: hidden; }
.chart-svg .wm { font-size: 22px; font-weight: 700; fill: rgba(0,0,0,.09); letter-spacing: -.6px; font-family: var(--font); }
.chart-svg .cd.up   { fill: var(--price-up);   stroke: var(--price-up); }
.chart-svg .cd.down { fill: var(--price-down); stroke: var(--price-down); }
.chart-svg .cd line { stroke-width: 1; }
.chart-svg .cd rect { stroke-width: 1; }
.chart-svg .hollow .cd.up rect { fill: var(--bg-primary); }
.chart-svg .vol rect { opacity: .42; }
.chart-svg .vol rect.up { fill: var(--price-up); }
.chart-svg .vol rect.down { fill: var(--price-down); }
.chart-svg .lastline { stroke-dasharray: 3 3; stroke-width: 1; shape-rendering: crispEdges; }
.chart-svg .lastline.up   { stroke: var(--price-up); }
.chart-svg .lastline.down { stroke: var(--price-down); }
.chart-svg .tag text { fill: #FFF; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--font); }
.chart-svg .tag.up rect   { fill: var(--price-up); }
.chart-svg .tag.down rect { fill: var(--price-down); }
.chart-svg .tag.dark rect { fill: var(--icon-primary); }
.chart-svg .tag.blue rect { fill: var(--dark-blue); }
.chart-svg .tag.blue text { font-size: 12px; font-weight: 510; }
.chart-svg .xhg { opacity: 0; transition: opacity .2s ease; }
.chart-svg .xhg.on { opacity: 1; transition-duration: .15s; }
.chart-svg .xh { stroke: var(--text-secondary-2); stroke-opacity: .6; stroke-width: 1; stroke-dasharray: 4 3; shape-rendering: crispEdges; }
.chart-svg .tag.dark.flick { animation: tagFlick .24s var(--ease-ios); transform-box: fill-box; transform-origin: center; }
@keyframes tagFlick { 0% { transform: scale(1); opacity: .6; } 45% { transform: scale(1.14); opacity: 1; } 100% { transform: scale(1); } }
.chart-svg .pline { fill: none; stroke: var(--text-active); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.chart-svg .parea { fill: url(#areaGrad); }
.chart-svg .pline.up { stroke: var(--price-up); }
.chart-svg .pline.down { stroke: var(--price-down); }
.chart-svg .bfill.up { fill: var(--price-up); opacity: .12; }
.chart-svg .bfill.down { fill: var(--price-down); opacity: .12; }
.chart-svg .baseline { stroke: var(--gray-1); stroke-width: 1; stroke-dasharray: 3 3; shape-rendering: crispEdges; }
.chart-svg .bricks rect { stroke-width: 1; stroke: var(--bg-primary); }
.chart-svg .bricks rect.up { fill: var(--price-up); }
.chart-svg .bricks rect.down { fill: var(--price-down); }
.chart-svg .bricks rect.down.hollow { fill: var(--bg-primary); stroke: var(--price-down); }
.chart-svg .kagi path { fill: none; stroke-linejoin: round; }
.chart-svg .kagi path.thick { stroke: var(--price-up); stroke-width: 2.4; }
.chart-svg .kagi path.thin { stroke: var(--price-down); stroke-width: 1; }
.chart-svg .pf line { stroke: var(--price-up); stroke-width: 1.2; }
.chart-svg .pf circle { stroke: var(--price-down); fill: none; stroke-width: 1.2; }
.chart-svg .ohlc line { stroke-width: 1.4; }
.chart-svg .candles.intro > g { animation: candleIn .5s var(--ease-ios) both; transform-box: fill-box; transform-origin: center bottom; }
@keyframes candleIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Header overlay inside the chart */
.chart-head {
  position: absolute; top: 8px; left: 12px; right: 8px;   /* starts at row 1's panel top so the logo circle is never clipped */
  pointer-events: none;
  font-size: 12px; line-height: 17px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: visible;   /* the crosshair rows are positioned over the chips row */
  display: flex; flex-direction: column; align-items: flex-start;
}
/* translucent panels: the plot runs behind the header, candles show through */
.ch-main, .ch-detail, .ch-price { background: var(--head-tint); border-radius: 6px; margin-left: -6px; }   /* one panel per row, each hugging its own text */
.ch-main { padding: 3px 6px; display: inline-flex; align-items: center; gap: 6px; }
.ch-l1.one-line .ch-main { gap: 7px; }
.ch-price { padding: 0 6px 1px; }
.ch-detail { padding: 2px 6px; margin-top: 2px; }
/* chips row and the long-press rows share one slot and cross-fade */
.ch-swap { position: relative; align-self: stretch; width: 100%; min-width: 0; }
.ch-details { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: flex-start; }
.ch-cmprow { display: none; align-items: center; gap: 8px; margin-top: 4px; width: 100%; min-width: 0; pointer-events: auto; opacity: 1; transition: opacity .2s ease; }
.chart-head.cmp .ch-cmprow { display: flex; }
.chart-head.xh .ch-cmprow { opacity: 0; pointer-events: none; transition-duration: .15s; }
.cmp-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 0; width: 0; min-width: 0; padding: 2px 0; }   /* definite width so the row scrolls instead of growing past the header */
.cmp-scroll::-webkit-scrollbar { display: none; }
.cmp-chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 10px; border-radius: 8px; background: var(--chip-bg); border: 1px solid var(--chip-border); font-size: 13px; font-weight: 600; color: var(--text-primary); flex-shrink: 0; }
.cmp-sw { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
.cmp-div { width: 1px; height: 14px; background: var(--chip-border); margin-left: 2px; }
.cmp-x { width: 24px; height: 28px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 15px; position: relative; }
.cmp-x::after { content: ""; position: absolute; inset: -8px -10px; }   /* 44pt hit area */
.cmp-x svg { width: 12px; height: 12px; }
.cmp-toggle { display: inline-flex; height: 28px; border-radius: 6px; overflow: hidden; border: 1px solid var(--chip-border); flex-shrink: 0; align-self: center; }
.cmp-toggle button { width: 32px; font-size: 13px; font-weight: 600; background: var(--chip-bg); color: var(--text-primary); position: relative; }
.cmp-toggle button::after { content: ""; position: absolute; inset: -8px 0; }
.cmp-toggle button.active { background: var(--text-active); color: #FFF; }
/* compare series on the chart */
.chart-svg .cline { fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.chart-svg .cline.base { stroke: var(--text-primary); }
.chart-svg .zero { stroke: var(--gray-1); stroke-width: 1; shape-rendering: crispEdges; }
.chart-svg .tag.cmp text { font-size: 10.5px; }
.chart-head.xh ~ .an-wrap { opacity: 0; pointer-events: none; }   /* pill steps aside while the crosshair rows are showing */
.ch-l1 { display: flex; align-items: center; gap: 6px; height: 20px; }
.ch-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.sym-logo { border-radius: 50%; color: #FFF; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 0; }
.sym-logo svg { width: 60%; height: 60%; }
.sheet.drawer.h-symbol { height: min(640px, 94%); }
/* O/H/L/C + Vol rows: hidden at rest, fade in and out together with the crosshair lines (same timings as .xhg) */
.ch-detail { opacity: 0; transition: opacity .2s ease; }
.chart-head.xh .ch-detail { opacity: 1; transition-duration: .15s; }
/* live tick flash on the price */
.live-px.flash-up { animation: flashUp .3s ease-out; }
.live-px.flash-down { animation: flashDown .3s ease-out; }
@keyframes flashUp { 0%, 40% { color: var(--price-up); } 100% { color: var(--text-primary); } }
@keyframes flashDown { 0%, 40% { color: var(--price-down); } 100% { color: var(--text-primary); } }
.ch-chg  { font-size: 12px; font-weight: 510; }
.ch-l1.one-line { gap: 7px; }
.ch-l1.one-line .ch-l2 { margin-left: 2px; }
.ch-px-inline { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.ch-price { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 3px -6px; }   /* row 2 starts at y=31, below the Analyze pill (bottom y=29) */
.ch-px { font-size: 22px; font-weight: 700; letter-spacing: -.4px; line-height: 26px; color: var(--text-primary); }
.ch-pchg { font-size: 13px; font-weight: 510; }
.ch-l2 { display: flex; gap: 7px; color: var(--text-secondary); font-size: 11px; }
.ch-l1.one-line .ch-l2 { font-size: 12px; }
.ch-l2 b { font-weight: 510; }
.ch-l2 .v { color: var(--text-primary); font-weight: 510; }
.ch-l3 { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--text-secondary-2); font-size: 11px; font-weight: 510; }
.ch-l3 .vol-v { color: var(--text-primary); font-variant-numeric: tabular-nums; }
.ch-l3::before { content: ""; width: 2px; height: 12px; border-radius: 1px; background: var(--gray-1); }

/* "Back to latest bar" (TradingView style): over the volume pane, just left of the price axis;
   only visible while the view is scrolled away from the latest bar */
.latest-btn {
  position: absolute; right: 70px; bottom: 38px;
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--bg-primary); border: 1px solid var(--divider);
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  display: flex; align-items: center; justify-content: center;
  color: var(--icon-primary); z-index: 3;
  opacity: 0; pointer-events: none;
  transition: opacity .15s ease, transform .15s, background .15s;
}
.latest-btn.show { opacity: 1; pointer-events: auto; }
.chart-module.settings-open .latest-btn { opacity: 0; pointer-events: none; }   /* keep clear of the settings popover */
.latest-btn:active { transform: scale(.94); background: var(--bg-secondary); }
.latest-btn svg { width: 22px; height: 22px; }
.gear-btn {
  position: absolute; right: 10px; bottom: 28px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg-primary); border: .5px solid var(--divider);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  display: flex; align-items: center; justify-content: center;
  color: var(--icon-secondary); z-index: 3;
}
.gear-btn::after { content: ""; position: absolute; inset: -8px; }   /* 44pt hit area */
.gear-btn:active { background: var(--bg-secondary); }
.gear-btn svg { width: 18px; height: 18px; }
/* popover cards (settings, event details) - normal light app UI */
.pop {
  position: absolute; z-index: 6; width: 260px;
  background: var(--bg-primary); border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,.16), 0 0 0 .5px var(--divider);
  padding: 10px 0 8px;
  opacity: 0; transform: translateY(6px) scale(.97); transform-origin: bottom right;
  pointer-events: none; transition: opacity .16s var(--ease-ios), transform .2s var(--ease-spring);
}
.pop.open { opacity: 1; transform: none; pointer-events: auto; }
.pop-head { font-size: 11px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; color: var(--text-secondary); padding: 2px 14px 6px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 14px; }   /* one cell height for every row, single-line rows centred */
.set-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.set-label { font-size: 14px; font-weight: 400; color: var(--text-primary); }
.set-sub { font-size: 11px; color: var(--text-secondary); }
.sw { width: 40px; height: 24px; border-radius: 12px; background: var(--gray-4); position: relative; flex-shrink: 0; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #FFF; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s var(--ease-ios); }
.sw.on { background: var(--accent-orange); }
.sw.on::after { transform: translateX(16px); }
.settings-pop { right: 10px; bottom: 62px; }
.set-div { height: .5px; background: var(--divider); margin: 4px 0; }
.set-row.set-action .set-label { color: var(--text-primary); }
.set-row.set-action svg { width: 14px; height: 14px; color: var(--text-secondary); }
/* event badges on the x-axis */
.chart-svg .ev circle { stroke: var(--bg-primary); stroke-width: 1.5; }
.chart-svg .ev.E circle { fill: var(--orange); }
.chart-svg .ev.D circle { fill: var(--dark-blue); }
.chart-svg .ev text { fill: #FFF; font-size: 10px; font-weight: 700; font-family: var(--font); pointer-events: none; }
.chart-svg .ev rect { fill: transparent; pointer-events: all; }
.ev-card { transform-origin: bottom center; padding: 12px 0 10px; }
.ev-card .ev-title { display: flex; align-items: center; gap: 8px; padding: 0 14px 8px; font-size: 15px; font-weight: 600; }
.ev-dot { width: 18px; height: 18px; border-radius: 50%; color: #FFF; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.ev-dot.E { background: var(--orange); }
.ev-dot.D { background: var(--dark-blue); }
.ev-row { display: flex; justify-content: space-between; padding: 5px 14px; font-size: 13px; color: var(--text-secondary); }
.ev-row b { font-weight: 510; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.ev-row b.down { color: var(--price-down); }
.ev-row b.up { color: var(--price-up); }
.ev-div { height: .5px; background: var(--divider); margin: 6px 14px; }
.ev-sub { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text-secondary); padding: 2px 14px 2px; }
.ev-btn { display: block; width: calc(100% - 28px); margin: 8px 14px 0; height: 38px; border-radius: 10px; background: var(--bg-secondary); font-size: 13px; font-weight: 510; color: var(--text-primary); }
.ev-btn:active { opacity: .7; }
.chart-svg .countdown text { fill: var(--text-secondary); font-size: 10px; font-variant-numeric: tabular-nums; font-family: var(--font); }

/* Create alert pill - attached to the crosshair price tag while the long-press crosshair is frozen */
.alert-pill {
  position: absolute; right: 3px; top: 0;
  height: 26px; padding: 0 10px 0 7px;
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 13px; background: var(--icon-primary); color: #FFF;
  font-size: 12px; font-weight: 600; letter-spacing: -.1px; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
  opacity: 0; transform: translateY(-6px) scale(.86); transform-origin: right top;
  pointer-events: none; z-index: 4;
  transition: opacity .18s var(--ease-ios), transform .26s var(--ease-spring);
}
.alert-pill.above { transform-origin: right bottom; transform: translateY(6px) scale(.86); }
.alert-pill.show { opacity: 1; transform: none; pointer-events: auto; }
.alert-pill:active { opacity: .82; }
.alert-pill svg { width: 15px; height: 15px; flex-shrink: 0; }

/* ---------- 7. FULL-SCREEN LAYOUT ---------- */
.chart-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#viewLandscape .chart-toolbar { padding: 0 59px; }
#viewLandscape .chart-toolbar.top { box-shadow: none; }
#viewLandscape .chart-toolbar.bottom { box-shadow: none; }
#viewLandscape .chart-area { margin: 0 59px; }
#viewLandscape .chart-head { right: 70px; }
#viewLandscape .chart-area::before,
#viewLandscape .chart-area::after { content: ""; position: absolute; left: 0; right: 0; height: .5px; background: var(--divider); z-index: 2; }
#viewLandscape .chart-area::before { top: 0; }
#viewLandscape .chart-area::after { bottom: 0; }
.home-zone-land { height: 21px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.home-zone-land::after { content: ""; width: 134px; height: 5px; border-radius: 100px; background: var(--text-primary); opacity: .9; margin-top: 2px; }

/* ---------- 12. SHEETS ---------- */
.backdrop {
  position: absolute; inset: 0; background: var(--scrim);
  opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40;
}
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  margin: 0 auto; max-width: 520px; max-height: 94%;
  display: flex; flex-direction: column;
  background: var(--bg-primary);
  border-radius: 16px 16px 0 0;
  padding: 8px 0 calc(var(--home-h) - 6px);
  transform: translateY(100%);
  transition: transform .34s var(--ease-ios);
  z-index: 41;
}
#phone.landscape .sheet { padding-bottom: 14px; }
/* drawers keep a fixed height across tabs, categories and search: the body scrolls inside */
.sheet.drawer.h-interval { height: min(560px, 94%); }
.sheet.drawer.h-type { height: min(500px, 94%); }
.sheet.drawer.h-draw { height: min(690px, 94%); }
.sheet.drawer .sheet-body { flex: 1; }
.sheet.open { transform: translateY(0); }
.sheet-grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--gray-3); margin: 0 auto 10px; flex-shrink: 0; }
.sheet-title { font-size: 17px; font-weight: 510; letter-spacing: -.4px; text-align: center; padding: 0 16px 6px; flex-shrink: 0; }
.sheet-sub { font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: -4px; padding-bottom: 8px; }
.sheet-body { overflow-y: auto; min-height: 0; scrollbar-width: none; }
.sheet-body::-webkit-scrollbar { display: none; }
.row {
  display: flex; align-items: center; justify-content: space-between;
  min-height: 50px; padding: 0 var(--margin); position: relative;
  font-size: 15px; font-weight: 400; transition: background .15s;
}
.row:active { background: rgba(128,128,128,.1); }
.row + .row::before { content: ""; position: absolute; top: 0; left: var(--margin); right: 0; height: .5px; background: var(--divider); }
.row-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.row-sub { font-size: 12px; color: var(--text-secondary); }
.row-lead { display: flex; align-items: center; gap: 12px; }
.row-lead svg { width: 22px; height: 22px; color: var(--icon-primary); }
.row .check { width: 22px; height: 22px; color: var(--text-active); }
.row.destructive { color: var(--red-down); }
.row .toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--gray-4); position: relative; transition: background .2s; }
.row .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #FFF; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s var(--ease-ios); }
.row .toggle.on { background: var(--green-up); }
.row .toggle.on::after { transform: translateX(18px); }
.sheet-x { position: absolute; top: 12px; left: 12px; width: 30px; height: 30px; border-radius: 50%; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; color: var(--icon-primary); z-index: 1; }   /* every sheet: X top-left */
.sheet-x::after { content: ""; position: absolute; inset: -7px; }   /* 44pt hit area */
.sheet-x svg { width: 14px; height: 14px; }
.sheet-actions { position: absolute; top: 9px; right: 10px; display: flex; align-items: center; gap: 2px; z-index: 1; }
.sheet-actions .tb-btn { height: 36px; min-width: 36px; }
.sheet-title { padding: 0 52px 6px; }
.sheet.share-sheet .sheet-x { top: 14px; background: rgba(120,120,128,.16); }
.sheet.drawer { padding-bottom: var(--home-h); }
.sheet-title.has-seg { padding: 0 52px 8px; }
.sheet.drawer.h-layouts { height: min(560px, 94%); }
.sheet.drawer.h-manage { height: 94%; }
/* native "Create New Alert" drawer mock */
.sheet.drawer.h-alert { height: min(560px, 94%); }
.sheet.h-alert .sheet-title { font-size: 20px; font-weight: 600; letter-spacing: -.4px; padding-bottom: 12px; }
.alert-cards { display: flex; flex-direction: column; gap: 12px; padding: 4px var(--margin) 12px; }
.alert-card { display: flex; align-items: center; gap: 14px; background: #F7F7F8; border-radius: 14px; padding: 16px; text-align: left; transition: background .15s; }
.alert-card:active { background: var(--bg-secondary); }
.alert-ico { width: 28px; height: 28px; flex-shrink: 0; color: var(--text-primary); }
.alert-ico svg { width: 28px; height: 28px; }
.alert-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.alert-title { font-size: 17px; font-weight: 600; letter-spacing: -.3px; color: var(--text-primary); }
.alert-sub { font-size: 15px; line-height: 20px; color: var(--text-secondary); white-space: normal; }
.alert-card .chev { width: 14px; height: 14px; color: var(--text-secondary); flex-shrink: 0; }
.seg { display: flex; padding: 2px; background: var(--bg-secondary); border-radius: 9px; }
.seg-opt { flex: 1; height: 32px; border-radius: 7px; font-size: 13px; font-weight: 510; letter-spacing: -.1px; color: var(--text-primary); }
.seg-opt { position: relative; }
.seg-opt::after { content: ""; position: absolute; left: 0; right: 0; top: -6px; bottom: -6px; }   /* 44pt hit area */
.seg-opt.active { background: var(--bg-primary); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.iv-title { font-size: 12px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; color: var(--text-secondary); padding: 10px var(--margin) 8px; }
.iv-row { display: flex; gap: 8px; overflow-x: auto; padding: 0 var(--margin) 12px; scrollbar-width: none; }
.iv-row::-webkit-scrollbar { display: none; }
.iv-chip { flex-shrink: 0; height: 44px; min-width: 54px; padding: 0 16px; border-radius: 12px; background: var(--bg-secondary); font-size: 15px; font-weight: 510; color: var(--text-primary); transition: background .15s; }
.iv-chip.active { background: var(--text-primary); color: var(--bg-primary); }
.iv-chip.disabled { opacity: .35; }
.iv-div { height: .5px; background: var(--divider); margin: 0 var(--margin); }
.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 4px var(--margin) 12px; }
.tcard { background: var(--bg-primary); border: 1px solid var(--divider); border-radius: 12px; min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px 6px; text-align: center; transition: background .15s; }
.tcard:active { background: var(--bg-tertiary); }
.tcard.sel { border: 2px solid var(--price-up); padding: 9px 5px; }
.tcard-ico svg { width: 28px; height: 28px; color: var(--icon-primary); display: block; }
.tcard-label { font-size: 15px; font-weight: 510; line-height: 18px; }
.tcard-label.sm { font-size: 14px; font-weight: 400; line-height: 16px; }
.search-field.input input { flex: 1; min-width: 0; background: transparent; border: 0; font: inherit; color: var(--text-primary); outline: none; -webkit-appearance: none; appearance: none; }
.search-field.input input::placeholder { color: var(--text-secondary); }
.cat-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px var(--margin) 10px; scrollbar-width: none; }
.cat-row::-webkit-scrollbar { display: none; }
.cat-row .chip { flex-shrink: 0; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--text-secondary); font-size: 14px; padding: 24px 0; }
.search-field {
  margin: 4px var(--margin) 8px; height: 36px; border-radius: 10px;
  background: var(--bg-secondary); display: flex; align-items: center; gap: 6px; padding: 0 10px;
  color: var(--text-secondary); font-size: 16px;
}
.search-field svg { width: 18px; height: 18px; }
.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px var(--margin) 12px; }
.chip {
  height: 34px; padding: 0 14px; border-radius: 17px;
  background: var(--bg-tertiary); border: .5px solid var(--divider);
  font-size: 14px; font-weight: 510; color: var(--text-primary);
  transition: background .15s;
}
.chip { position: relative; }
.chip::after { content: ""; position: absolute; left: 0; right: 0; top: -5px; bottom: -5px; }   /* 44pt hit area */
.chip.active { background: var(--text-primary); color: var(--bg-primary); border-color: transparent; }
.chip:active { opacity: .8; }
.ai-body { padding: 4px var(--margin) 8px; font-size: 14px; line-height: 20px; }
.ai-body p { margin-bottom: 10px; }
.ai-body p b { font-weight: 600; }
.ai-note { font-size: 12px; color: var(--text-secondary); line-height: 16px; }
.skeleton { height: 12px; border-radius: 4px; margin-bottom: 10px;
  background: linear-gradient(90deg, rgba(128,128,128,.10) 25%, rgba(128,128,128,.20) 37%, rgba(128,128,128,.10) 63%);
  background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* ---------- 12b. SHARE SHEET (iOS style) ---------- */
.share-sheet {
  background: rgba(242,242,247,.94); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
  border-radius: 24px 24px 0 0; padding: 8px 0 var(--home-h); max-height: 94%; overflow-y: auto; scrollbar-width: none;
  transition: transform .34s var(--ease-ios);
}
.share-sheet::-webkit-scrollbar { display: none; }
.share-sheet.dragging { transition: none; }
.sh-top { display: flex; align-items: center; gap: 12px; padding: 4px 16px 12px; }
.sh-thumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--gray-4); flex-shrink: 0; box-shadow: 0 0 0 .5px var(--divider); }
.sh-meta { min-width: 0; flex: 1; }
.sh-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-sub { font-size: 13px; color: var(--text-secondary); margin: 1px 0 6px; }
.sh-options { height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(120,120,128,.16); font-size: 13px; font-weight: 510; display: inline-flex; align-items: center; gap: 3px; }
.sh-options svg { width: 11px; height: 11px; color: var(--text-secondary); }
.sh-div { height: .5px; background: rgba(60,60,67,.2); margin: 0 16px; }
.sh-row { display: flex; gap: 14px; padding: 14px 16px; overflow-x: auto; scrollbar-width: none; }
.sh-row::-webkit-scrollbar { display: none; }
.sh-item { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; flex-shrink: 0; }
.sh-label { font-size: 11px; color: var(--text-primary); text-align: center; line-height: 13px; max-height: 26px; overflow: hidden; }
.sh-avatar { width: 60px; height: 60px; border-radius: 50%; background: #C7C7CC; color: #FFF; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; position: relative; }
.sh-badge { position: absolute; right: -3px; bottom: -3px; width: 24px; height: 24px; border-radius: 7px; border: 2px solid #F2F2F7; display: flex; align-items: center; justify-content: center; }
.sh-badge svg, .sh-app svg { width: 60%; height: 60%; }
.sh-app { width: 60px; height: 60px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
.airdrop { background: radial-gradient(circle at 50% 45%, #6FB3FF 0, #1E6EF4 60%, #0F4FCC 100%); color: #FFF; }
.messages { background: linear-gradient(#5AF777, #34C759); color: #FFF; }
.mail { background: linear-gradient(#5DB3FF, #1E6EF4); color: #FFF; }
.telegram { background: #2AABEE; color: #FFF; }
.notesapp { background: linear-gradient(#FFF3B0 0 30%, #FFFFFF 30%); color: #FFB300; }
.sh-action { width: 60px; height: 60px; border-radius: 50%; background: rgba(120,120,128,.14); color: var(--text-primary); display: flex; align-items: center; justify-content: center; }
.sh-action svg { width: 26px; height: 26px; }
.sh-item:active .sh-app, .sh-item:active .sh-action, .sh-item:active .sh-avatar { opacity: .7; }

/* ---------- 13. TOAST ---------- */
#toast {
  position: fixed; bottom: 128px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: rgba(30,30,32,.94); color: #FFF;
  font-size: 14px; font-weight: 510;
  padding: 12px 18px; border-radius: 22px;
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 100; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 14. ORIENTATION PICKER (outside the phone) ---------- */
.picker-wrap {
  position: fixed; left: 0; right: 0; bottom: 26px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  z-index: 50;
}
.picker-caption { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #6B6B70; }
.orient-picker {
  position: relative; display: flex;
  width: 390px; height: 36px; padding: 2px; border-radius: 9px;
  background: rgba(118,118,128,.16);
}
.orient-thumb {
  position: absolute; top: 2px; left: 2px;
  width: calc(33.333% - 1.4px); height: 32px; border-radius: 7px;
  background: #FFF;
  box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
  transition: transform .32s var(--ease-ios);
}
.orient-picker[data-sel="landscape"] .orient-thumb { transform: translateX(100%); }
.orient-picker[data-sel="notes"] .orient-thumb { transform: translateX(200%); }
.orient-opt {
  position: relative; flex: 1; z-index: 1;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 13px; font-weight: 510; color: #3A3A3C;
  transition: color .2s, font-weight .2s;
}
.orient-opt.active { font-weight: 600; color: #000; }
.orient-opt svg { width: 15px; height: 15px; }
.orient-opt:not(.active):active { opacity: .6; }

/* ---------- 15. NOTES PANEL (picker third option) ---------- */
.page.hidden { display: none; }
#notesPanel {
  position: absolute; inset: 0 0 110px 0;
  display: none; justify-content: center; align-items: flex-start;
  padding: 48px 24px 24px; overflow-y: auto;
}

/* Seeded random walk backwards from the first real open. Weekdays only, US market holidays skipped,
   mild forward drift (so earlier prices sit lower, like the run-up into July) and a soft anchor
   around 1,350 so the walk never wanders off to silly levels. Same bar schema as REAL. */
function seededRng(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function genHistory(count) {
  const rnd = seededRng(20260724);
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const HOL = ['2026-07-03', '2026-06-19', '2026-05-25', '2026-04-03', '2026-02-16', '2026-01-19'];
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const r2 = x => Math.round(x * 100) / 100;
  const out = [];
  const d = new Date(2026, RAW[0][0], RAW[0][1]);
  let nextOpen = RAW[0][2];
  while (out.length < count) {
    d.setDate(d.getDate() - 1);
    if (d.getDay() === 0 || d.getDay() === 6 || HOL.includes(iso(d))) continue;
    const c = nextOpen / (1 + gauss() * 0.006);
    const ret = 0.0025 + gauss() * 0.022 + (c - 1350) / 1350 * 0.01;
    const o = c / (1 + ret);
    const h = Math.max(o, c) * (1 + Math.abs(gauss()) * 0.011 + 0.002);
    const l = Math.min(o, c) * (1 - Math.abs(gauss()) * 0.011 - 0.002);
    const v = 3.5 + Math.abs(ret) * 180 + Math.abs(gauss()) * 1.5;
    out.unshift({ date: MON[d.getMonth()] + ' ' + d.getDate(), o: r2(o), h: r2(h), l: r2(l), c: r2(c), v: Math.round(v * 10) / 10 });
    nextOpen = o;
  }
  return out;
}

const CMP_SERIES = {};
function cmpSeries(sym) {
  if (CMP_SERIES[sym]) return CMP_SERIES[sym];
  const [level, vol] = CMP_LEVELS[sym] || [100, 0.015];
  let seed = 7; for (const ch of sym) seed = seed * 31 + ch.charCodeAt(0);
  const rnd = seededRng(seed | 0);
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const n = BARS.length, out = new Array(n);
  let p = level * (1 + (gauss() * 0.04));
  for (let i = 0; i < n; i++) { p = p * (1 + gauss() * vol + (level - p) / level * 0.004); out[i] = Math.round(p * 100) / 100; }
  /* land near the nominal level on the latest bar so the tag reads like the reference */
  const k = level / out[n - 1]; for (let i = 0; i < n; i++) out[i] = Math.round(out[i] * k * 100) / 100;
  CMP_SERIES[sym] = out; return out;

/* Heikin Ashi series derived from the daily bars */
const HA = (() => {
  const out = [];
  BARS.forEach((b, i) => {
    const c = (b.o + b.h + b.l + b.c) / 4;
    const o = i ? (out[i - 1].o + out[i - 1].c) / 2 : (b.o + b.c) / 2;
    out.push({ date: b.date, o, h: Math.max(b.h, o, c), l: Math.min(b.l, o, c), c, v: b.v });
  });

})();

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  const s = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10;
  return s * p;
}
