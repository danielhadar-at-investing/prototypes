      <button class="zoom-btn" data-act="zoom-default" aria-label="Zoom to default">${ICO.zoomReset}</button>
      <button class="gear-btn" data-act="settings" aria-label="Chart settings">${ICO.cog}</button>
      <div class="pop settings-pop"></div>
      <div class="pop ev-card"></div>
      <div class="an-wrap"><button class="an-pill" data-act="analyze"><span class="an-badge">AI</span>Analyze Chart</button></div>
    </div>
    ${bottomBar}
  </div>`;
}

/* ============================================================
   CHART RENDERER (inline SVG, redraws on demand)
   ============================================================ */
function Chart(root, land) {
  this.root = root;
  this.land = land;
  this.svg = root.querySelector('.chart-svg');
  this.ohlcEl = root.querySelector('.ohlc-line');
  this.volEl = root.querySelector('.vol-line');
  this.head = root.querySelector('.chart-head');
  this.pxEl = root.querySelector('.live-px');
  this.chgEl = root.querySelector('.live-chg');
  this.settingsEl = root.querySelector('.settings-pop');
  this.evCard = root.querySelector('.ev-card');
  this.evOpen = null;
  this.latestBtn = root.querySelector('.latest-btn');
  this.zoomBtn = root.querySelector('.zoom-btn');
  this._zoomAnim = 0;
  this._anim = 0;
  this.hover = null;
  this.frozen = false;      /* long-press crosshair left on screen after finger lift */
  this.first = true;
  /* Visible window: `count` bars, `start` = absolute index of the left-most bar (fractional while panning). */
  const count = land ? 56 : 30;
  this.defaultCount = count;
  this.view = { count, start: Math.max(0, BARS.length - count) };
  /* Create alert pill lives in the DOM (not the SVG) so it is a real tap target above the chart. */
  this.pill = document.createElement('button');
  this.pill.className = 'alert-pill';
  this.pill.setAttribute('aria-label', 'Create alert');
  this.pill.innerHTML = ICO.bellPlain + '<span>Create alert</span>';
  root.querySelector('.chart-area').appendChild(this.pill);
  this.pill.addEventListener('click', e => { e.stopPropagation(); this.createAlert(); });
  this.bind();
  /* Redraw whenever the SVG's box changes (orientation switch, window resize, late layout). */
  if (window.ResizeObserver) {
    this._ro = new ResizeObserver(() => {
      const w = this.svg.clientWidth, h = this.svg.clientHeight;
      if (w && h && (w !== this.W || h !== this.H)) this.draw();
    });
    this._ro.observe(this.svg);
  }
}

Chart.prototype.draw = function () {
  const svg = this.svg;
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return;
  this.W = W; this.H = H;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const AX = 64, XA = 24;
  const HEAD = this.land ? 20 : 40;   /* constant: the header (name, price, chips, legend, crosshair row) is a transparent overlay and never pushes the plot down */
  const plotW = W - AX;
  const plotBottom = H - XA;
  const cmp = state.compare, cmpPct = cmp.length > 0 && state.cmpMode === '%';
  const cmpData = cmp.map(c => ({ ci: c.ci, sym: c.sym, col: cmpColor(c), data: cmpSeries(c.sym) }));
  const volOn = hasStudy('Vol');   /* one shared pane while any Vol instance is visible */
  const volH = volOn ? Math.round((plotBottom - HEAD) * 0.17) : 0;   /* the volume pane stays in both compare views; off when the Vol study is removed */
  const priceBottom = plotBottom - volH - (volOn ? 10 : 4);
  const N = BARS.length;
  const view = this.view;
  view.count = Math.min(view.count, N);
  view.start = clamp(view.start, 0, N - view.count);
  const slot = plotW / (view.count + 1.6);
  const xAt = i => slot * (i - view.start + 0.6);
  const bw = Math.max(3, Math.round(slot * 0.62));
  /* bars to draw: one extra on each side so a half-clipped candle still renders mid-pan */
  const i0 = clamp(Math.floor(view.start) - 1, 0, N - 1);
  const i1 = clamp(Math.ceil(view.start + view.count) + 1, 0, N - 1);
  /* bars fully inside the plot (crosshair range) */
  const vis0 = clamp(Math.ceil(view.start - 0.6), 0, N - 1);
  const vis1 = clamp(Math.floor(view.start + view.count + 1), 0, N - 1);

  /* y-scale from the bars actually inside the plot (Heikin Ashi draws its own derived series) */
  const D = state.type === 'heikin' ? HA : BARS;
  let lo = Infinity, hi = -Infinity, vmax = 0;
  /* percent view: every series rebased on its first visible bar */
  const baseI = vis0;
  const pctOf = (arr, i) => (arr[i] / arr[baseI] - 1) * 100;
  const sndkC = D.map(b => b.c);
  for (let i = i0; i <= i1; i++) {
    const x = xAt(i); if (x < -bw / 2 || x > plotW + bw / 2) continue;
    vmax = Math.max(vmax, D[i].v);   /* volume scale is the same in every view */
    if (cmpPct) {
      const p = pctOf(sndkC, i); lo = Math.min(lo, p); hi = Math.max(hi, p);
      cmpData.forEach(c => { const q = pctOf(c.data, i); lo = Math.min(lo, q); hi = Math.max(hi, q); });
    } else {
      const b = D[i]; lo = Math.min(lo, b.l); hi = Math.max(hi, b.h);
      cmpData.forEach(c => { lo = Math.min(lo, c.data[i]); hi = Math.max(hi, c.data[i]); });   /* shared price axis */
    }
  }
  if (!isFinite(lo)) { lo = cmpPct ? -1 : LAST.l; hi = cmpPct ? 1 : LAST.h; vmax = LAST.v; }
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.05; lo -= pad; hi += pad;
  if (!cmpPct && lo < 0) lo = 0;   /* a shared price axis never dips below zero */
  /* price <-> y, with optional logarithmic and inverted scale */
  const S = state.settings, useLog = S.log && lo > 0 && !cmpPct;
  const f = useLog ? Math.log : (v => v), fi = useLog ? Math.exp : (v => v);
  let flo = f(lo), fhi = f(hi);
  /* manual price scale (axis drag / pinch): span = k x auto-fit span, centre = auto-fit centre + o x auto-fit span.
     Both are relative to the auto-fit of the visible bars, so on pan the scale keeps its zoom factor and follows the candles. */
  const aS = fhi - flo, aC = (flo + fhi) / 2;
  this.autoY = { S: aS, C: aC };
  if (this.pz) { const sp = aS * this.pz.k, cc = aC + this.pz.o * aS; flo = cc - sp / 2; fhi = cc + sp / 2; }
  this.fY = { f, flo, fhi };
  const yLin = p => priceBottom - (f(p) - flo) / (fhi - flo) * (priceBottom - HEAD);
  const pLin = y => fi(flo + (priceBottom - y) / (priceBottom - HEAD) * (fhi - flo));
  const yAt = S.invert ? (p => HEAD + priceBottom - yLin(p)) : yLin;
  const pAt = S.invert ? (y => pLin(HEAD + priceBottom - y)) : pLin;
  this.geom = { AX, XA, plotW, plotBottom, slot, xAt, yAt, pAt, HEAD, priceBottom, n: N, vis0, vis1, pct: cmpPct };

  /* last price line + tag (only while the latest close is inside the visible price range) */
  const yMin = 8, yMax = plotBottom - 4;
  const ly = r(yAt(LAST.c)) + .5;
  const showLast = !cmpPct && ly >= yMin + 6 && ly <= yMax - 6;

  /* compare tags at the right axis: one per series at its last visible value, stacked apart */
  const lastVis = Math.min(vis1, N - 1);
  const tagItems = [];
  if (cmp.length) {
    if (cmpPct) tagItems.push({ color: 'var(--text-primary)', text: fmtPct(pctOf(sndkC, lastVis)), y: yAt(pctOf(sndkC, lastVis)) });
    cmpData.forEach(c => { const v = cmpPct ? pctOf(c.data, lastVis) : c.data[lastVis]; tagItems.push({ color: c.col, text: cmpPct ? fmtPct(v) : fmt(v), y: yAt(v) }); });
    tagItems.sort((a, b) => a.y - b.y);
    /* keep the stack below the chips row (it overlays the plot top) and inside the plot */
    const cr = this.root.querySelector('.ch-cmprow'); const crB = cr && cr.offsetParent ? cr.getBoundingClientRect().bottom - svg.getBoundingClientRect().top : 0;
    const minTagY = Math.max(yMin + 10, crB + 12);
    for (let k = 0; k < tagItems.length; k++) { const lim = k ? tagItems[k - 1].y + 21 : minTagY; if (tagItems[k].y < lim) tagItems[k].y = lim; }
    const maxY = plotBottom - 44;   /* above the gear / latest buttons in the bottom-right corner */
    for (let k = tagItems.length - 1; k >= 0; k--) { const lim = k === tagItems.length - 1 ? maxY : tagItems[k + 1].y - 21; if (tagItems[k].y > lim) tagItems[k].y = lim; }
  }
  const cmpTags = tagItems.map(it => `<g class="tag cmp"><rect x="${plotW + 3}" y="${(r(it.y) - 9.5).toFixed(1)}" width="${AX - 6}" height="19" rx="4" style="fill:${it.color}"/><text x="${plotW + AX / 2}" y="${(r(it.y) + 3.5).toFixed(1)}" text-anchor="middle">${it.text}</text></g>`).join('');
  const nearTag = y => (showLast && Math.abs(y - ly) <= 15) || tagItems.some(it => Math.abs(y - it.y) <= 10);   /* compare tags are drawn over the labels; only hide a label the tag would cover */

  /* grid + y labels (extend below the price domain, like the web chart) */
  const step = niceStep((hi - lo) / 5 * (this.pz ? this.pz.k : 1));
  let grid = '', ylab = '';
  const vLo = Math.min(pAt(yMin), pAt(yMax)), vHi = Math.max(pAt(yMin), pAt(yMax));
  const vStart = Math.floor(vLo / step) * step, vEnd = vHi;
  for (let v = vStart; v <= vEnd; v += step) {
    const y = r(yAt(v)) + .5;
    if (y < yMin || y > yMax || (!cmpPct && v < 0)) continue;   /* a zoomed-out price axis shows no negative prices */
    grid += `<line class="grid" x1="0" x2="${plotW}" y1="${y}" y2="${y}"/>`;
    if (y > plotBottom - 40) { grid += `<line class="grid" x1="0" x2="${plotW}" y1="${y}" y2="${y}"/>`; continue; }   /* no label under the gear / reset buttons */
    if (!nearTag(y)) ylab += `<text class="ax ylab" x="${plotW + 8}" y="${y + 4}">${cmpPct ? fmtPct(v) : fmt(v)}</text>`;
  }

  /* volume */
  let vol = '';
  for (let i = volOn ? i0 : i1 + 1; i <= i1; i++) {
    const b = BARS[i];
    const h = Math.max(1, (b.v / vmax) * volH);
    vol += `<rect class="${b.c >= b.o ? 'up' : 'down'}" x="${(xAt(i) - bw / 2).toFixed(1)}" y="${(plotBottom - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}"/>`;
  }

  /* price series */
  let series = '';
  const type = cmpPct ? 'pctline' : state.type;   /* the chart type is kept but ignored in the percent view */
  const intro = this.first ? 'intro' : '';
  const brick = niceStep((hi - lo) / 12);      /* box size for Renko, Line Break, Kagi and P&F, from the visible range */
  const clipId = 'plotClip-' + this.root.id;
  const candle = (b, i, hollowUp) => {
    const x = r(xAt(i)) + .5;
    const up = b.c >= b.o;
    const yo = yAt(b.o), yc = yAt(b.c);
    const top = Math.min(yo, yc), hgt = Math.max(1, Math.abs(yo - yc));
    return `<g class="cd ${up ? 'up' : 'down'}" style="animation-delay:${((i - i0) * 9)}ms">` +
      `<line x1="${x}" x2="${x}" y1="${yAt(b.h).toFixed(1)}" y2="${yAt(b.l).toFixed(1)}"/>` +
      `<rect x="${(x - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw}" height="${hgt.toFixed(1)}" rx=".5"/></g>`;
  };
  if (type === 'candles' || type === 'hollow' || type === 'heikin') {
    for (let i = i0; i <= i1; i++) series += candle(D[i], i);
    series = `<g class="candles ${type === 'hollow' ? 'hollow' : ''} ${intro}">${series}</g>`;
  } else if (type === 'bars') {
    for (let i = i0; i <= i1; i++) {
      const b = D[i];
      const x = r(xAt(i)) + .5, up = b.c >= b.o, t = Math.max(2, bw / 2);
      series += `<g class="cd ohlc ${up ? 'up' : 'down'}" style="animation-delay:${((i - i0) * 9)}ms">` +
        `<line x1="${x}" x2="${x}" y1="${yAt(b.h).toFixed(1)}" y2="${yAt(b.l).toFixed(1)}"/>` +
        `<line x1="${x - t}" x2="${x}" y1="${yAt(b.o).toFixed(1)}" y2="${yAt(b.o).toFixed(1)}"/>` +
        `<line x1="${x}" x2="${x + t}" y1="${yAt(b.c).toFixed(1)}" y2="${yAt(b.c).toFixed(1)}"/></g>`;
    }
    series = `<g class="candles ${intro}">${series}</g>`;
  } else if (type === 'line' || type === 'area') {
    const pts = [];
    for (let i = i0; i <= i1; i++) pts.push(`${xAt(i).toFixed(1)},${yAt(D[i].c).toFixed(1)}`);
    if (type === 'area') {
      series += `<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3372F6" stop-opacity=".22"/><stop offset="1" stop-color="#3372F6" stop-opacity="0"/></linearGradient></defs>`;
      series += `<path class="parea" d="M${xAt(i0).toFixed(1)},${priceBottom} L${pts.join(' L')} L${xAt(i1).toFixed(1)},${priceBottom} Z"/>`;
    }
    series += `<polyline class="pline" points="${pts.join(' ')}"/>`;
  } else if (type === 'baseline') {
    /* baseline at the middle of the visible range: green above, red below */
    const by = yAt((lo + hi) / 2).toFixed(1);
    const pts = [];
    for (let i = i0; i <= i1; i++) pts.push(`${xAt(i).toFixed(1)},${yAt(D[i].c).toFixed(1)}`);
    const fillPath = `M${xAt(i0).toFixed(1)},${by} L${pts.join(' L')} L${xAt(i1).toFixed(1)},${by} Z`;
    series += `<defs><clipPath id="${clipId}-up"><rect x="0" y="0" width="${plotW}" height="${by}"/></clipPath>` +
      `<clipPath id="${clipId}-dn"><rect x="0" y="${by}" width="${plotW}" height="${(plotBottom - by).toFixed(1)}"/></clipPath></defs>`;
    series += `<line class="baseline" x1="0" x2="${plotW}" y1="${by}" y2="${by}"/>`;
    series += `<g clip-path="url(#${clipId}-up)"><path class="bfill up" d="${fillPath}"/><polyline class="pline up" points="${pts.join(' ')}"/></g>`;
    series += `<g clip-path="url(#${clipId}-dn)"><path class="bfill down" d="${fillPath}"/><polyline class="pline down" points="${pts.join(' ')}"/></g>`;
  } else if (type === 'renko') {
    /* time-aligned Renko: the bricks a session completes are stacked in that session's slot */
    let level = Math.round(D[i0].c / brick) * brick;
    const bh = (yAt(0) - yAt(brick)).toFixed(1), brw = 9;   /* fixed brick width so bricks read as bricks at any density */
    for (let i = i0 + 1; i <= i1; i++) {
      const c = D[i].c, x = (xAt(i) - brw / 2).toFixed(1);
      while (c >= level + brick) { level += brick; series += `<rect class="up" x="${x}" y="${yAt(level).toFixed(1)}" width="${brw}" height="${bh}"/>`; }
      while (c <= level - brick) { series += `<rect class="down" x="${x}" y="${yAt(level).toFixed(1)}" width="${brw}" height="${bh}"/>`; level -= brick; }
    }
    series = `<g class="bricks">${series}</g>`;
  } else if (type === 'linebreak') {
    /* three-line break: a new line only when the close breaks the last three lines */
    const lines = [D[i0].c];
    for (let i = i0 + 1; i <= i1; i++) {
      const c = D[i].c, recent = lines.slice(-3), prev = lines[lines.length - 1];
      if (c > Math.max(...recent) || c < Math.min(...recent)) {
        const up = c > prev;
        const y1 = yAt(Math.max(c, prev)), y2 = yAt(Math.min(c, prev));
        const brw = Math.max(6, bw);
        series += `<rect class="${up ? 'up' : 'down hollow'}" x="${(xAt(i) - brw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${brw}" height="${Math.max(1, y2 - y1).toFixed(1)}"/>`;
        lines.push(c);
      }
    }
    series = `<g class="bricks">${series}</g>`;
  } else if (type === 'kagi') {
    /* step line: extend in the current direction, reverse only after a move of one box against it;
       up moves thick (yang), down moves thin (yin) */
    let dir = 0, lvl = D[i0].c, x = xAt(i0), thick = '', thin = '';
    for (let i = i0 + 1; i <= i1; i++) {
      const c = D[i].c;
      const cont = (dir >= 0 && c > lvl) || (dir <= 0 && c < lvl);
      const rev = !cont && Math.abs(c - lvl) >= brick;
      if (!cont && !rev) continue;
      const nx = xAt(i);
      const seg = `M${x.toFixed(1)},${yAt(lvl).toFixed(1)} H${nx.toFixed(1)} V${yAt(c).toFixed(1)}`;
      if (c > lvl) thick += seg; else thin += seg;
      if (rev || dir === 0) dir = c > lvl ? 1 : -1;
      lvl = c; x = nx;
    }
    series = `<g class="kagi"><path class="thin" d="${thin}"/><path class="thick" d="${thick}"/></g>`;
  } else if (type === 'pctline') {
    const pts = [];
    for (let i = i0; i <= i1; i++) pts.push(`${xAt(i).toFixed(1)},${yAt(pctOf(sndkC, i)).toFixed(1)}`);
    const zy = yAt(0);
    series += (zy >= HEAD && zy <= priceBottom) ? `<line class="zero" x1="0" x2="${plotW}" y1="${(r(zy) + .5)}" y2="${(r(zy) + .5)}"/>` : '';
    series += `<polyline class="cline base" points="${pts.join(' ')}"/>`;
  } else if (type === 'pnf') {
    /* point and figure, 3-box reversal, each column drawn in the slot of the session that opened it;
       half the Renko box so a 3M window still shows several columns */
    const brick = niceStep((hi - lo) / 24);
    const cols = [];
    let cur = null;
    for (let i = i0; i <= i1; i++) {
      const c = D[i].c;
      if (!cur) { cur = { i, kind: 'X', lo: Math.floor(c / brick) * brick, hi: Math.floor(c / brick) * brick }; cols.push(cur); continue; }
      if (cur.kind === 'X') {
        if (c >= cur.hi + brick) cur.hi = Math.floor(c / brick) * brick;
        else if (c <= cur.hi - 3 * brick) { cur = { i, kind: 'O', hi: cur.hi - brick, lo: Math.ceil(c / brick) * brick }; cols.push(cur); }
      } else {
        if (c <= cur.lo - brick) cur.lo = Math.ceil(c / brick) * brick;
        else if (c >= cur.lo + 3 * brick) { cur = { i, kind: 'X', lo: cur.lo + brick, hi: Math.floor(c / brick) * brick }; cols.push(cur); }
      }
    }
    const bh = yAt(0) - yAt(brick), hw = Math.max(4, Math.min(bw, bh) / 2 - .8);   /* legible X and O even at 64 bars */
    cols.forEach(col => {
      const cx = xAt(col.i);
      for (let lv = col.lo; lv <= col.hi + 1e-9; lv += brick) {
        const cy = yAt(lv + brick / 2);
        series += col.kind === 'X'
          ? `<line x1="${(cx - hw).toFixed(1)}" y1="${(cy - hw).toFixed(1)}" x2="${(cx + hw).toFixed(1)}" y2="${(cy + hw).toFixed(1)}"/><line x1="${(cx - hw).toFixed(1)}" y1="${(cy + hw).toFixed(1)}" x2="${(cx + hw).toFixed(1)}" y2="${(cy - hw).toFixed(1)}"/>`
          : `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${hw.toFixed(1)}"/>`;
      }
    });
    series = `<g class="pf">${series}</g>`;
  }

  /* price overlays: moving averages, VWAP, Bollinger Bands (price scale only, so not in the percent view) */
  let studies = '';
  if (!cmpPct) state.studies.forEach(st => {
    if (st.hidden) return;
    const d = IND_BY_CODE[st.code]; if (!d || !(d.kind === 'ma' || d.kind === 'bb' || d.kind === 'vwap')) return;
    const cfg = instCfg(st), S = cfg.s, I = cfg.i;
    const s = studySeries(st.code, instParams(st), I.Source, I['Basis MA']);
    /* Style tab drives the drawn line: colour, line style, width, opacity, visibility (+ Chart type, fills, VWAP bands, BB offset) */
    const wPx = [1.5, 2.5, 3.5][clamp((S['#width'] || 1) - 1, 0, 2)], op = (S['#opacity'] === undefined ? 100 : S['#opacity']) / 100, off = Math.round(I.Offset || 0);
    const pts = arr => { const out = []; for (let i = i0; i <= i1; i++) { const j = i - off; if (j >= 0 && j < arr.length && arr[j] !== null && arr[j] !== undefined) out.push([xAt(i), yAt(arr[j])]); } return out; };
    const styled = (arr, pl) => { if (!pl || pl.v === false) return ''; const P2 = pts(arr); if (P2.length < 2) return ''; const w2 = pl.w ? [1.5, 2.5, 3.5][clamp(pl.w - 1, 0, 2)] : wPx, o2 = pl.o !== undefined ? pl.o / 100 : op; return `<polyline class="study" style="stroke:${pl.c};stroke-width:${w2};stroke-opacity:${o2};stroke-dasharray:${IS_DASH[pl.s] || 'none'}" points="${P2.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')}"/>`; };
    const band = (a, b, fl) => { if (!fl || !fl.v || !fl.c || fl.c === 'transparent') return ''; const A = pts(a), B = pts(b).reverse(); if (A.length < 2) return ''; return `<polygon class="study-fill" style="fill:${fl.c};fill-opacity:${(fl.o || 0) / 100}" points="${A.concat(B).map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')}"/>`; };
    if (d.kind === 'ma') {
      const pl = S['Line color'], ct = S['Chart type'], opm = pl && pl.o !== undefined ? pl.o / 100 : op;
      if (ct === 'Histogram Chart') { const P2 = pts(s.main); studies += P2.map(q => `<line class="study-bar" x1="${q[0].toFixed(1)}" x2="${q[0].toFixed(1)}" y1="${q[1].toFixed(1)}" y2="${priceBottom}" style="stroke:${pl.c};stroke-opacity:${opm * .6};stroke-width:${Math.max(1, slot * .5).toFixed(1)}"/>`).join(''); }
      else { if (ct === 'Area') { const P2 = pts(s.main); if (P2.length > 1) studies += `<polygon class="study-fill" style="fill:${pl.c};fill-opacity:${.12 * opm}" points="${P2.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')} ${P2[P2.length - 1][0].toFixed(1)},${priceBottom} ${P2[0][0].toFixed(1)},${priceBottom}"/>`; } studies += styled(s.main, pl); }
      return;
    }
    if (d.kind === 'bb') { studies += band(s.upper, s.lower, S.Background) + styled(s.upper, S.Upper) + styled(s.main, S.Middle) + styled(s.lower, S.Lower); return; }
    if (d.kind === 'vwap') {
      const pct = I.Bands === 'Percent', bandArr = (k, sign) => s.main.map((m, i) => m === null ? null : m + sign * (pct ? m * k / 100 : k * s.sd[i]));
      let out = '';
      [1, 2, 3].forEach(n => { if (I['Band ' + n] !== 'On') return; const k = +I['Mult ' + n] || n; const up = bandArr(k, 1), lo = bandArr(k, -1); if (n === 1) out = band(up, lo, S.Background) + out; out += styled(up, S['Upper ' + n]) + styled(lo, S['Lower ' + n]); });
      studies += out + styled(s.main, S.VWAP); return;
    }
    const line = (arr, cls) => { const pts = []; for (let i = i0; i <= i1; i++) if (arr[i] !== null && arr[i] !== undefined) pts.push(`${xAt(i).toFixed(1)},${yAt(arr[i]).toFixed(1)}`); return pts.length > 1 ? `<polyline class="study ${cls}" style="stroke:${st.color}" points="${pts.join(' ')}"/>` : ''; };
    if (d.kind === 'bb') studies += line(s.upper, 'band') + line(s.lower, 'band'); else studies += line(s.main, '');
  });

  /* compared series as coloured lines (percent or shared price axis) */
  let clines = '';
  cmpData.forEach(c => {
    const pts = [];
    for (let i = i0; i <= i1; i++) pts.push(`${xAt(i).toFixed(1)},${yAt(cmpPct ? pctOf(c.data, i) : c.data[i]).toFixed(1)}`);
    clines += `<polyline class="cline" style="stroke:${c.col}" points="${pts.join(' ')}"/>`;
  });

  const lcls = LAST.c >= PREV.c ? 'up' : 'down';
  const lastp = !showLast ? '' :
    `<line class="lastline ${lcls}" x1="0" x2="${plotW}" y1="${ly}" y2="${ly}"/>` +
    `<g class="tag ${lcls}"><rect x="${plotW + 3}" y="${ly - 10}" width="${AX - 6}" height="20" rx="4"/>` +
    `<text x="${plotW + AX / 2}" y="${ly + 4}" text-anchor="middle">${fmt(LAST.c)}</text></g>`;

  /* x labels - anchored to absolute bar indices so they travel with their bars while panning */
  const every = Math.max(1, Math.round(view.count / Math.max(2, Math.floor(plotW / (this.land ? 56 : 62)))));
  let xlab = '';
  for (let i = i0; i <= i1; i++) {
    if (i % every) continue;
    const lx = xAt(i);
    if (lx < 22 || lx > plotW - 22) continue;
    xlab += `<text class="ax" x="${lx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${BARS[i].date}</text>`;
  }

  /* event badges on the axis line (Events setting) */
  let evs = '';
  if (S.events) EVENTS.forEach((ev, k) => {
    if (ev.i < i0 || ev.i > i1) return;
    const ex = xAt(ev.i); if (ex < 8 || ex > plotW - 8) return;
    const ey = plotBottom;   /* centred on the volume baseline, over the bottom of the bars, above the date labels */
    evs += `<g class="ev ${ev.type}" data-ev="${k}"><circle cx="${ex.toFixed(1)}" cy="${ey}" r="8"/><text x="${ex.toFixed(1)}" y="${ey + 3.5}" text-anchor="middle">${ev.type}</text><rect x="${(ex - 22).toFixed(1)}" y="${ey - 22}" width="44" height="44"/></g>`;
  });
  /* countdown to bar close under the last-price tag */
  const cdown = (S.countdown && showLast) ? `<g class="countdown"><text x="${W - 4}" y="${ly + 22}" text-anchor="end">Closes in</text><text class="cd-time" x="${W - 4}" y="${ly + 33}" text-anchor="end">${countdownText()}</text></g>` : '';   /* two lines, right-aligned inside the axis column */
  const wm = `<text class="wm" x="12" y="${plotBottom - 8}">Investing.com</text>`;
  const clip = `<defs><clipPath id="${clipId}"><rect x="0" y="0" width="${plotW}" height="${plotBottom}"/></clipPath></defs>`;
  const drw = dtRender(this);   /* drawings in chart coordinates; selection handles, placing preview and flash in their own group (dropped from the camera PNG) */
  svg.innerHTML = `${clip}<g class="gridg">${grid}</g>${wm}<g clip-path="url(#${clipId})"><g class="vol">${vol}</g>${series}${studies}${clines}<g class="drw">${drw.body}</g></g>${lastp}<g class="axes">${ylab}${xlab}</g>${cmpTags}${drw.axis}${cdown}<g class="events">${evs}</g><g class="drw-ui" clip-path="url(#${clipId})">${drw.ui}</g><g class="xhg"></g>`;
  this.xh = svg.querySelector('.xhg');
  this.first = false;
  if (this.evOpen !== null && this.evOpen !== undefined) this.placeEvent();
  this.latestBtn.classList.toggle('show', !this.atLatest());
  this.zoomBtn.classList.toggle('show', Math.round(this.view.count) !== this.defaultCount || !!this.pz);   /* also while a manual price scale is on */
  if (this.hover !== null) this.setHover(this.hover.i, this.hover.y); else this.updateHead(N - 1);
};

Chart.prototype.updateHead = function (i) {
  const b = BARS[i], prev = BARS[i - 1] || b;
  const up = b.c >= b.o;
  const c = up ? 'up' : 'down';
  const pct = (b.c - prev.c) / prev.c * 100;
  const pcls = pct >= 0 ? 'up' : 'down';
  this.ohlcEl.innerHTML =
    `<span><b>O:</b> <span class="v ${c}">${fmt(b.o)}</span></span>` +
    `<span><b>H:</b> <span class="v">${fmt(b.h)}</span></span>` +
    `<span><b>L:</b> <span class="v">${fmt(b.l)}</span></span>` +
    `<span><b>C:</b> <span class="v ${c}">${fmt(b.c)}</span> <span class="${pcls}">(${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%)</span></span>`;
  if (this.volEl) this.volEl.textContent = fmtVol(b.v);
  this.root.querySelectorAll('.lg-row').forEach(row => { const v = row.querySelector('.lg-val'); if (v) { const st = state.studies.find(x => x.id === row.dataset.id); if (st) v.textContent = studyValue(st, i); } });
};

Chart.prototype.setHover = function (i, py) {
  const g = this.geom; if (!g) return;
  i = clamp(i, g.vis0, g.vis1);
  py = clamp(py, 10, g.plotBottom - 2);
  const price = g.pAt(py);
  this.hover = { i, y: py, price };
  const b = BARS[i];
  const x = r(g.xAt(i)) + .5;
  const yy = r(py) + .5;
  const pw = 100;
  const px = clamp(x - pw / 2, 2, g.plotW - pw - 2);
  this.xh.innerHTML =
    `<line class="xh" x1="${x}" x2="${x}" y1="0" y2="${g.plotBottom}"/>` +
    `<line class="xh" x1="0" x2="${g.plotW}" y1="${yy}" y2="${yy}"/>` +
    `<g class="tag dark"><rect x="${g.plotW + 3}" y="${yy - 10}" width="${g.AX - 6}" height="20" rx="4"/>` +
    `<text x="${g.plotW + g.AX / 2}" y="${yy + 4}" text-anchor="middle">${g.pct ? fmtPct(price) : fmt(price)}</text></g>` +
    `<g class="tag blue"><rect x="${px}" y="${g.plotBottom + 2}" width="${pw}" height="21" rx="5"/>` +
    `<text x="${px + pw / 2}" y="${g.plotBottom + 17}" text-anchor="middle">${b.date}, 2026</text></g>`;
  this.updateHead(i);
  clearTimeout(this._xhT);
  this.xh.classList.add('on');
  this.head.classList.add('xh');
  if (this.pill.classList.contains('show')) this.placePill(yy);
};

/* Pill sits just under the crosshair price tag, right-aligned to the axis; flips above near the bottom. */
Chart.prototype.placePill = function (yy) {
  const g = this.geom, ph = 26;
  let top = yy + 13, above = false;
  if (top + ph > g.plotBottom - 2) { top = yy - 13 - ph; above = true; }
  this.pill.style.top = top.toFixed(0) + 'px';
  this.pill.classList.toggle('above', above);
  /* hide any y-axis label whose band overlaps the pill, like the last-price tag does for its neighbour */
  this.svg.querySelectorAll('text.ylab').forEach(t => {
    const cy = +t.getAttribute('y') - 4;
    t.classList.toggle('under-pill', cy > top - 8 && cy < top + ph + 8);
  });
};
Chart.prototype.showPill = function () {
  if (this.hover) this.placePill(r(this.hover.y) + .5);
  this.pill.classList.add('show');
};
Chart.prototype.hidePill = function () {
  this.pill.classList.remove('show');
  this.svg.querySelectorAll('text.ylab.under-pill').forEach(t => t.classList.remove('under-pill'));
};
Chart.prototype.createAlert = function () {
  const price = this.hover ? this.hover.price : (this.pillPrice != null ? this.pillPrice : LAST.c);
  toast('Alert set at ' + (this.geom && this.geom.pct ? fmtPct(price) : fmt(price)));
  clearTimeout(this._pillT);
  this.clear();
};

/* ---- Event card ---- */
Chart.prototype.openEvent = function (k) {
  const ev = EVENTS[k]; if (!ev) return;
  this.closeSettings();
  this.evOpen = k;
  this.evCard.innerHTML =
    `<div class="ev-title"><span class="ev-dot ${ev.type}">${ev.type}</span>${ev.title}</div>` +
    ev.rows.map(r => `<div class="ev-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('') +
    (ev.detail.length ? `<div class="ev-div"></div><div class="ev-sub">${ev.sub}</div>` + ev.detail.map(r => `<div class="ev-row"><span>${r[0]}</span><b class="${r[2]}">${r[1]}</b></div>`).join('') : '') +
    `<button class="ev-btn" data-evcta="${ev.cta}">${ev.cta}</button>`;
  this.placeEvent();
  this.evCard.classList.add('open');
};
Chart.prototype.placeEvent = function () {
  const ev = EVENTS[this.evOpen]; const g = this.geom; if (!ev || !g) return;
  const x = g.xAt(ev.i);
  if (x < 8 || x > g.plotW - 8 || !state.settings.events) { this.closeEvent(); return; }
  const w = 260;
  this.evCard.style.left = clamp(x - w / 2, 8, this.W - w - 8).toFixed(0) + 'px';
  this.evCard.style.bottom = (g.XA + 18).toFixed(0) + 'px';
};
Chart.prototype.closeEvent = function () { this.evOpen = null; this.evCard.classList.remove('open'); };

/* ---- Settings popover ---- */
const SETTINGS_ROWS = [
  ['extended', 'Extended hours', 'Intraday timeframes only'],
  ['events', 'Events', 'Dividends, splits, earnings, news'],
  ['log', 'Logarithmic price scale', ''],
  ['invert', 'Invert scale', ''],
  ['countdown', 'Countdown to bar close', '']
];
Chart.prototype.renderSettings = function () {
  this.settingsEl.innerHTML = `<div class="pop-head">Settings</div>` + SETTINGS_ROWS.map(([k, label, sub]) =>
    `<div class="set-row" data-set="${k}"><div class="set-main"><span class="set-label">${label}</span>${sub ? `<span class="set-sub">${sub}</span>` : ''}</div><span class="sw ${state.settings[k] ? 'on' : ''}"></span></div>`).join('') +
    `<div class="set-div"></div><div class="set-row set-action danger" data-setact="reset"><span class="set-label">Reset chart</span>${ICO.chevSm}</div>`;
};
Chart.prototype.openSettings = function () { this.closeEvent(); this.renderSettings(); this.settingsEl.classList.add('open'); this.root.classList.add('settings-open'); };
Chart.prototype.closeSettings = function () { this.settingsEl.classList.remove('open'); this.root.classList.remove('settings-open'); };
function toggleSetting(k) {
  state.settings[k] = !state.settings[k];
  markDirty();
  Object.values(charts).forEach(c => { if (c.settingsEl.classList.contains('open')) c.renderSettings(); });
  if (k === 'events' && !state.settings.events) Object.values(charts).forEach(c => c.closeEvent());
  drawAll();
}
const CLOSE_AT = Date.now() + (4 * 3600 + 12 * 60 + 33) * 1000;
function countdownText() {
  const s = Math.max(0, Math.floor((CLOSE_AT - Date.now()) / 1000));
  const p = n => String(n).padStart(2, '0');
  return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
}
setInterval(() => { if (!state.settings.countdown) return; document.querySelectorAll('.countdown .cd-time').forEach(t => t.textContent = countdownText()); }, 1000);

/* Finger lift in crosshair mode: lines, rows and chips cross-fade back at once; the Create alert pill stays 1.5s. */
Chart.prototype.releaseCrosshair = function () {
  this.pillPrice = this.hover ? this.hover.price : null;
  const keepTop = this.pill.style.top;
  this.clear();
  this.pill.style.top = keepTop;
  this.pill.classList.add('show');
  clearTimeout(this._pillT);
  this._pillT = setTimeout(() => this.hidePill(), 1500);
};
Chart.prototype.clear = function () {
  clearTimeout(this._pillT);
  this.hover = null;
  this.frozen = false;
  this.head.classList.remove('xh');
  if (this.xh) {
    const xh = this.xh;
    xh.classList.remove('on');
    clearTimeout(this._xhT);
    this._xhT = setTimeout(() => { if (!this.hover) xh.innerHTML = ''; }, 220);   /* keep the lines while they fade */
  }
  this.hidePill();
  if (this.geom) this.updateHead(BARS.length - 1);
};

/* Live tick: refresh the price row (with a flash) and redraw so the last candle and price tag follow. */
Chart.prototype.tick = function (dir) {
  this.pxEl.textContent = fmt(LAST.c);
  this.chgEl.textContent = chgText();
  this.chgEl.classList.remove('up', 'down'); this.chgEl.classList.add(chgCls());
  if (dir) {
    this.pxEl.classList.remove('flash-up', 'flash-down');
    void this.pxEl.offsetWidth;
    this.pxEl.classList.add('flash-' + dir);
  }
  if (this.geom && this.W && !this.hover) this.draw();
};

/* Scroll back to the latest bar (reset button). */
Chart.prototype.atLatest = function () { return Math.abs(this.view.start - Math.max(0, BARS.length - this.view.count)) < 0.01; };
/* synchronous jump (used by range picks and tests) */
Chart.prototype.snapToLatest = function () {
  this.cancelScroll();
  if (this.stopInertia) this.stopInertia();
  this.clear();
  this.view.start = Math.max(0, BARS.length - this.view.count);
  this.draw();
};
/* animated ease-in-out scroll back to the latest bar; keeps the bar count, cancels inertia, clears crosshair + cards */
Chart.prototype.scrollToLatest = function () {
  this.cancelScroll();
  if (this.stopInertia) this.stopInertia();
  this.clear(); this.closeEvent();
  const from = this.view.start, to = Math.max(0, BARS.length - this.view.count);
  if (Math.abs(to - from) < 0.01) { this.view.start = to; this.draw(); return; }
  const dur = clamp(400 + Math.abs(to - from) * 2, 400, 600);
  const t0 = performance.now();
  const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    this.view.start = k >= 1 ? to : from + (to - from) * ease(k);
    this.draw();
    this._anim = k < 1 ? requestAnimationFrame(step) : 0;
  };
  this._anim = requestAnimationFrame(step);
};
Chart.prototype.cancelScroll = function () { if (this._anim) { cancelAnimationFrame(this._anim); this._anim = 0; } if (this._zoomAnim) { cancelAnimationFrame(this._zoomAnim); this._zoomAnim = 0; } };
/* animated zoom back to the orientation default, right edge anchored; clears the picked range, keeps compare; not layout state */
Chart.prototype.zoomToDefault = function () {
  this.pz = null;                            /* back to an auto-fit price axis too */
  this.cancelScroll();
  if (this.stopInertia) this.stopInertia();
  this.clear(); this.closeEvent();
  const N = BARS.length, from = this.view.count, to = Math.min(this.defaultCount, N);
  state.range = null;
  if (Math.abs(to - from) < 0.01) { this.view.count = to; this.draw(); return; }
  const rightEdge = this.view.start + from;   /* fractional index of the right edge: stays put */
  const dur = clamp(400 + Math.abs(to - from) * 4, 400, 600), t0 = performance.now();
  const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const count = k >= 1 ? to : from + (to - from) * ease(k);
    this.view.count = count;
    this.view.start = clamp(rightEdge - count, 0, N - count);
    this.draw();
    this._zoomAnim = k < 1 ? requestAnimationFrame(step) : 0;
  };
  this._zoomAnim = requestAnimationFrame(step);
};
Chart.prototype.resetView = function () { this.scrollToLatest(); };

/* Gestures:
   - pointer down + move beyond 8px slop  -> pan (drag scrolls through history, inertia on release)
   - pointer held still ~380ms            -> crosshair mode: dashed crosshair + Create alert pill,
                                             finger movement drives the crosshair
   - lift in crosshair mode               -> crosshair + pill stay frozen until the next tap on the chart
   - mouse behaves like touch: no hover crosshair, a plain tap only dismisses a frozen one */
Chart.prototype.bind = function () {
  const svg = this.svg;
  const self = this;
  const SLOP = 8, HOLD = 380;
  let ptr = null, holdTimer = 0, raf = 0, inertia = 0;

  function local(e) {
    const rect = svg.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / rect.width * self.W, y: (e.clientY - rect.top) / rect.height * self.H };
  }
  function barAt(px) { return Math.round(px / self.geom.slot - 0.6 + self.view.start); }
  function hoverAt(p) {
    if (!self.geom || p.x > self.geom.plotW) return;
    self.setHover(barAt(p.x), p.y);
  }
  function scheduleDraw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; self.draw(); }); }
  function stopInertia() { if (inertia) { cancelAnimationFrame(inertia); inertia = 0; } }
  this.stopInertia = stopInertia;
  function startInertia(v) {      /* v: bars per ms */
    stopInertia();
    const maxStart = BARS.length - self.view.count;
    let last = performance.now();
    function step(now) {
      const dt = Math.min(48, now - last); last = now;
      const raw = self.view.start + v * dt;
      self.view.start = clamp(raw, 0, maxStart);
      v *= Math.pow(0.994, dt);
      self.draw();
      if (Math.abs(v) < 0.0004 || raw !== self.view.start) { inertia = 0; return; }
      inertia = requestAnimationFrame(step);
    }
    inertia = requestAnimationFrame(step);
  }
  function engage() {
    ptr.mode = 'xh';
    hoverAt({ x: ptr.x, y: ptr.y });
    const tag = self.xh && self.xh.querySelector('.tag.dark');
    if (tag) tag.classList.add('flick');
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
    self.showPill();
  }
  function release(e, cancelled) {
    if (!ptr || e.pointerId !== ptr.id) return;
    clearTimeout(holdTimer);
    const g = ptr; ptr = null;
    svg.classList.remove('panning');
    try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
    if (g.mode === 'pan') {
      if (raf) { cancelAnimationFrame(raf); raf = 0; self.draw(); }
      if (!cancelled && g.samples.length >= 2) {
        const a = g.samples[0], b = g.samples[g.samples.length - 1];
        const dt = b.t - a.t;
        if (dt > 0 && performance.now() - b.t < 100) startInertia(clamp((b.s - a.s) / dt, -0.12, 0.12));
      }
    } else if (g.mode === 'pending' && !cancelled && anchorPick) {   /* AVWAP "Pick on chart": this tap sets Anchor time */
      const st = state.studies.find(x => x.id === anchorPick); anchorPick = null;
      const i = clamp(barAt(g.x0), 0, BARS.length - 1);
      if (st) { instCfg(st).i['Anchor by'] = 'Date'; st.cfg.i['Anchor time'] = BARS[i].date + ', 2026 09:30'; markDirty(); renderLegend(); toast('Anchor set to ' + BARS[i].date); }
    } else if (g.mode === 'pending' && !cancelled) {
      dtTap(self, { x: g.x0, y: g.y0 });   /* tap: select the topmost drawing, or deselect */
    } else if (g.mode === 'xh') {
      if (cancelled) self.clear(); else self.releaseCrosshair();   /* auto fade; only the pill lingers */
    }
  }

  /* Zoom paths, all sharing one rule set (anchor on the bar under the cursor / midpoint, count clamped
     MIN_BARS..max(default, count at gesture start), clears the picked date range; draw() re-rebases compare %):
     1. two touch pointers (phone) - on the plot or on any overlay above it
     2. ctrl + wheel (Mac trackpad pinch in Chrome/Firefox, ctrl + mouse wheel on desktop)
     3. Safari gesturestart/gesturechange (Mac trackpad pinch in Safari) */
  const area = svg.parentElement;
  const pts = new Map(), ovl = new Map();   /* ovl: touches that landed on an overlay (legend, pill, buttons) */
  let pinch = null, suppressClick = 0;
  function zoomAround(count, x, anchorBar) {
    const N = BARS.length, g = self.geom;
    if (anchorBar == null) anchorBar = x / (g.plotW / (self.view.count + 1.6)) - 0.6 + self.view.start;
    const slot = g.plotW / (count + 1.6);
    self.view.count = count;
    self.view.start = clamp(anchorBar - (x / slot - 0.6), 0, N - count);
    state.range = null;                      /* zoomed by hand: no preset date range applies any more */
    scheduleDraw();
  }
  /* Price-axis gestures (the y-label column, full plot height): scale the PRICE axis only, never the bar count.
     self.pz = { k, o } or null (auto-fit): k = span / auto-fit span, clamped 0.2..5; o = centre offset in auto-fit spans. */
  const PZ_MIN = 0.2, PZ_MAX = 5;
  const ax = { pts: new Map(), drag: null, pinch: null, lastTap: 0 };
  const pzK = () => self.pz ? self.pz.k : 1, pzO = () => self.pz ? self.pz.o : 0;
  function setPz(k, o) {
    k = clamp(k, PZ_MIN, PZ_MAX);
    self.pz = Math.abs(k - 1) < 1e-4 && Math.abs(o) < 1e-4 ? null : { k, o };
    scheduleDraw();
  }
  function axisFrac(y) {                     /* 0 at the bottom of the price domain, 1 at the top (in scale space) */
    const g = self.geom; let t = (g.priceBottom - y) / (g.priceBottom - g.HEAD);
    return state.settings.invert ? 1 - t : t;
  }
  function setPzAnchored(k, fm, t) {         /* keep the scale value fm at the same height t while the span changes */
    k = clamp(k, PZ_MIN, PZ_MAX);
    const A = self.autoY, sp = k * A.S, cc = fm - t * sp + sp / 2;
    setPz(k, (cc - A.C) / A.S);
  }
  function axisDown(e, p) {
    ax.pts.set(e.pointerId, p);
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    stopInertia(); clearTimeout(holdTimer);
    if (self.hover) self.clear();
    if (ax.pts.size === 1) ax.drag = { id: e.pointerId, y0: p.y, k0: pzK(), o0: pzO(), moved: false };
    else if (ax.pts.size === 2 && self.fY) {
      ax.drag = null; ax.lastTap = 0;
      const [a, b] = [...ax.pts.values()], t = axisFrac((a.y + b.y) / 2), F = self.fY;
      ax.pinch = { d0: Math.max(20, Math.abs(a.y - b.y)), k0: pzK(), t, fm: F.flo + t * (F.fhi - F.flo) };
    }
  }
  function axisMove(e, p) {
    ax.pts.set(e.pointerId, p);
    if (ax.pinch) {                          /* vertical spread zooms in (smaller span), pinch together zooms out */
      const [a, b] = [...ax.pts.values()], d = Math.max(20, Math.abs(a.y - b.y));
      setPzAnchored(ax.pinch.k0 * ax.pinch.d0 / d, ax.pinch.fm, ax.pinch.t);
    } else if (ax.drag && ax.drag.id === e.pointerId) {   /* drag down compresses, drag up stretches; centre stays */
      const dy = p.y - ax.drag.y0;
      if (Math.abs(dy) > SLOP) ax.drag.moved = true;
      if (ax.drag.moved) setPz(ax.drag.k0 * Math.exp(dy * 0.006), ax.drag.o0);
    }
  }
  function axisUp(e) {
    ax.pts.delete(e.pointerId);
    try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
    if (ax.pinch) { if (ax.pts.size < 2) { ax.pinch = null; ax.drag = null; } return; }
    const dr = ax.drag; ax.drag = null;
    if (!dr || dr.moved) { ax.lastTap = 0; return; }
    const now = performance.now();
    if (now - ax.lastTap < 320) { ax.lastTap = 0; self.pz = null; scheduleDraw(); }   /* double-tap: back to auto-fit */
    else ax.lastTap = now;
  }
  function prepZoom() {
    clearTimeout(holdTimer); stopInertia(); self.cancelScroll();
    if (self.hover) self.clear();
    clearTimeout(self._pillT); self.hidePill();
    ptr = null; svg.classList.remove('panning');
  }
  function startPinch() {
    prepZoom();
    const [a, b] = [...pts.values()];
    pinch = { d0: Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), count0: self.view.count,
              anchorBar: (a.x + b.x) / 2 / self.geom.slot - 0.6 + self.view.start };
  }
  function absorbOverlay() {                 /* move overlay touches into the pinch and route their moves to the svg */
    ovl.forEach((p, id) => { pts.set(id, p); try { svg.setPointerCapture(id); } catch (_) {} });
    ovl.clear();
    suppressClick = 1;                       /* the overlay under a pinching finger must not fire its tap */
  }
  area.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || svg.contains(e.target) || !self.geom || DRW.placing || DRW.ptrId !== null) return;   /* no pinch while placing or dragging a drawing */
    ovl.set(e.pointerId, local(e));
    if (pts.size + ovl.size >= 2 && !pinch) { absorbOverlay(); startPinch(); }
  }, true);
  const dropOvl = e => ovl.delete(e.pointerId);
  area.addEventListener('pointerup', dropOvl, true);
  area.addEventListener('pointercancel', dropOvl, true);
  area.addEventListener('click', e => {
    if (suppressClick) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  /* ctrl + wheel: trackpad pinch arrives as wheel events with ctrlKey (deltaY < 0 = zoom in) */
  let wz = null, wzT = 0;
  area.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;                  /* plain wheel does nothing on the chart */
    e.preventDefault();                      /* the page never zooms while the pointer is over the chart */
    if (!self.geom || pinch || DRW.placing || DRW.drag) return;
    const dy = clamp(e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1), -60, 60);
    if (local(e).x > self.geom.plotW) { wz = null; setPz(pzK() * Math.exp(dy * 0.01), pzO()); return; }   /* over the price axis: price zoom */
    if (!wz) { prepZoom(); wz = { c: self.view.count, lim: Math.max(self.defaultCount, self.view.count) }; }
    clearTimeout(wzT); wzT = setTimeout(() => { wz = null; }, 350);   /* one gesture = one clamp ceiling */
    wz.c = clamp(wz.c * Math.exp(dy * 0.01), MIN_BARS, wz.lim);
    const count = Math.round(wz.c);
    if (count !== self.view.count) zoomAround(count, clamp(local(e).x, 0, self.geom.plotW));
  }, { passive: false });
  /* Safari: trackpad pinch as gesture events (skipped while a two-pointer pinch is running, e.g. iOS) */
  let gz = null;
  area.addEventListener('gesturestart', e => {
    e.preventDefault();
    if (!self.geom || pinch || DRW.placing || DRW.drag) return;
    prepZoom();
    if (e.clientX != null && local(e).x > self.geom.plotW) { gz = { price: true, k0: pzK(), o0: pzO() }; return; }
    const x = e.clientX != null ? clamp(local(e).x, 0, self.geom.plotW) : self.geom.plotW / 2;
    gz = { count0: self.view.count, lim: Math.max(self.defaultCount, self.view.count), x,
           anchorBar: x / self.geom.slot - 0.6 + self.view.start };
  }, { passive: false });
  area.addEventListener('gesturechange', e => {
    e.preventDefault();
    if (!gz || pinch || !self.geom || !(e.scale > 0)) return;
    if (gz.price) { setPz(gz.k0 / e.scale, gz.o0); return; }
    const count = clamp(Math.round(gz.count0 / e.scale), MIN_BARS, gz.lim);
    if (count !== self.view.count) zoomAround(count, gz.x, gz.anchorBar);
  }, { passive: false });
  area.addEventListener('gestureend', e => { e.preventDefault(); gz = null; }, { passive: false });
  svg.addEventListener('pointerdown', e => {
    if (!self.geom) return;
    const badge = e.target.closest && e.target.closest('[data-ev]');
    if (badge) { self.openEvent(+badge.dataset.ev); return; }   /* badge tap: card, no gesture */
    self.closeEvent(); self.closeSettings(); self.cancelScroll();
    clearTimeout(self._pillT); self.hidePill();   /* a new touch cancels a lingering Create alert pill */
    const p = local(e);
    /* drawings: placing mode takes every touch (no pan, pinch or long press); a selected drawing's handle or body starts a drag */
    if (DRW.placing) { if (DRW.ptrId === null && !pts.size) { stopInertia(); if (self.hover) self.clear(); try { svg.setPointerCapture(e.pointerId); } catch (_) {} dtPlaceDown(self, e, { x: Math.min(p.x, self.geom.plotW), y: p.y }); } return; }
    if (DRW.ptrId !== null) return;
    if (!pts.size && p.x <= self.geom.plotW && dtDragStart(self, e, p)) { stopInertia(); if (self.hover) self.clear(); try { svg.setPointerCapture(e.pointerId); } catch (_) {} return; }
    if (p.x > self.geom.plotW) { if (!pts.size) axisDown(e, p); return; }   /* price axis: price-scale gestures only (no crosshair) */
    pts.set(e.pointerId, p);
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    if (pts.size + ovl.size >= 2 && !pinch) {   /* second finger (on the plot or already on an overlay) */
      if (ovl.size) absorbOverlay();
      startPinch();
      return;
    }
    if (pts.size > 1 || !e.isPrimary) return;
    stopInertia();
    if (self.hover) self.clear();            /* a tap anywhere dismisses a frozen crosshair; hover gets out of the way */
    ptr = { id: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y, start0: self.view.start, mode: 'pending', samples: [] };
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { if (ptr && ptr.mode === 'pending') engage(); }, HOLD);
  });
  svg.addEventListener('pointermove', e => {
    if (!self.geom) return;
    const p = local(e);
    if (DRW.ptrId === e.pointerId) { if (DRW.placing) dtPlaceMove(self, { x: Math.min(p.x, self.geom.plotW), y: p.y }); else dtDragMove(self, p); return; }
    if (ax.pts.has(e.pointerId)) { axisMove(e, p); return; }
    if (e.pointerType === 'mouse' && !ptr) svg.style.cursor = p.x > self.geom.plotW ? 'ns-resize' : '';   /* web-style resize cursor over the axis */
    if (pinch) {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, p);
      const [a, b] = [...pts.values()];
      const d = Math.max(20, Math.hypot(a.x - b.x, a.y - b.y));
      const count = clamp(Math.round(pinch.count0 * pinch.d0 / d), MIN_BARS, Math.max(self.defaultCount, pinch.count0));   /* never zoom out past the default (or past a wider picked range) */
      zoomAround(count, (a.x + b.x) / 2, pinch.anchorBar);
      return;
    }
    if (!ptr || e.pointerId !== ptr.id) return;   /* no hover crosshair: the crosshair is entered only by a long press */
    ptr.x = p.x; ptr.y = p.y;
    if (ptr.mode === 'pending') {
      if (Math.hypot(p.x - ptr.x0, p.y - ptr.y0) <= SLOP) return;
      ptr.mode = 'pan';
      clearTimeout(holdTimer);
      svg.classList.add('panning');
    }
    if (ptr.mode === 'pan') {
      const maxStart = BARS.length - self.view.count;
      const raw = ptr.start0 - (p.x - ptr.x0) / self.geom.slot;
      const s = clamp(raw, 0, maxStart);
      if (s !== raw) { ptr.start0 = s; ptr.x0 = p.x; }   /* rebase at the edges so reversing responds immediately */
      self.view.start = s;
      ptr.samples.push({ t: performance.now(), s });
      if (ptr.samples.length > 6) ptr.samples.shift();
      scheduleDraw();
    } else if (ptr.mode === 'xh') {
      hoverAt(p);
    }
  });
  function endPointer(e, cancelled) {
    if (DRW.ptrId === e.pointerId) {
      try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
      const p = local(e);
      if (DRW.placing) dtPlaceUp(self, { x: Math.min(p.x, self.geom.plotW), y: p.y }, cancelled); else dtDragEnd(self, cancelled);
      return;
    }
    if (ax.pts.has(e.pointerId)) { axisUp(e); return; }
    pts.delete(e.pointerId);
    try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
    if (pinch) {
      if (pts.size < 2) { pinch = null; if (raf) { cancelAnimationFrame(raf); raf = 0; self.draw(); } }
      if (!pts.size) setTimeout(() => { suppressClick = 0; }, 350);   /* outlast the synthetic click, if any */
      return;                                /* a finger left over after a pinch is ignored until lifted */
    }
    release(e, cancelled);
  }
  svg.addEventListener('pointerup', e => endPointer(e, false));
  svg.addEventListener('pointercancel', e => endPointer(e, true));
};

   ============================================================ */
document.getElementById('chartP').innerHTML = chartModuleHTML('chartModuleP', false);
document.getElementById('chartL').innerHTML = chartModuleHTML('chartModuleL', true);
const charts = {
  portrait:  new Chart(document.getElementById('chartModuleP'), false),
  landscape: new Chart(document.getElementById('chartModuleL'), true)
};
function drawAll() { charts[state.orientation].draw(); charts[state.orientation === 'portrait' ? 'landscape' : 'portrait'].first = true; }
function refreshLabels() {
  document.querySelectorAll('.interval-label').forEach(el => el.textContent = state.interval);
  const t = TYPES.find(t => t.value === state.type);
  document.querySelectorAll('.type-icon').forEach(el => el.innerHTML = t.icon);
}

/* ============================================================
   ORIENTATION
   ============================================================ */
let switching = false;
function applyScale() {
  const land = state.orientation === 'landscape';
  const pw = land ? 852 : 393, ph = land ? 393 : 852;
  const availH = window.innerHeight - 150, availW = window.innerWidth - 40;
  const s = Math.min(1, availH / ph, availW / pw);
  document.getElementById('stage').style.transform = `scale(${s.toFixed(3)})`;
}
function setOrientation(o) {
  if (o === state.orientation || switching) return;
  dtCancelPlacing();
  setTimeout(() => document.querySelectorAll('.chart-module').forEach(updateCmpStuck), 650);
  switching = true;
  closeOverlays();
  const prev = state.orientation;
  state.orientation = o;
  const cur = document.getElementById(prev === 'portrait' ? 'viewPortrait' : 'viewLandscape');
  const next = document.getElementById(o === 'portrait' ? 'viewPortrait' : 'viewLandscape');
  charts[prev].clear();
  cur.classList.remove('active');
  const phone = document.getElementById('phone');
  let done = false;
  function finish() {
    if (done) return; done = true;
    phone.removeEventListener('transitionend', onEnd);
    charts[o].first = true;
    charts[o].draw();
    next.classList.add('active');
    switching = false;
  }
  function onEnd(e) { if (e.target === phone && e.propertyName === 'width') finish(); }
  setTimeout(() => {
    phone.addEventListener('transitionend', onEnd);
    phone.classList.toggle('landscape', o === 'landscape');
    applyScale();
    setTimeout(finish, 800);   /* fallback if transitionend never fires */
  }, 180);
}
window.addEventListener('resize', applyScale);

/* ============================================================
   VIEW MODE: portrait | landscape (picker below the phone)
   ============================================================ */
let mode = 'portrait';
function syncPicker(m) {
  const picker = document.getElementById('orientPicker');
  picker.dataset.sel = m;
  picker.querySelectorAll('.orient-opt').forEach(b => b.classList.toggle('active', b.dataset.o === m));
}
function setMode(m) {
  if (m === mode || switching) return;
  mode = m;
  syncPicker(m);
  setOrientation(m);
}

const sheetEl = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
function openSheet(title, bodyHTML, sub, drawer, actionsHTML) {
  sheetEl.className = 'sheet' + (drawer ? ' drawer h-' + drawer : '');
  const t = document.getElementById('sheetTitle');
  t.classList.toggle('has-seg', title.indexOf('class="seg"') !== -1);
  t.innerHTML = title + (sub ? `<div class="sheet-sub">${sub}</div>` : '');
  document.getElementById('sheetActions').innerHTML = actionsHTML || '';
  sheetEl.querySelector('.sheet-menu')?.remove();
  sheetBody.innerHTML = bodyHTML;
  document.getElementById('backdrop').classList.add('open');
  sheetEl.classList.add('open');
}
function closeOverlays() {
  document.querySelectorAll('.sheet.open, .backdrop.open, .cs-scrim.open').forEach(el => el.classList.remove('open'));
}
/* ---- Interval + date range drawer ---- */
const IV_SECTIONS = [
  { title: 'Seconds', items: ['1s', '5s', '10s', '15s', '30s', '45s'] },
  { title: 'Minutes', items: ['1m', '2m', '3m', '5m', '10m', '15m', '30m', '45m'] },
  { title: 'Hours',   items: ['1H', '2H', '3H', '4H'] },
  { title: 'Days',    items: ['1D', '1W', '1M', '3M', '6M', '12M'] }
];
const RANGES = ['1D', '1W', '1M', '3M', '6M', 'YTD', '1Y', '2Y', '3Y', '5Y', 'Max'];
/* trading days per range on daily bars; 1D/1W fall back to the smallest sensible window, everything is capped at the loaded history */
const RANGE_BARS = { '1D': MIN_BARS, '1W': MIN_BARS, '1M': 22, '3M': 64, '6M': 128, 'YTD': BARS.length, '1Y': 252, '2Y': 504, '3Y': 756, '5Y': 1260, 'Max': Infinity };
let drawerTab = 'interval';
function drawerSegHTML() {
  return `<div class="seg"><button class="seg-opt ${drawerTab === 'interval' ? 'active' : ''}" data-tab="interval">Interval</button><button class="seg-opt ${drawerTab === 'range' ? 'active' : ''}" data-tab="range">Date Range</button></div>`;
}
function drawerBodyHTML() {
  if (drawerTab === 'interval') {
    return IV_SECTIONS.map((s, k) =>
      `${k ? '<div class="iv-div"></div>' : ''}<div class="iv-sec"><div class="iv-title">${s.title}</div><div class="iv-row">` +
      s.items.map(v => `<button class="iv-chip ${v === state.interval ? 'active' : ''} ${s.disabled ? 'disabled' : ''}" data-iv="${v}" ${s.disabled ? 'disabled' : ''}>${v}</button>`).join('') +
      `</div></div>`).join('');
  }
  /* Date Range: the same chip cells as the Interval tab, wrapping into rows, no titles, no horizontal scroll */
  return `<div class="iv-wrap">${RANGES.map(v => `<button class="iv-chip ${state.range === v ? 'active' : ''}" data-range="${v}">${v}</button>`).join('')}</div>`;
}
function openIntervalDrawer(tab) {
  drawerTab = tab || 'interval';
  pickHandler = null;
  openSheet(drawerSegHTML(), drawerBodyHTML(), null, 'interval');
}
function applyRange(v) {
  state.range = v;
  const count = clamp(RANGE_BARS[v], MIN_BARS, BARS.length);
  Object.values(charts).forEach(c => { c.cancelScroll(); if (c.stopInertia) c.stopInertia(); c.clear(); c.view.count = count; c.view.start = BARS.length - count; });
  drawAll();
}

  { label: 'Area', value: 'area', icon: ICO.area },
  { label: 'Line', value: 'line', icon: ICO.line },
  { label: 'Baseline', value: 'baseline', icon: ICO.baseline },
  { label: 'Candles', value: 'candles', icon: ICO.candle },
  { label: 'Bars', value: 'bars', icon: ICO.ohlc },
  { label: 'Hollow Candles', value: 'hollow', icon: ICO.hollow },
  { label: 'Heikin Ashi', value: 'heikin', icon: ICO.heikin },
  { label: 'Renko', value: 'renko', icon: ICO.renko },
  { label: 'Line Break', value: 'linebreak', icon: ICO.lbreak },
  { label: 'Kagi', value: 'kagi', icon: ICO.kagi },
  { label: 'Point & Figure', value: 'pnf', icon: ICO.pnf }
];
function openTypeSheet() {
  pickHandler = v => { state.type = v; refreshLabels(); drawAll(); markDirty(); };
  /* web groups: Standard / OHLC / Advanced */
  const groups = [['Standard', ['area', 'line', 'baseline']], ['OHLC', ['candles', 'bars', 'hollow', 'heikin']], ['Advanced', ['renko', 'linebreak', 'kagi', 'pnf']]];
  openSheet('Chart type', groups.map(([name, vals]) => `<div class="iv-title">${name}</div><div class="card-grid">${vals.map(v => TYPES.find(t => t.value === v)).map(t =>
    `<div class="tcard ${state.type === t.value ? 'sel' : ''}" data-pick="${t.value}"><div class="tcard-ico">${t.icon}</div><div class="tcard-label">${t.label}</div></div>`).join('')}</div>`).join(''), null, 'type');
}

/* ---- Drawing tools drawer ---- */
/* Glyph primitives (24 viewBox, 1.5 stroke); every tool maps to one. */

  const sc = root.querySelector('.cmp-scroll'), w = root.querySelector('.cmp-tog-wrap'); if (!sc || !w) return;
  w.classList.toggle('stuck', sc.scrollWidth - sc.clientWidth - sc.scrollLeft > 1);
}
window.addEventListener('resize', () => document.querySelectorAll('.chart-module').forEach(updateCmpStuck));
function renderCompare() {
  const on = state.compare.length > 0;
  document.querySelectorAll('.chart-module').forEach(root => {
    root.querySelector('.chart-head').classList.toggle('cmp', on);
    const row = root.querySelector('.ch-cmprow');
    row.innerHTML = !on ? '' :
      `<div class="cmp-scroll">${state.compare.map(c => `<span class="cmp-chip" data-cmp="${c.sym}"><span class="cmp-sw" data-cmpsw="${c.sym}" style="background:${cmpColor(c)}" role="button" aria-label="Change ${c.sym} colour"></span>${c.sym}<span class="cmp-div"></span><button class="cmp-x" data-cmprm="${c.sym}" aria-label="Remove ${c.sym}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>`).join('')}<div class="cmp-tog-wrap"><div class="cmp-toggle"><button data-cmpmode="%" class="${state.cmpMode === '%' ? 'active' : ''}">%</button><button data-cmpmode="$" class="${state.cmpMode === '$' ? 'active' : ''}">$</button></div></div></div>`;
    const sc = row.querySelector('.cmp-scroll'); if (sc) sc.addEventListener('scroll', () => updateCmpStuck(root), { passive: true });
    updateCmpStuck(root);   /* toggle travels with the chips as the last item of the scrolling row */
  });
}
document.addEventListener('click', e => {
  const csw = e.target.closest('[data-cmpsw]');
  if (csw) { const c = state.compare.find(x => x.sym === csw.dataset.cmpsw); if (c) openColorSheet({ color: cmpColor(c), onPick: col => { c.color = col; renderCompare(); drawAll(); markDirty(); } }); return; }
  const rm = e.target.closest('[data-cmprm]'); if (rm) { removeCompare(rm.dataset.cmprm); return; }
  const md = e.target.closest('[data-cmpmode]'); if (md) setCmpMode(md.dataset.cmpmode);
});

function dtSheetBody(a, D, m) {
  const st = D.st, row = (l, inner, extra) => `<div class="row is-row" ${extra || ''}><span class="is-lbl">${l}</span>${inner}</div>`;
  const slider = (key, v, mn, mx, stp, lbl) => `<div class="row is-row is-opa"><span class="is-lbl">${lbl}</span><span class="is-val is-pct" data-dtpct="${key}">${v}%</span></div><div class="is-slider"><input type="range" min="${mn}" max="${mx}" step="${stp}" value="${v}" data-dtr="${key}" style="--p:${(v - mn) / (mx - mn) * 100}%" aria-label="${lbl}"></div>`;
  if (a === 'width') {
    const opts = [...new Set([1, 2, 3, m.w || 1.5])].sort((x, y) => x - y);
    return `<div class="dt-sb"><div class="seg dt-seg">${opts.map(w => `<button class="seg-opt ${+st.w === w ? 'active' : ''}" data-dtset="w" data-v="${w}"><span class="dt-seg-in">${dtLineIco('solid', Math.min(w, 6))}<span>${w}px</span></span></button>`).join('')}</div></div>`;
  }
  if (a === 'style') return `<div class="dt-sb"><div class="seg dt-seg">${[['solid', 'Line'], ['dashed', 'Dashed'], ['dotted', 'Dotted']].map(([s, l]) => `<button class="seg-opt ${st.s === s ? 'active' : ''}" data-dtset="s" data-v="${s}"><span class="dt-seg-in">${dtLineIco(s)}<span>${l}</span></span></button>`).join('')}</div></div>`;
  if (a === 'opacity') return `<div class="dt-sb">${slider('o', st.o, 10, 100, 5, 'Opacity')}</div>`;
  if (a === 'fill') return `<div class="dt-sb">${row('Fill colour', `<span class="is-sw" style="background:${st.fc}"></span><span class="is-chev">${ICO.chevSm}</span>`, 'data-dtfc="1"')}${slider('fo', st.fo, 0, 100, 5, 'Opacity')}</div>`;
  if (a === 'text') return `<div class="dt-sb"><div class="dt-field"><input type="text" data-dtt="text" value="${escHTML(D.text || '')}" placeholder="Text" enterkeyhint="done" autocomplete="off"></div></div>`;
  if (a === 'note') return `<div class="dt-sb"><div class="dt-field"><textarea data-dtt="note" rows="4" placeholder="Add a note">${escHTML(D.note || '')}</textarea></div></div>`;
  if (a === 'coords') {
    const priceOnly = m.cf === 'p';
    const rows = D.pts.map((q, k) => `<div class="dt-cgrp"><div class="iv-title">#${k + 1}</div>` +
      row('Price', `<span class="is-step"><button data-dtc="pdec" data-k="${k}" aria-label="Decrease">&minus;</button><input class="is-num dt-pin" data-k="${k}" type="text" inputmode="decimal" value="${q.p.toFixed(2)}"><button data-dtc="pinc" data-k="${k}" aria-label="Increase">+</button></span>`) +
      (priceOnly ? '' : row('Bar', `<span class="is-step"><button data-dtc="bdec" data-k="${k}" aria-label="Earlier bar">&minus;</button><span class="is-num dt-bval">${dtDate(q.b)}</span><button data-dtc="binc" data-k="${k}" aria-label="Later bar">+</button></span>`)) + `</div>`).join('');
    const chk = m.chk === null ? '' : `<div class="is-grp">${row('Show price labels on axis', `<button class="sw ${st.lbl ? 'on' : ''}" data-dtc="lbl" aria-label="Show price labels on axis"></button>`)}</div>`;
    return `<div class="dt-sb dt-coords">${rows}${chk}</div>`;
  }
  return '';
}
const DT_SHEET_TITLE = { width: 'Line width', style: 'Line style', opacity: 'Opacity', fill: 'Fill', text: 'Text', note: 'Note', coords: 'Coordinates' };
function dtOpenSheet(a, D, m) {
  openSheet(DT_SHEET_TITLE[a], dtSheetBody(a, D, m), null, a === 'coords' ? 'dtcoords' : null);
  sheetEl.classList.add('dt-sheet', 'dt-' + a);
  DRW.sheet = { a, id: D.id };
  const f = sheetBody.querySelector('[data-dtt]'); if (f) setTimeout(() => { try { f.focus(); } catch (_) {} }, 60);
}
function dtRefreshSheet() {
  if (!DRW.sheet || !sheetEl.classList.contains('dt-sheet') || !sheetEl.classList.contains('open')) return;
  const D = dtFind(DRW.sheet.id); if (!D) return;
  if (DRW.sheet.a === 'coords') { const top = sheetBody.scrollTop; sheetBody.innerHTML = dtSheetBody('coords', D, dtMeta(D.name)); sheetBody.scrollTop = top; }
}
function dtCloseSheetIfOther() { if (DRW.sheet && DRW.sheet.id !== DRW.sel && sheetEl.classList.contains('dt-sheet')) { closeOverlays(); DRW.sheet = null; } }
sheetEl.addEventListener('click', e => {
  if (!sheetEl.classList.contains('dt-sheet') || !DRW.sheet) return;
  const D = dtFind(DRW.sheet.id); if (!D) return;
  const set = e.target.closest('[data-dtset]');
  if (set) { const k = set.dataset.dtset; D.st[k] = k === 'w' ? +set.dataset.v : set.dataset.v; sheetBody.querySelectorAll('[data-dtset]').forEach(b => b.classList.toggle('active', b === set)); dtApply(); return; }
  if (e.target.closest('[data-dtfc]')) { openColorSheet({ color: D.st.fc, onPick: c => { D.st.fc = c; sheetBody.innerHTML = dtSheetBody('fill', D, dtMeta(D.name)); dtApply(); } }); return; }
  const c = e.target.closest('[data-dtc]');
  if (c) {
    const k = +c.dataset.k, a = c.dataset.dtc;
    if (a === 'lbl') D.st.lbl = !D.st.lbl;
    else if (a === 'pdec' || a === 'pinc') D.pts[k].p = Math.max(0.01, +(D.pts[k].p + (a === 'pinc' ? 1 : -1)).toFixed(2));
    else if (a === 'bdec' || a === 'binc') D.pts[k].b = clamp(Math.round(D.pts[k].b) + (a === 'binc' ? 1 : -1), 0, BARS.length - 1 + DT_FUTURE);
    dtRefreshSheet(); dtApply();
  }
});
sheetEl.addEventListener('input', e => {
  if (!sheetEl.classList.contains('dt-sheet') || !DRW.sheet) return;
  const D = dtFind(DRW.sheet.id); if (!D) return;
  const t = e.target;
  if (t.dataset.dtr) { const k = t.dataset.dtr, v = +t.value; D.st[k] = v; t.style.setProperty('--p', (v - +t.min) / (+t.max - +t.min) * 100 + '%'); const pc = sheetBody.querySelector(`[data-dtpct="${k}"]`); if (pc) pc.textContent = v + '%'; dtApply(); return; }
  if (t.dataset.dtt) { D[t.dataset.dtt] = t.value; dtApply(); return; }
  if (t.classList.contains('dt-pin')) { t.value = t.value.replace(/[^0-9.]/g, ''); const v = parseFloat(t.value); if (isFinite(v) && v > 0) { D.pts[+t.dataset.k].p = v; dtApply(); } }
});
sheetEl.addEventListener('keydown', e => { if (sheetEl.classList.contains('dt-sheet') && e.key === 'Enter' && e.target.matches('input[data-dtt]')) closeOverlays(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.target.matches('input, textarea')) return;
  if (DRW.placing) dtCancelPlacing(); else if (DRW.sel && !sheetEl.classList.contains('open')) dtSelect(null);
});

/* ============================================================
   ACTIONS (event delegation)
   ============================================================ */
document.addEventListener('click', e => {
  const lgr = e.target.closest('.lg-row');   /* tap an indicator's legend row: its settings */
  if (lgr && lgr.dataset.id) { openIndSettings(lgr.dataset.id); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  switch (act) {
    case 'add':        openSymbolDrawer('add'); break;
    case 'symbol':     openSymbolDrawer('search'); break;
    case 'interval':   openIntervalDrawer('interval'); break;
    case 'type':       openTypeSheet(); break;
    case 'draw':       openDrawTools(); break;
    case 'layers':     openIndicators(); break;
    case 'save-layout': saveLayoutTap(); break;
    case 'layouts':    openLayoutsDrawer(); break;
    case 'camera':     shareChart(); break;
    case 'alert':      openAlertDrawer(); break;
    case 'back':       toast('Back to the app'); break;
    case 'latest':     charts[state.orientation].scrollToLatest(); break;
    case 'zoom-default': charts[state.orientation].zoomToDefault(); break;
    case 'layers-panel': openLayersDrawer('drawings'); break;
    case 'legend-toggle': state.legendOpen = !state.legendOpen; renderLegend(); drawAll(); break;
    case 'settings':   { const c = charts[state.orientation]; if (c.settingsEl.classList.contains('open')) c.closeSettings(); else c.openSettings(); } break;
    case 'analyze':    openAnalyze(); break;
  }
});

/* ============================================================
   LIVE TICKS - small random nudges to the last close every 1-2 s,
   paused while any crosshair is active so hovered values stay put
   ============================================================ */
const LIVE0 = LAST.c;
let liveTimer = 0;
function tickOnce() {
  const xhActive = Object.values(charts).some(c => c.hover);
  if (!xhActive && document.visibilityState !== 'hidden') {
    let np = LAST.c * (1 + (0.05 + Math.random() * 0.15) / 100 * (Math.random() < 0.5 ? -1 : 1));
    if (Math.abs(np - LIVE0) / LIVE0 > 0.004) np = LAST.c - (LAST.c - LIVE0) * 0.5;   /* leash: never drifts far from the real close */
    np = Math.round(np * 100) / 100;
    const dir = np > LAST.c ? 'up' : np < LAST.c ? 'down' : '';
    LAST.c = np; LAST.h = Math.max(LAST.h, np); LAST.l = Math.min(LAST.l, np);
    state.compare.forEach(c => { const a = CMP_SERIES[c.sym]; if (a) a[a.length - 1] = Math.round(a[a.length - 1] * (1 + (Math.random() - 0.5) * 0.001) * 100) / 100; });
    const hb = HA[HA.length - 1]; hb.c = (LAST.o + LAST.h + LAST.l + LAST.c) / 4; hb.h = Math.max(LAST.h, hb.o, hb.c); hb.l = Math.min(LAST.l, hb.o, hb.c);
    Object.keys(charts).forEach(k => { if (k === state.orientation) charts[k].tick(dir); else { charts[k].pxEl.textContent = fmt(LAST.c); charts[k].chgEl.textContent = chgText(); } });
  }
  liveTimer = setTimeout(tickOnce, 1000 + Math.random() * 1000);
}
liveTimer = setTimeout(tickOnce, 1500);

/* ============================================================
   INIT
   ============================================================ */
loadLayoutsStore();
if (activeLayout()) restoreState(activeLayout().state);
renderLegend();
refreshLayoutBtn();
refreshLabels();
applyScale();
requestAnimationFrame(() => charts.portrait.draw());
</script>
</body>
</html>
