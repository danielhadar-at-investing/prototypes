<!DOCTYPE html>
<html lang="en" data-plan="paid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Tab Overhaul</title>
<style>
  :root {
    --bg: #FFFFFF;
    --bg-page: #E8E8ED;
    --bg-card: #FAFAFA;
    --card: #FAFAFA;
    --card-alt: #E5E7EB;
    --text-primary: #1A1A2E;
    --text-secondary: #6B7280;
    --text-tertiary: #9CA3AF;
    --green: #0ECB81;
    --green-bg: rgba(14, 203, 129, 0.08);
    --red: #E23636;
    --red-bg: rgba(226, 54, 54, 0.08);
    --blue: #2563EB;
    --blue-bg: rgba(37, 99, 235, 0.08);
    --yellow: #ffab00;
    --yellow-bg: rgba(255,171,0,0.12);
    --border: #F0F0F0;
    --border-dark: #E5E7EB;
    --radius: 12px;
    --radius-sm: 8px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #E8E8ED;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    min-height: 100vh;
    padding: 24px 0;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .device-frame {
    width: 390px;
    height: 844px;
    background: #E0E0E0;
    border-radius: 44px;
    padding: 12px;
    position: relative;
    box-shadow: 0 0 80px rgba(0,0,0,0.12);
    border: 1px solid #D0D0D0;
  }

  .device-screen {
    width: 100%;
    height: 100%;
    background: var(--bg);
    border-radius: 36px;
    overflow: hidden;
    position: relative;
  }

  /* Status bar */
  .status-bar {
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    z-index: 10;
    background: var(--bg);
  }
  .status-bar .time { font-size: 15px; font-weight: 700; }
  .status-bar .icons { display: flex; gap: 5px; align-items: center; font-size: 12px; }

  /* Notch / Dynamic Island */
  .dynamic-island {
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
  }

  /* Screen container for transitions */
  .screen-container {
    position: absolute;
    top: 54px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
  }

  /* Main screen */
  .main-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }
  .main-screen.pushed {
    transform: translateX(-30%);
    pointer-events: none;
  }

  /* Nav bar */
  .nav-bar {
    height: 48px;
    background: var(--bg);
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .nav-back {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .nav-title {
    flex: 1;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.3px;
  }
  /* Category tabs */
  .cat-tabs {
    height: 44px;
    background: var(--bg);
    display: flex;
    align-items: stretch;
    padding: 0 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    padding: 0 12px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-tertiary);
    white-space: nowrap;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    transition: color 0.2s;
  }
  .cat-tab.active {
    color: var(--text-primary);
    font-weight: 600;
  }
  .cat-tab.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 12px;
    right: 12px;
    height: 2.5px;
    background: #1A1A2E;
    border-radius: 2px 2px 0 0;
  }

  /* Scrollable content */
  .scroll-content {
    height: calc(100% - 92px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .scroll-content::-webkit-scrollbar { display: none; }


  /* Financial Health block (coast-to-coast, no card) */
  .health-block {
    margin: 0 -16px 20px;
  }
  /* Overall score summary: continuous speedometer (TradingView-style thin arc) */
  .health-summary {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 16px 20px;
  }
  .gauge-svg {
    width: 100%;
    max-width: 300px;
    display: block;
    overflow: visible;
  }
  .gauge-label {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    fill: #8A8F98;
    transition: fill 0.3s;
  }
  .gauge-label.active { font-weight: 600; }
  /* Score + level sit under the arc (two lines, no pill) */
  .gauge-wrap {
    position: relative;
    width: 100%;
    max-width: 300px;
  }
  .gauge-value {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.1;
  }
  .gauge-score {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.8px;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .gauge-level {
    font-size: 14px;
    font-weight: 600;
    margin-top: 2px;
    transition: color 0.3s;
  }
  .gauge-needle {
    transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
  }

  /* Tab content */
  .tab-content {
    padding: 16px;
  }

  /* Health category rows (iOS inset grouped list, like Settings) */
  .health-rows {
    margin: 0 16px;
    background: #F5F5F7;
    border-radius: 14px;
    overflow: hidden;
  }
  .health-row {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 52px;
    padding: 10px 14px 10px 16px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .health-row:active { background: rgba(0,0,0,0.04); }
  /* Inset separator: starts at the text, runs to the card edge */
  .health-row + .health-row::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 0;
    height: 1px;
    background: rgba(0,0,0,0.07);
  }
  .health-row-text { flex: 1; min-width: 0; }
  .health-name {
    font-size: 14px;
    font-weight: 500;
    /* A touch heavier than medium without snapping to semibold (browsers round 530 up to 600) */
    -webkit-text-stroke: 0.2px currentColor;
    line-height: 1.3;
    color: var(--text-primary);
  }
  /* Edited state: neutral subtitle, e.g. "Custom · 9 of 11 metrics" */
  .health-sub {
    font-size: 12px;
    color: #8E8E93;
    margin-top: 2px;
  }
  .health-score-val {
    font-size: 15px;
    font-weight: 700;
    text-align: right;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  .health-chevron {
    margin-left: 8px;
    color: var(--text-tertiary);
    display: flex;
    flex-shrink: 0;
  }

  /* Health history (coast-to-coast, no card) */
  .history-block {
    margin: 0 -16px 8px;
  }
  /* Range picker - matches the Overview chart timeframe row */
  .range-seg {
    display: flex;
    justify-content: space-between;
    margin: 12px 16px 0;
  }
  .range-seg-btn {
    height: 28px;
    min-width: 48px;
    padding: 0 12px;
    border: none;
    background: transparent;
    border-radius: 14px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    color: #6B7280;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .range-seg-btn.active {
    background: #F0F0F2;
    color: var(--text-primary);
    font-weight: 700;
  }
  .history-chart {
    position: relative;
    padding: 0 8px;
    touch-action: pan-y;
  }
  .history-chart canvas {
    width: 100%;
    height: 200px;
    display: block;
  }
  .chart-scrub {
    position: absolute;
    top: 0;
    min-width: 132px;
    padding: 8px 10px;
    background: rgba(255,255,255,0.96);
    border: 1px solid var(--border-dark);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    font-size: 11px;
    color: var(--text-primary);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .chart-scrub.visible { opacity: 1; }
  .chart-scrub-date {
    font-weight: 700;
    margin-bottom: 4px;
  }
  .chart-scrub-row {
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.6;
  }
  .chart-scrub-row span:nth-child(2) { flex: 1; color: var(--text-secondary); }
  .chart-scrub-row b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .chart-scrub-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  /* Legend (TradingView style): small rounded swatch + regular gray label, tap to toggle */
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    padding: 14px 16px 2px;
  }
  .chart-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 400;
    color: #6B7280;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    padding: 2px 0;
    transition: color 0.2s, opacity 0.2s;
  }
  .chart-legend-item::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--chip-color);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .chart-legend-item.off { color: #C7CACD; }

  /* Free plan: design-system lock (Pro orange) in place of locked numbers */
  .lock-num { display: inline-flex; align-items: center; justify-content: center; vertical-align: -2px; cursor: pointer; padding: 2px; margin: -2px; }
  .lock-num svg { width: 11px; height: 14px; display: block; }
  .health-score-val .lock-num svg, .hmetric-score .lock-num svg { width: 12px; height: 15px; }
  .hmetric-score .lock-num { justify-content: flex-end; width: 100%; }
  .lock-slot { position: relative; display: inline-block; cursor: pointer; }
  .lock-slot .ph { visibility: hidden; }
  .lock-slot svg { position: absolute; left: 50%; top: 50%; width: 12px; height: 15px; transform: translate(-50%, -50%); }
  .mchart-box { position: relative; }
  .mchart-box.locked canvas { filter: blur(5px); opacity: 0.7; }
  .mchart-lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .mchart-lock svg { width: 20px; height: 25px; }
  .mcta-label { display: inline-flex; align-items: center; gap: 6px; }
  html[data-plan="free"] .history-chart canvas { cursor: pointer; }
  /* "Show subscription screen" stand-in for the paywall */
  .paywall-tip { position: fixed; z-index: 1000; transform: translate(-50%, calc(-100% - 12px)); background: #1A1A2E; color: #fff; font: 600 12px var(--font); padding: 7px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  .paywall-tip.show { opacity: 1; }
  .paywall-tip::after { content: ''; position: absolute; left: var(--arrow-x, 50%); bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-bottom: 0; border-top-color: #1A1A2E; }
  .chart-legend-item.off::before { background: #ECECEF; }

  /* Detail screens */
  .detail-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 30;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .detail-screen::-webkit-scrollbar { display: none; }
  .detail-screen.visible {
    transform: translateX(0);
  }
  .detail-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 5;
    border-bottom: 1px solid var(--border);
  }
  .detail-back {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-primary);
    font-size: 20px;
    border-radius: 8px;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .detail-back:active { background: rgba(0,0,0,0.04); }
  .detail-title {
    flex: 1;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
  }


  /* ===== Metric row preview (option D) ===== */
  .mfacts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  .mfact { background: #fff; border-radius: 10px; padding: 8px 10px; }
  .mfact .k { font-size: 11px; color: var(--text-tertiary); }
  .mfact .v { font-size: 14px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .mcta { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 8px; padding: 11px 12px; background: #fff; border: 0; border-radius: 10px; font: 600 13px var(--font); color: var(--text-primary); cursor: pointer; }
  .mcta:active { background: #F3F3F5; }

  /* ===== Full metric page ===== */
  .detail-screen.pushed { transform: translateX(-30%); }
  #metricPage { z-index: 40; }
  .mp-header .detail-back { width: auto; gap: 6px; padding-right: 8px; font-size: 16px; font-weight: 500; }
  .mp-header .detail-title { opacity: 0; transition: opacity .2s; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-header.scrolled .detail-title { opacity: 1; }
  .mp-header { border-bottom-color: transparent; transition: border-color .2s; }
  .mp-header.scrolled { border-bottom-color: var(--border); }
  .mp-hero { padding: 4px 16px 0; }
  .mp-eyebrow { font-size: 12px; font-weight: 500; color: #8A8F98; }
  .mp-hero h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2; margin-top: 2px; color: var(--text-primary); }
  .mp-desc { font-size: 14px; line-height: 1.45; color: #4B5563; margin-top: 6px; }
  .mp-kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; margin-top: 16px; background: #F5F5F7; border-radius: 14px; }
  .mp-kpi { padding: 12px 10px; text-align: center; }
  .mp-kpi + .mp-kpi { border-left: 1px solid rgba(0,0,0,0.07); }
  .mp-kpi .k { font-size: 12px; color: #8A8F98; }
  .mp-kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .mp-kpi .v small { font-size: 13px; font-weight: 600; margin-left: 4px; }
  .mp-calc { margin-top: 12px; }
  .mp-calc .mp-li .l { font-size: 13px; }
  .mp-note { margin-top: 10px; font-size: 13px; color: #8A8F98; line-height: 1.4; }
  .mp-sec { padding: 30px 16px 0; }
  .mp-sec h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-primary); }
  .mp-sub { font-size: 13px; color: #8A8F98; margin-top: 3px; line-height: 1.4; }
  .mp-seg { display: flex; padding: 2px; background: #F0F0F2; border-radius: 9px; margin: 14px 0 10px; }
  .mp-seg button { flex: 1; height: 28px; border: 0; background: none; border-radius: 7px; font: 600 13px var(--font); color: #8A8F98; cursor: pointer; }
  .mp-seg button.on { background: #fff; color: var(--text-primary); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .mp-chart { position: relative; }
  .mp-chart svg { display: block; width: 100%; height: 170px; touch-action: pan-y; }
  .mp-tip { position: absolute; top: 0; padding: 6px 9px; background: #fff; border: 1px solid #E5E7EB; border-radius: 9px; box-shadow: 0 4px 14px rgba(0,0,0,.08); font-size: 12px; color: #4B5563; pointer-events: none; white-space: nowrap; display: none; }
  .mp-tip b { display: block; font-size: 13px; color: var(--text-primary); }
  .mp-list { background: #F5F5F7; border-radius: 12px; margin-top: 12px; overflow: hidden; }
  .mp-li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; font-size: 14px; position: relative; }
  .mp-li + .mp-li::before { content: ''; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: rgba(0,0,0,0.07); }
  .mp-li .l { color: #4B5563; }
  .mp-li .l small { display: block; font-size: 12px; color: #8A8F98; margin-top: 1px; }
  .mp-li .r { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .mp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .mp-chip { font-size: 12px; padding: 4px 8px; border-radius: 8px; background: #F5F5F7; color: #4B5563; font-variant-numeric: tabular-nums; }
  .mp-chip b { font-weight: 600; color: var(--text-primary); }
  .mp-up { color: #3E8E3A; } .mp-down { color: #D0473C; }
  .mp-rank { display: inline-flex; align-items: baseline; gap: 6px; margin-top: 10px; font-size: 13px; color: #4B5563; }
  .mp-rank b { font-size: 20px; color: var(--text-primary); }
  .mp-peer { display: grid; grid-template-columns: 1fr 84px 66px; align-items: center; gap: 10px; padding: 8px 14px; font-size: 13px; position: relative; }
  .mp-peer + .mp-peer::before { content: ''; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: rgba(0,0,0,0.07); }
  .mp-peer .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #4B5563; }
  .mp-peer .n small { color: #8A8F98; margin-left: 4px; font-size: 11px; }
  .mp-peer.me .n { color: var(--text-primary); font-weight: 700; }
  .mp-peer.avg .n { color: #8A8F98; font-style: italic; }
  .mp-peer .track { position: relative; height: 8px; }
  .mp-peer .track i { position: absolute; top: 0; height: 8px; border-radius: 3px; background: #9DB4EA; }
  .mp-peer.me .track i { background: #3D63D1; }
  .mp-peer.avg .track i { background: #C7CACD; }
  .mp-peer .track .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: #C7CACD; }
  .mp-peer .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .mp-big { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-top: 6px; color: var(--text-primary); }
  .mp-big small { font-size: 14px; font-weight: 500; color: #4B5563; margin-left: 6px; letter-spacing: 0; }
  .mp-ptrack { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #E0574C, #EC9A4C, #D4B03A, #7CC860, #4FA83D); margin: 14px 0 6px; opacity: .85; }
  .mp-ptrack .mk { position: absolute; top: -5px; width: 4px; height: 18px; border-radius: 2px; background: var(--text-primary); transform: translateX(-50%); box-shadow: 0 0 0 2px #fff; }
  .mp-pscale { display: flex; justify-content: space-between; font-size: 11px; color: #8A8F98; }
  .mp-formula { margin-top: 12px; padding: 12px 14px; background: #F5F5F7; border-radius: 12px; font: 500 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-primary); }
  .mp-formula .cap { font: 600 11px var(--font); color: #8A8F98; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .mp-p { font-size: 14px; line-height: 1.5; color: #4B5563; margin-top: 10px; }
  .mp-foot { padding: 30px 16px 40px; font-size: 11px; color: #8A8F98; line-height: 1.5; }

  /* Detail tables */
  .detail-section {
    padding: 0 16px 16px;
  }
  .detail-table {
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  /* Health detail - model selector chips */
  .health-detail-chips {
    display: flex;
    gap: 6px;
    padding: 12px 16px 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .health-detail-chips::-webkit-scrollbar { display: none; }
  /* All chips the same size; selected = dark outline on white, neutral (no accent color) */
  .health-detail-chip {
    flex-shrink: 0;
    width: 116px;
    height: 78px;
    padding: 11px 12px 12px;
    border-radius: var(--radius);
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s, background 0.2s;
  }
  .health-detail-chip.active {
    border-color: var(--text-primary);
    background: #fff;

function showPaywall(e) {
  let tip = document.getElementById('paywallTip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'paywallTip'; tip.className = 'paywall-tip'; tip.textContent = 'Show subscription screen'; document.body.appendChild(tip); }

// Prototype score presets: target category averages per overall level.
// Good is the real Apple data (3.0); the others shift every metric score in a category
// by the same amount (clamped 0.2-5.0) until the category hits its target.
const SCORE_PRESETS = {
  Weak:      { 'Cash Flow Health': 1.4, 'Growth Health': 1.0, 'Price Momentum': 1.6, 'Profitability Health': 1.3, 'Relative Value': 0.7 },
  Fair:      { 'Cash Flow Health': 2.3, 'Growth Health': 1.9, 'Price Momentum': 2.6, 'Profitability Health': 2.4, 'Relative Value': 1.3 },
  Good:      null,
  Great:     { 'Cash Flow Health': 4.1, 'Growth Health': 4.0, 'Price Momentum': 4.4, 'Profitability Health': 4.8, 'Relative Value': 3.6 },
  Excellent: { 'Cash Flow Health': 4.8, 'Growth Health': 4.8, 'Price Momentum': 4.9, 'Profitability Health': 4.9, 'Relative Value': 4.6 }
};
let scorePreset = 'Great';
const baseMetrics = {};   // name -> [{ score, pct, rel }]

function snapshotBaseData() {
  Object.keys(healthMetrics).forEach(name => {
    baseMetrics[name] = healthMetrics[name].map(m => {
      const s = m[3], p = m[2];
      // Percentile moves with the score: direct (p ~ s * 20), inverse (valuation ratios), or fixed
      const rel = s === null ? null : Math.abs(p / 20 - s) < 0.3 ? 'direct' : Math.abs((100 - p) / 20 - s) < 0.3 ? 'inverse' : null;
      return { score: s, pct: p, rel };
    });
  });
}

function shiftedScore(s, d) { return Math.min(5, Math.max(0.2, Math.round((s + d) * 10) / 10)); }

function applyScorePreset(name) {
  scorePreset = name;
  const targets = SCORE_PRESETS[name];
  healthModels.forEach(hm => {
    const base = baseMetrics[hm.name];
    const scored = base.filter(b => b.score !== null);
    let d = 0;
    if (targets) {
      let lo = -5, hi = 5;
      for (let it = 0; it < 50; it++) {
        d = (lo + hi) / 2;
        const avg = scored.reduce((sum, b) => sum + shiftedScore(b.score, d), 0) / scored.length;
        if (avg < targets[hm.name]) lo = d; else hi = d;
      }
      d = hi;
    }
    healthMetrics[hm.name].forEach((m, i) => {
      const b = base[i];
      m[4] = defaultMetricOn[hm.name][i];
      if (b.score === null) return;
      m[3] = targets ? shiftedScore(b.score, d) : b.score;
      const delta = (m[3] - b.score) * 20;
      if (b.rel === 'direct') m[2] = Math.min(100, Math.max(0, Math.round((b.pct + delta) * 10) / 10));
      else if (b.rel === 'inverse') m[2] = Math.min(100, Math.max(0, Math.round((b.pct - delta) * 10) / 10));
      else m[2] = b.pct;
    });
    hm.score = recalcHealthScore(hm.name);
  });
  renderScoreToggle();
  renderHealthRows();
  updateOverallHealthScore();
  renderHealthChart();
  if (document.getElementById('healthDetail').classList.contains('visible')) renderHealthDetailContent();
}

function renderScoreToggle() {
  document.getElementById('scoreToggle').innerHTML = Object.keys(SCORE_PRESETS).map(n =>
    `<button class="score-toggle-btn ${n === scorePreset ? 'active' : ''}" onclick="applyScorePreset('${n}')">${n}</button>`
  ).join('');
}

// ===================== INIT =====================
function init() {
  setPlan(plan);
  Object.keys(healthMetrics).forEach(name => { defaultMetricOn[name] = healthMetrics[name].map(m => m[4]); });
  snapshotBaseData();
  renderScoreToggle();
  healthModels.forEach(h => { h.score = recalcHealthScore(h.name); });
  renderHealthRows();
  renderRangeSeg();
  renderHealthChart();
  renderChartLegend();
  setupChartScrub();
  updateOverallHealthScore();
  if (SCORE_PRESETS[scorePreset]) applyScorePreset(scorePreset);
}

// Default metric selection per category, captured on load; a category whose
// selection differs from it is marked as edited
const defaultMetricOn = {};

function isCategoryEdited(name) {
  const def = defaultMetricOn[name];
  return !!def && healthMetrics[name].some((m, i) => m[4] !== def[i]);
}

// Edited subtitle: how many of the category's scored metrics are selected
function editedSubtitle(name) {
  if (!isCategoryEdited(name)) return '';
  const scored = healthMetrics[name].filter(m => m[3] !== null);
  return `Custom · ${scored.filter(m => m[4]).length} of ${scored.length} metrics`;
}

function renderHealthRows() {
  const container = document.getElementById('healthRows');
  container.innerHTML = healthModels.map((hm, i) => {

        ${isCategoryEdited(hm.name) ? `<div class="health-sub">${editedSubtitle(hm.name)}</div>` : ''}

// Same metric selection as the metrics screen: a checkbox here or there changes the category score everywhere
const lpOpen = new Set();
const lpPos = v => Math.min(100, Math.max(0, v / 5 * 100));

function renderLatestPeriod() {
  const el = document.getElementById('latestPeriod');
  if (!el) return;
  const checkSVG = '<svg viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const chevron = '<svg width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  el.innerHTML = healthModels.map((hm, mi) => {
    const color = healthColors[mi], locked = catLocked(hm.name);
    const metrics = healthMetrics[hm.name];
    const active = metrics.filter(m => m[4] && m[3] !== null).map(m => m[3]);
    const lo = Math.min(...active), hi = Math.max(...active);
    const sub = isCategoryEdited(hm.name) ? editedSubtitle(hm.name) : `${metrics.filter(m => m[3] !== null).length} metrics`;
    // Range labels sit under the band's ends; a narrow band pushes them apart so they never collide
    let loX = lpPos(lo), hiX = lpPos(hi);
    if (hiX - loX < 14) { const mid = Math.min(Math.max((loX + hiX) / 2, 7), 93); loX = mid - 7; hiX = mid + 7; }
    // Labels near an edge align to it instead of centering on the band end
    const endStyle = (x, side) => x < 10 ? 'left:0;transform:none' : x > 90 ? 'right:0;left:auto;transform:none' : `left:${x}%`;
    const range = locked
      ? `<div class="lp-track lp-locked-track" onclick="event.stopPropagation(); showPaywall(event)"></div><div class="lp-ends"><span class="lo cap" style="left:0;transform:none">0.0</span><span class="hi cap" style="right:0;left:auto;transform:none">5.0</span></div>`
      : `<div class="lp-track"><span class="lp-band" style="left:${lpPos(lo)}%;width:${lpPos(hi) - lpPos(lo)}%;background:${color}"></span><span class="lp-dot" style="left:${lpPos(hm.score)}%;background:${color}"></span></div>
         <div class="lp-ends"><span class="lo" style="${endStyle(loX)}">${lo.toFixed(1)}</span><span class="hi" style="${endStyle(hiX)}">${hi.toFixed(1)}</span></div>`;
    const kids = metrics.map((m, i) => {
      const has = m[3] !== null;
      const score = !has ? '' : locked ? lockSlot() : `<span style="color:${healthLevelColor(m[3])}">${m[3].toFixed(1)}</span>`;
      return `<div class="lp-kid ${!has ? 'disabled' : m[4] ? '' : 'off'}">
        <div class="hmetric-check ${has && m[4] ? 'on' : ''}" ${has ? `onclick="toggleLpMetric('${hm.name}', ${i})"` : ''}>${checkSVG}</div>
        <div class="lp-kid-main"><div class="lp-kid-name">${m[0]}</div>
          ${!has ? '<div class="lp-nodata">No data available</div>' : `<div class="lp-track ${locked ? 'lp-locked-track' : ''}" ${locked ? 'onclick="showPaywall(event)"' : ''}>${locked ? '' : `<span class="lp-dot" style="left:${lpPos(m[3])}%;background:${color}"></span>`}</div>`}</div>
        <div class="lp-kid-score">${score}</div></div>`;
    }).join('');
    return `<div class="lp-cat ${lpOpen.has(mi) ? 'open' : ''}" id="lpCat${mi}">
      <div class="lp-head" onclick="toggleLpCategory(${mi})">
        <div class="health-row-text"><div class="health-name">${hm.name}</div><div class="health-sub">${sub}</div></div>
        <div class="health-score-val" style="color:${healthLevelColor(hm.score)}">${locked ? lockSlot() : hm.score.toFixed(1)}</div>
        <div class="health-chevron">${chevron}</div>
      </div>
      <div class="lp-range">${range}</div>
      <div class="lp-kids"><div class="lp-kids-inner">${kids}</div></div>
    </div>`;
  }).join('');
}

function toggleLpCategory(mi) {
  if (lpOpen.has(mi)) lpOpen.delete(mi); else lpOpen.add(mi);
  document.getElementById('lpCat' + mi).classList.toggle('open', lpOpen.has(mi));
}

function toggleLpMetric(cat, i) {
  const metrics = healthMetrics[cat];
  if (metrics[i][3] === null) return;
  // Keep at least one metric on, same rule as the metrics screen
  if (metrics[i][4] && metrics.filter(m => m[4] && m[3] !== null).length <= 1) return;
  metrics[i][4] = !metrics[i][4];
  const hm = healthModels.find(h => h.name === cat);
  hm.score = recalcHealthScore(cat);
  renderHealthRows();
  updateOverallHealthScore();
  renderHealthChart();
}

const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
let chartHoverIdx = null;

// Month i (0 = oldest, HISTORY_MONTHS = now) as { year, month }
function historyDate(i) {
  const total = HISTORY_END.year * 12 + HISTORY_END.month - (HISTORY_MONTHS - i);
  return { year: Math.floor(total / 12), month: total % 12 };
}

// Full monthly series for one category: real quarterly scores sampled monthly (linear between
// quarters), shifted toward the live score when a preset or custom selection changes it
function monthTs(i) {
  const d = historyDate(i);
  return i === HISTORY_MONTHS ? CAT_HISTORY['Cash Flow Health'].at(-1)[0] : Date.UTC(d.year, d.month, 28);
}
function seriesAt(pts, t) {
  if (t <= pts[0][0]) return pts[0][1];
  for (let k = 1; k < pts.length; k++) {
    if (t <= pts[k][0]) { const [t0, v0] = pts[k - 1], [t1, v1] = pts[k]; return v0 + (v1 - v0) * (t - t0) / (t1 - t0); }
  }
  return pts.at(-1)[1];
}
function historySeries(name, mi) {
  // Measured from web's last stored score so the line always ends exactly on the live score
  const shift = healthModels[mi].score - CAT_HISTORY[name].at(-1)[1];
  const out = [];
  for (let i = 0; i <= HISTORY_MONTHS; i++) {
    out.push(Math.max(0, Math.min(5, seriesAt(CAT_HISTORY[name], monthTs(i)) + shift * i / HISTORY_MONTHS)));
  }
  return out;
}

function chartWindow() {
  const start = HISTORY_MONTHS - chartRangeYears * 12;
  const names = Object.keys(CAT_HISTORY);
  return { start, names, series: names.map((n, mi) => historySeries(n, mi).slice(start)) };
}

function renderRangeSeg() {
  const seg = document.getElementById('rangeSeg');
  seg.innerHTML = RANGE_OPTIONS.map(y =>
    `<button class="range-seg-btn ${y === chartRangeYears ? 'active' : ''}" onclick="setChartRange(${y})">${y}Y</button>`
  ).join('');
}

function setChartRange(years) {

function chartGeometry(W, H) {
  const padL = 2, padR = 24, padT = 10, padB = 22;
  return { padL, padR, padT, padB, chartW: W - padL - padR, chartH: H - padT - padB };
}

function renderHealthChart() {
  const canvas = document.getElementById('healthChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 2;
  const rect = canvas.getBoundingClientRect();
  if (!rect.width) return;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const W = rect.width;
  const H = rect.height;
  const { padL, padT, chartW, chartH } = chartGeometry(W, H);
  const { start, series } = chartWindow();
  const n = series[0].length;
  const xAt = i => padL + (i / (n - 1)) * chartW;
  const yAt = v => padT + chartH - (v / 5) * chartH;

  ctx.clearRect(0, 0, W, H);

  // Grid + right-side Y labels
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  for (let v = 0; v <= 5; v++) {
    const y = yAt(v);
    ctx.strokeStyle = v === 0 ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    ctx.setLineDash(v === 0 ? [] : [3, 3]);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + chartW, y);
    ctx.stroke();
    if (v > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      ctx.fillText(v.toString(), padL + chartW + 8, y + 3.5);
    }
  }
  ctx.setLineDash([]);

  // X labels: months for 1Y, half-years for 2Y, years for 3Y+
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    const d = historyDate(start + i);
    let label = null;
    if (chartRangeYears === 1) { if (d.month % 3 === 0) label = MONTHS_SHORT[d.month]; }
    else if (chartRangeYears === 2) { if (d.month % 6 === 0) label = `${MONTHS_SHORT[d.month]} '${String(d.year).slice(2)}`; }
    else if (d.month === 0) label = d.year.toString();
    if (label) {
      const x = Math.min(Math.max(xAt(i), padL + 14), padL + chartW - 14);
      ctx.fillText(label, x, H - 5);
    }
  }

  // Lines
  series.forEach((data, mi) => {
    if (!lineShown(mi)) return;
    const color = healthColors[mi];
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.globalAlpha = chartHoverIdx === null ? 1 : 0.9;
    ctx.beginPath();
    data.forEach((val, i) => {
      if (i === 0) ctx.moveTo(xAt(i), yAt(val));
      else ctx.lineTo(xAt(i), yAt(val));
    });
    ctx.stroke();
    ctx.globalAlpha = 1;

  });

  // Scrub crosshair
  if (chartHoverIdx !== null) {
    const x = xAt(chartHoverIdx);
    ctx.strokeStyle = 'rgba(26,26,46,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + chartH);
    ctx.stroke();
    series.forEach((data, mi) => {
      if (!lineShown(mi)) return;
      const y = yAt(data[chartHoverIdx]);
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = healthColors[mi];
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    });
  }
}

function setupChartScrub() {
  const canvas = document.getElementById('healthChart');
  const scrub = document.getElementById('chartScrub');
  const wrap = document.getElementById('historyChart');

  const update = (clientX) => {
    const rect = canvas.getBoundingClientRect();
    const { padL, chartW } = chartGeometry(rect.width, rect.height);
    const { start, names, series } = chartWindow();
    const n = series[0].length;
    const rel = Math.min(Math.max((clientX - rect.left - padL) / chartW, 0), 1);
    chartHoverIdx = Math.round(rel * (n - 1));
    renderHealthChart();

    const d = historyDate(start + chartHoverIdx);
    const rows = names.map((name, mi) => lineShown(mi)
      ? `<div class="chart-scrub-row"><span class="chart-scrub-dot" style="background:${healthColors[mi]}"></span><span>${name}</span><b>${series[mi][chartHoverIdx].toFixed(1)}</b></div>`
      : '').join('');
    scrub.innerHTML = `<div class="chart-scrub-date">${MONTHS_SHORT[d.month]} ${d.year}</div>${rows}`;
    scrub.classList.add('visible');

    // Place the card on the side away from the finger
    const x = (canvas.offsetLeft) + padL + (chartHoverIdx / (n - 1)) * chartW;
    const w = scrub.offsetWidth;
    const left = x > wrap.clientWidth / 2 ? x - w - 12 : x + 12;
    scrub.style.left = Math.max(8, Math.min(left, wrap.clientWidth - w - 8)) + 'px';
  };
  const clear = () => {
    chartHoverIdx = null;
    scrub.classList.remove('visible');
    renderHealthChart();
  };

  // Mobile behavior: no hover. Tap shows the readout and it stays; drag while pressed scrubs;
  // tapping anywhere outside the chart dismisses it.
  let dragging = false;
  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    update(e.clientX);
  });
  canvas.addEventListener('pointermove', e => { if (dragging) update(e.clientX); });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });
  document.addEventListener('pointerdown', e => {
    if (chartHoverIdx !== null && !wrap.contains(e.target)) clear();
  });
}

function renderChartLegend() {
  const container = document.getElementById('chartLegend');
  container.innerHTML = '';
  Object.keys(CAT_HISTORY).forEach((name, i) => {

      chartLineVisible[i] = !chartLineVisible[i];
      item.classList.toggle('off', !chartLineVisible[i]);
      renderHealthChart();
    };
    container.appendChild(item);
  });
}

function recalcHealthScore(categoryName) {
  const metrics = healthMetrics[categoryName] || [];
  const active = metrics.filter(m => m[4] && m[3] !== null);
  if (active.length === 0) return 0;
  const sum = active.reduce((s, m) => s + m[3], 0);
  return sum / active.length;
}

function toggleHealthMetric(categoryName, metricIdx) {
  const metrics = healthMetrics[categoryName];
  if (metrics[metricIdx][3] === null) return; // no-data metrics are disabled
  const onCount = metrics.filter(m => m[4] && m[3] !== null).length;
  if (onCount <= 1 && metrics[metricIdx][4]) return;
  metrics[metricIdx][4] = !metrics[metricIdx][4];
  const isOn = metrics[metricIdx][4];

  const hmIdx = healthModels.findIndex(h => h.name === categoryName);
  healthModels[hmIdx].score = recalcHealthScore(categoryName);

  // Update row visually without full re-render
  const rows = document.querySelectorAll('.hmetric-row');
  const row = rows[metricIdx];
  if (row) {
    row.classList.toggle('off', !isOn);
    const check = row.querySelector('.hmetric-check');
    check.classList.toggle('on', isOn);
  }

  // Update active chip score
  const activeChip = document.querySelector(`[data-chip="${hmIdx}"]`);
  if (activeChip) {
    const score = healthModels[hmIdx].score;
    const color = healthLevelColor(score);
    if (!catLocked(healthModels[hmIdx].name)) activeChip.querySelector('.hdchip-score').textContent = score.toFixed(1);
    activeChip.querySelector('.hdchip-score').style.color = color;
  }

  renderHealthRows();
  updateOverallHealthScore();
  renderHealthChart();
}

const HEALTH_LEVELS = ['Weak', 'Fair', 'Good', 'Great', 'Excellent'];
const HEALTH_LEVEL_COLORS = ['#E0574C', '#EC9A4C', '#D4B03A', '#7CC860', '#4FA83D'];

// Color for any health score, same 5 levels as the summary scale (score rounded to the nearest level)
function healthLevelColor(score) {
  return HEALTH_LEVEL_COLORS[Math.min(5, Math.max(1, Math.round(score))) - 1];
}

// Speedometer geometry: semicircle, center (150, 132); f = 0 (left) .. 1 (right)
// Continuous arc: thin solid outer stroke + soft inner band, filled up to the needle
const GAUGE = { cx: 150, cy: 132, rOuter: 92, outerW: 4, rInner: 85.5, innerW: 9, rLabel: 110, needle: 64 };

function gaugePoint(f, r) {
  const a = Math.PI * (1 - f);
  return [GAUGE.cx + r * Math.cos(a), GAUGE.cy - r * Math.sin(a)];
}

function gaugeArc(f1, f2, r) {
  const [x1, y1] = gaugePoint(f1, r), [x2, y2] = gaugePoint(f2, r);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

function buildHealthGauge() {
  const svg = document.getElementById('healthGauge');
  const x0 = GAUGE.cx - GAUGE.rOuter, x1 = GAUGE.cx + GAUGE.rOuter;
  // Horizontal gradient = color along the arc (x is monotonic on a semicircle)
  const stops = HEALTH_LEVEL_COLORS.map((c, k) => `<stop offset="${(k + 0.5) / 5}" stop-color="${c}"/>`).join('');
  let html = `<defs><linearGradient id="gaugeGrad" gradientUnits="userSpaceOnUse" x1="${x0}" y1="0" x2="${x1}" y2="0">${stops}</linearGradient></defs>`;
  // Track
  const rTrack = (GAUGE.rOuter + GAUGE.outerW / 2 + GAUGE.rInner - GAUGE.innerW / 2) / 2;
  const wTrack = (GAUGE.rOuter + GAUGE.outerW / 2) - (GAUGE.rInner - GAUGE.innerW / 2);
  html += `<path d="${gaugeArc(0, 1, rTrack)}" stroke="#EEEEF1" stroke-width="${wTrack}" fill="none"/>`;
  // Progress (inner soft band + outer solid stroke), d set in updateOverallHealthScore()
  html += `<path id="gaugeInner" stroke="url(#gaugeGrad)" stroke-opacity="0.2" stroke-width="${GAUGE.innerW}" fill="none"/>`;
  html += `<path id="gaugeOuter" stroke="url(#gaugeGrad)" stroke-width="${GAUGE.outerW}" fill="none"/>`;
  // Labels at each level's center
  HEALTH_LEVELS.forEach((label, k) => {
    const [lx, ly] = gaugePoint((k + 0.5) / 5, GAUGE.rLabel);
    const anchor = Math.abs(lx - GAUGE.cx) < 12 ? 'middle' : lx < GAUGE.cx ? 'end' : 'start';
    html += `<text class="gauge-label" id="gaugeLabel${k}" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}">${label}</text>`;
  });
  // Needle points right (f = 1) at rest; rotated from the level in updateOverallHealthScore()
  html += `<g class="gauge-needle" id="gaugeNeedle" style="transform-origin:${GAUGE.cx}px ${GAUGE.cy}px">
    <line x1="${GAUGE.cx}" y1="${GAUGE.cy}" x2="${GAUGE.cx + GAUGE.needle}" y2="${GAUGE.cy}" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="${GAUGE.cx}" cy="${GAUGE.cy}" r="4.5" fill="#1A1A2E"/>`;
  svg.innerHTML = html;
}

function updateOverallHealthScore() {
  const avg = healthModels.reduce((s, h) => s + h.score, 0) / healthModels.length;
  const score = Math.round(avg * 10) / 10;
  const level = Math.min(5, Math.max(1, Math.round(score)));
  const color = HEALTH_LEVEL_COLORS[level - 1];

  if (!document.getElementById('gaugeNeedle')) buildHealthGauge();

  // Same as prod: the needle snaps to the center of the level's segment (10/30/50/70/90%);
  // the exact score is shown under the arc
  const f = (level - 0.5) / 5;
  document.getElementById('gaugeNeedle').style.transform = `rotate(${(-180 * (1 - f)).toFixed(1)}deg)`;
  // Fill runs to the needle; Excellent fills the whole arc
  const fill = level === 5 ? 1 : f;
  document.getElementById('gaugeOuter').setAttribute('d', gaugeArc(0, fill, GAUGE.rOuter));
  document.getElementById('gaugeInner').setAttribute('d', gaugeArc(0, fill, GAUGE.rInner));
  HEALTH_LEVELS.forEach((_, k) => {
    const el = document.getElementById('gaugeLabel' + k);
    el.classList.toggle('active', k === level - 1);
    el.style.fill = k === level - 1 ? color : '';
  });

  document.getElementById('healthScore').textContent = score.toFixed(1);
  const tag = document.getElementById('healthTag');
  tag.textContent = HEALTH_LEVELS[level - 1];
  tag.style.color = color;
}

const expandedMetrics = new Set();

function toggleMetricChart(ri) {
  const wrap = document.getElementById('metricChart' + ri);
  if (!wrap) return;
  const row = wrap.closest('.hmetric-row');
  const chevron = row.querySelector('.hmetric-expand');

  if (expandedMetrics.has(ri)) {
    expandedMetrics.delete(ri);
    wrap.classList.remove('open');
    chevron.classList.remove('open');
  } else {
    expandedMetrics.add(ri);
    wrap.classList.add('open');
    chevron.classList.add('open');
    setTimeout(() => { drawMetricChart(ri); setupMetricScrub(ri); }, 100);
  }
}

function scoreToColor(score) {
  return healthLevelColor(Math.max(0, Math.min(5, score)));
}

// Real quarterly score history for one metric (last 2 years), shifted so it ends at the live score
const METRIC_HISTORY_YEARS = 2;
function metricHistory(cat, ri) {
  const row = healthMetrics[cat][ri], d = AAPL_DATA[row[5]];
  const end = d.hist.at(-1)[0], from = end - METRIC_HISTORY_YEARS * 365.25 * 864e5 - 20 * 864e5;
  const pts = d.hist.filter(p => p[0] >= from);
  const base = baseMetrics[cat] && baseMetrics[cat][ri] ? baseMetrics[cat][ri].score : row[3];
  const shift = row[3] - base;
  return pts.map((p, i) => ({ t: p[0], s: Math.max(0, Math.min(5, p[1] + shift * i / (pts.length - 1))) }));
}
const pointDate = t => { const d = new Date(t + 12 * 36e5); return { year: d.getUTCFullYear(), month: d.getUTCMonth() }; };

// Continuous score color: score 0-5 maps onto these stops (0 and 1 = Weak, 5 = Excellent),
// blended linearly in RGB. The sparkline gradient and its dots both use it, so a dot always
// matches the line at that point.
const SCORE_GRADIENT_STOPS = [[0, HEALTH_LEVEL_COLORS[0]], ...HEALTH_LEVEL_COLORS.map((c, k) => [(k + 1) / 5, c])];

function continuousScoreColor(score) {
  const t = Math.min(1, Math.max(0, score / 5));
  let k = 0;
  while (k < SCORE_GRADIENT_STOPS.length - 2 && t > SCORE_GRADIENT_STOPS[k + 1][0]) k++;
  const [t0, c0] = SCORE_GRADIENT_STOPS[k], [t1, c1] = SCORE_GRADIENT_STOPS[k + 1];
  const f = t1 === t0 ? 0 : (t - t0) / (t1 - t0);
  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const a = hex(c0), b = hex(c1);
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * f)).join(',')})`;
}

// Sparkline: last 2 years of quarterly score points; tap a point for date / score / value (+ percentile today)
const metricHoverIdx = {};

// The metric's own value on a score date: nearest earlier point of its trailing (or daily/quarterly) series
function metricValueAt(slug, t) {
  const d = AAPL_DATA[slug], ser = d.daily || d.ttm || d.fq || d.fy;
  if (!ser) return null;
  let best = null;
  for (const p of ser) if (p[0] <= t + 20 * 864e5) best = p;
  return best ? best[1] : null;
}

function metricChartGeometry(W, H) {
  const padL = 2, padR = 20, padT = 8, padB = 18;
  return { padL, padR, padT, padB, chartW: W - padL - padR, chartH: H - padT - padB };
}

function drawMetricChart(ri) {
  const canvas = document.getElementById('metricCanvas' + ri);
  if (!canvas) return;
  const hm = healthModels[activeHealthModel];
  const metric = healthMetrics[hm.name][ri];
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 2;
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0) return;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const W = rect.width, H = rect.height;
  const { padL, padT, chartW, chartH } = metricChartGeometry(W, H);
  const hist = metricHistory(hm.name, ri), history = hist.map(p => p.s);
  const n = history.length;
  const xAt = i => padL + (i / (n - 1)) * chartW;
  const yAt = v => padT + chartH - (v / 5) * chartH;
  ctx.clearRect(0, 0, W, H);

  // Grid + right-side Y labels (same style as Financial Health History)
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  for (let v = 0; v <= 5; v++) {
    const y = yAt(v);
    ctx.strokeStyle = v === 0 ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    ctx.setLineDash(v === 0 ? [] : [3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + chartW, y); ctx.stroke();
    if (v > 0 && v % 1 === 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      ctx.fillText(v.toString(), padL + chartW + 7, y + 3.5);
    }
  }
  ctx.setLineDash([]);

  // X labels: every other quarter
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  for (let i = n - 1; i >= 0; i -= 2) {
    const d = pointDate(hist[i].t);
    ctx.fillText(`${MONTHS_SHORT[d.month]} '${String(d.year).slice(2)}`, Math.min(Math.max(xAt(i), padL + 16), padL + chartW - 16), H - 4);
  }

  // Line: one smooth curve, color blends continuously with the score (vertical gradient on the 0-5 axis)
  const grad = ctx.createLinearGradient(0, yAt(0), 0, yAt(5));
  SCORE_GRADIENT_STOPS.forEach(([t, c]) => grad.addColorStop(t, c));
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.25;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(xAt(0), yAt(history[0]));
  for (let i = 0; i < n - 1; i++) {
    // Midpoint quadratic smoothing
    const xm = (xAt(i) + xAt(i + 1)) / 2, ym = (yAt(history[i]) + yAt(history[i + 1])) / 2;
    ctx.quadraticCurveTo(xAt(i), yAt(history[i]), xm, ym);
  }
  ctx.lineTo(xAt(n - 1), yAt(history[n - 1]));
  ctx.stroke();

  // Quarterly dots, each the color of the line at that point
  history.forEach((v, i) => {
    ctx.fillStyle = continuousScoreColor(v);
    ctx.beginPath(); ctx.arc(xAt(i), yAt(v), 2.75, 0, Math.PI * 2); ctx.fill();
  });

  // Tapped point
  const hi = metricHoverIdx[ri];
  if (hi !== undefined && hi !== null) {
    const x = xAt(hi);
    ctx.strokeStyle = 'rgba(26,26,46,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + chartH); ctx.stroke();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(x, yAt(history[hi]), 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = continuousScoreColor(history[hi]);
    ctx.beginPath(); ctx.arc(x, yAt(history[hi]), 3.5, 0, Math.PI * 2); ctx.fill();
  }
}

function setupMetricScrub(ri) {
  const canvas = document.getElementById('metricCanvas' + ri);
  const wrap = document.getElementById('metricChart' + ri);
  if (!canvas || canvas.dataset.scrub) return;
  canvas.dataset.scrub = '1';
  const scrub = document.createElement('div');
  scrub.className = 'chart-scrub';
  wrap.appendChild(scrub);

  const update = clientX => {
    const hm = healthModels[activeHealthModel];
    const metric = healthMetrics[hm.name][ri];
    const rect = canvas.getBoundingClientRect();
    const { padL, chartW } = metricChartGeometry(rect.width, rect.height);
    const hist = metricHistory(hm.name, ri), history = hist.map(p => p.s);
    const n = history.length;
    const idx = Math.round(Math.min(Math.max((clientX - rect.left - padL) / chartW, 0), 1) * (n - 1));
    metricHoverIdx[ri] = idx;
    drawMetricChart(ri);

    const d = pointDate(hist[idx].t), last = idx === n - 1;
    const pv = parseVal(metric[1]), v = last ? metric[1] : metricValueAt(metric[5], hist[idx].t);
    const row = (label, val) => `<div class="chart-scrub-row"><span style="flex:1;color:var(--text-secondary)">${label}</span><b>${val}</b></div>`;
    scrub.innerHTML = `<div class="chart-scrub-date">${MONTHS_SHORT[d.month]} ${d.year}</div>`
      + row('Score', history[idx].toFixed(1))
      + (v !== null && pv ? row('Value', last ? v : fmtV(v, pv)) : '')
      + (last ? row('Percentile', metric[2].toFixed(1) + '%') : '');
    scrub.classList.add('visible');

    const x = canvas.offsetLeft + padL + (idx / (n - 1)) * chartW;
    const w = scrub.offsetWidth;
    const left = x > wrap.clientWidth / 2 ? x - w - 12 : x + 12;
    scrub.style.left = Math.max(4, Math.min(left, wrap.clientWidth - w - 4)) + 'px';
  };
  const clear = () => {
    metricHoverIdx[ri] = null;
    scrub.classList.remove('visible');
    drawMetricChart(ri);
  };

  // Same as the history chart: tap shows the readout and it stays; drag scrubs; tap outside dismisses
  let dragging = false;
  canvas.addEventListener('pointerdown', e => { dragging = true; canvas.setPointerCapture(e.pointerId); update(e.clientX); });
  canvas.addEventListener('pointermove', e => { if (dragging) update(e.clientX); });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });
  document.addEventListener('pointerdown', e => {
    if (metricHoverIdx[ri] !== null && metricHoverIdx[ri] !== undefined && !wrap.contains(e.target)) clear();
  });
}

function renderHealthDetailContent() {
  const container = document.getElementById('healthDetailContent');

  // Save chips scroll position before re-render
  const oldChipsWrap = container.querySelector('.health-detail-chips');
  const savedScroll = oldChipsWrap ? oldChipsWrap.scrollLeft : 0;

  // Chips
  let chipsHTML = '<div class="health-detail-chips">';
  healthModels.forEach((hm, i) => {
    const color = healthLevelColor(hm.score);
    const active = i === activeHealthModel;
    chipsHTML += `
      <div class="health-detail-chip ${active ? 'active' : ''}" data-chip="${i}" onclick="activeHealthModel=${i}; renderHealthDetailContent()">
        <div class="hdchip-top">
          <div class="hdchip-score" style="color:${color}">${catLocked(hm.name) ? lockSlot() : hm.score.toFixed(1)}</div>
        </div>
        <div class="hdchip-name">${hm.name}</div>
      </div>`;
  });
  chipsHTML += '</div>';

  // Metrics table
  const hm = healthModels[activeHealthModel];
  const metrics = healthMetrics[hm.name] || [];
  const checkSVG = '<svg viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const chevronDownSVG = '<svg width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  expandedMetrics.clear();

  let tableHTML = `
    <div class="detail-section">
      <div class="detail-table">`;

  metrics.forEach((row, ri) => {
    const isOn = row[4];
    const pctVal = row[2] !== null ? row[2].toFixed(1) + '%' : '-';
    const scoreVal = row[3] !== null ? row[3].toFixed(1) : '-';
    const scoreColor = row[3] !== null ? healthLevelColor(row[3]) : 'var(--text-tertiary)';
    const hasScore = row[3] !== null;
    tableHTML += `
      <div class="hmetric-row ${!hasScore ? 'disabled' : isOn ? '' : 'off'}">
        <div class="hmetric-main" ${hasScore ? `onclick="toggleMetricChart(${ri})"` : ''}>
          <div class="hmetric-check ${hasScore && isOn ? 'on' : ''}" ${hasScore ? `onclick="event.stopPropagation(); toggleHealthMetric('${hm.name}', ${ri})"` : ''}>${checkSVG}</div>
          <div class="hmetric-info">
            <div class="hmetric-name">${row[0]}</div>
            <div class="hmetric-sub">${hasScore ? `Value: <b>${catLocked(hm.name) ? lockNum() : row[1]}</b> · Percentile: <b>${catLocked(hm.name) ? lockNum() : pctVal}</b>` : 'No data available'}</div>
          </div>
          <div class="hmetric-score" style="color:${scoreColor}">${hasScore && catLocked(hm.name) ? lockSlot() : scoreVal}</div>
          ${hasScore ? `<div class="hmetric-expand">${chevronDownSVG}</div>` : '<div style="width:24px;flex-shrink:0"></div>'}
        </div>
        ${hasScore ? `<div class="hmetric-chart-wrap" id="metricChart${ri}"><div class="mchart-box ${catLocked(hm.name) ? 'locked' : ''}"><canvas id="metricCanvas${ri}"></canvas>${catLocked(hm.name) ? `<div class="mchart-lock" onclick="event.stopPropagation(); showPaywall(event)">${LOCK_SVG}</div>` : ''}</div>${metricPreview(hm.name, ri)}</div>` : ''}
      </div>`;
  });

  tableHTML += '</div></div><div class="bottom-pad"></div>';

  container.innerHTML = chipsHTML + tableHTML;

  const newChipsWrap = container.querySelector('.health-detail-chips');
  if (healthDetailScrollOnOpen) {
    healthDetailScrollOnOpen = false;
    requestAnimationFrame(() => {
      const activeChip = container.querySelector(`[data-chip="${activeHealthModel}"]`);
      if (newChipsWrap && activeChip) {
        const scrollLeft = activeChip.offsetLeft - newChipsWrap.offsetWidth / 2 + activeChip.offsetWidth / 2;
        newChipsWrap.scrollTo({ left: scrollLeft, behavior: 'smooth' });
      }
    });
  } else if (newChipsWrap) {
    newChipsWrap.scrollLeft = savedScroll;
  }
}

const MP_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
let mpCat = null, mpIdx = null, mpPeriod = 'annual', mpScope = 'Sector';

// Parse a display value ("31.5%", "1.8x", "466.8 B", "1.17") into number + format
function parseVal(str) {
  const m = String(str).replace('$', '').match(/^(-?[\d,]*\.?\d+)\s*(.*)$/);
  if (!m) return null;
  return { n: parseFloat(m[1].replace(/,/g, '')), suf: m[2] ? (m[2] === 'B' ? ' B' : m[2]) : '', dec: (m[1].split('.')[1] || '').length || 1 };
}
const fmtV = (n, pv) => n.toLocaleString('en-US', { minimumFractionDigits: pv.dec, maximumFractionDigits: pv.dec }) + pv.suf;
// Web strings with mixed magnitudes ("40.283 M", "1.4 B", "0.073 K") as one comparable number
function webNum(str) {
  const m = String(str || '').replace(/[$,]/g, '').match(/^(-?\d*\.?\d+)\s*([KMBT])?/);
  if (!m) return null;
  return parseFloat(m[1]) * ({ K: 1e3, M: 1e6, B: 1e9, T: 1e12 }[m[2]] || 1);
}

function mpSeries(pts, kind) {
  if (!pts || pts.length < 2) return null;
  return pts.map(([t, v]) => {
    const d = new Date(t + 12 * 36e5), y = d.getUTCFullYear(), mo = MP_MONTHS[d.getUTCMonth()];
    return kind === 'fy' ? { label: 'FY ' + y, short: String(y), v } : { label: mo + ' ' + y, short: mo + " '" + String(y).slice(2), v };
  });
}

// Full page model for one metric
function metricModel(cat, ri) {
  const row = healthMetrics[cat][ri], d = AAPL_DATA[row[5]];
  const pv = parseVal(row[1]), rel = baseMetrics[cat] && baseMetrics[cat][ri] ? baseMetrics[cat][ri].rel : 'direct';
  const model = { name: row[0], cat, row, pv, pct: row[2], score: row[3], d, inverse: rel === 'inverse', snapshot: d.snapshot };

  model.periods = [['annual', 'Annual', mpSeries(d.fy, 'fy')], ['quarterly', 'Quarterly', mpSeries(d.fq)], ['ttm', 'TTM', mpSeries(d.ttm)], ['daily', 'Daily', mpSeries(d.daily)]]
    .filter(p => p[2]);
  if (!model.periods.length) model.snapshot = true;
  const annual = model.periods.find(p => p[0] === 'annual');
  if (annual) {
    const five = annual[2].slice(-5), vals = five.map(p => p.v);
    model.avg = { n: five.length, v: vals.reduce((a, b) => a + b, 0) / five.length, from: five[0].short, to: five.at(-1).short };
    const srt = [...vals].sort((a, b) => a - b);
    model.median = srt.length % 2 ? srt[(srt.length - 1) / 2] : (srt[srt.length / 2 - 1] + srt[srt.length / 2]) / 2;
    model.peak = five.reduce((a, b) => (b.v > a.v ? b : a)); model.low = five.reduce((a, b) => (b.v < a.v ? b : a));
    model.yoy = five.slice(1).map((p, i) => ({ y: p.short, v: p.v, c: five[i].v ? (p.v - five[i].v) / Math.abs(five[i].v) * 100 : 0 }));
  }

  // Web's peer set; best first (lowest first when lower is better), companies without a value last
  const peers = d.peers.map(p => ({ ...p, n: webNum(p.v), me: p.tk === 'AAPL' }));
  const byBest = (a, b) => (a.n === null) - (b.n === null) || (model.inverse ? a.n - b.n : b.n - a.n);
  model.peers = peers.sort(byBest);
  const ranked = model.peers.filter(p => !p.sector && p.n !== null);
  model.rank = ranked.findIndex(p => p.me) + 1;
  model.ranked = ranked.length;
  const others = ranked.filter(p => !p.me).map(p => p.n).sort((a, b) => a - b);
  model.peerMedian = others.length ? (others.length % 2 ? others[(others.length - 1) / 2] : (others[others.length / 2 - 1] + others[others.length / 2]) / 2) : null;
  model.sector = d.sector;
  return model;
}

// Option D preview in the expanded row: average > sector median > peer rank
function metricPreview(cat, ri) {
  const row = healthMetrics[cat][ri];
  if (row[3] === null) return '';
  const m = metricModel(cat, ri), f = n => fmtV(n, m.pv);
  const first = m.avg ? [`${m.avg.n}y average`, f(m.avg.v)] : ['Peer median', m.peerMedian !== null ? f(m.peerMedian) : '-'];
  const sec = m.sector.Sector || {};
  const locked = catLocked(cat), lk = v => locked ? lockNum() : v;
  return `<div class="mfacts">
    <div class="mfact"><div class="k">${first[0]}</div><div class="v">${lk(first[1])}</div></div>
    <div class="mfact"><div class="k">Sector median</div><div class="v">${lk(sec.median || '-')}</div></div>
    <div class="mfact"><div class="k">Peer rank</div><div class="v">${lk(m.rank ? `#${m.rank} of ${m.ranked}` : '-')}</div></div></div>
    <button class="mcta" onclick="event.stopPropagation(); ${locked ? 'showPaywall(event)' : `openMetricPage('${cat}', ${ri})`}"><span class="mcta-label">Full analysis${locked ? PRO_SHIELD : ''}</span> <svg width="7" height="12" viewBox="0 0 8 14" fill="none"><path d="M1 1L7 7L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
}

function mpChart(points, pv) {
  const W = 358, H = 170, pl = 2, pr = 44, pt = 10, pb = 22, cw = W - pl - pr, ch = H - pt - pb;
  const vals = points.map(p => p.v); let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const pad = (hi - lo) * 0.08 || 1; hi += pad; if (lo < 0) lo -= pad;
  const y = v => pt + ch - (v - lo) / (hi - lo) * ch, n = points.length, slot = cw / n, bw = Math.max(2, Math.min(18, slot * 0.62));
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = lo + (hi - lo) * k / 3; g += `<line x1="${pl}" x2="${pl + cw}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(0,0,0,.06)" stroke-dasharray="3 3"/><text x="${pl + cw + 6}" y="${y(v) + 3.5}" font-size="10" fill="#8A8F98">${fmtV(v, { ...pv, dec: Math.abs(hi - lo) > 20 ? 0 : 1 })}</text>`; }
  let bars = '';
  points.forEach((p, i) => { const x = pl + slot * (i + 0.5) - bw / 2, y0 = y(0), y1 = y(p.v); bars += `<rect x="${x.toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}" rx="2" fill="${i === n - 1 ? '#3D63D1' : '#9DB4EA'}"/>`; });
  const stepL = Math.ceil(n / 5);
  let xl = ''; points.forEach((p, i) => { if ((n - 1 - i) % stepL === 0) xl += `<text x="${(pl + slot * (i + 0.5)).toFixed(1)}" y="${H - 5}" font-size="10" fill="#8A8F98" text-anchor="middle">${p.short}</text>`; });
  return `<div class="mp-chart" id="mpChart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}<line x1="${pl}" x2="${pl + cw}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(0,0,0,.18)"/>${bars}${xl}<line id="mpCross" x1="0" x2="0" y1="${pt}" y2="${pt + ch}" stroke="rgba(26,26,46,.35)" visibility="hidden"/></svg><div class="mp-tip" id="mpTip"></div></div>`;
}
function mpWireChart(points, pv) {
  const el = document.getElementById('mpChart'); if (!el) return;
  const svg = el.querySelector('svg'), tip = el.querySelector('#mpTip'), cross = el.querySelector('#mpCross'), W = 358, pl = 2, cw = W - pl - 44;
  const show = cx => {
    const r = svg.getBoundingClientRect(), x = (cx - r.left) / r.width * W;
    const i = Math.max(0, Math.min(points.length - 1, Math.floor((x - pl) / (cw / points.length)))), px = pl + cw / points.length * (i + 0.5);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${fmtV(points[i].v, pv)}</b>${points[i].label}`; tip.style.display = 'block';
    tip.style.left = Math.min(Math.max(px / W * r.width - tip.offsetWidth / 2, 0), r.width - tip.offsetWidth) + 'px';
  };
  svg.addEventListener('pointerdown', e => { show(e.clientX); svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => { if (e.buttons) show(e.clientX); });
}

function renderMetricPage(resetScroll = true) {
  const m = metricModel(mpCat, mpIdx), pv = m.pv, f = n => fmtV(n, pv);
  const lv = healthLevelColor(m.score), level = HEALTH_LEVELS[Math.min(5, Math.max(1, Math.round(m.score))) - 1];
  const screen = document.getElementById('metricPage'), keep = screen.scrollTop;
  document.getElementById('mpTitle').textContent = m.name;
  let h = `<div class="mp-hero"><div class="mp-eyebrow">${m.cat} · Apple</div><h1>${m.name}</h1><p class="mp-desc">${m.d.desc}</p>
    <div class="mp-kpis"><div class="mp-kpi"><div class="k">Value</div><div class="v">${m.row[1]}</div></div>
      <div class="mp-kpi"><div class="k">Percentile</div><div class="v">${m.pct.toFixed(1)}%</div></div>
      <div class="mp-kpi"><div class="k">Score</div><div class="v" style="color:${lv}">${m.score.toFixed(1)}<small>${level}</small></div></div></div>
    ${m.snapshot ? '<p class="mp-note">A point-in-time figure with no history; see how it compares with peers below.</p>' : ''}</div>`;

  let pts = null;
  if (!m.snapshot) {
    if (!m.periods.some(p => p[0] === mpPeriod)) mpPeriod = m.periods[0][0];
    pts = m.periods.find(p => p[0] === mpPeriod)[2];
    h += `<div class="mp-sec"><h2>History</h2>${m.periods.length > 1 ? `<div class="mp-seg">${m.periods.map(o => `<button class="${o[0] === mpPeriod ? 'on' : ''}" onclick="mpPeriod='${o[0]}';renderMetricPage(false)">${o[1]}</button>`).join('')}</div>` : ''}
      ${mpChart(pts, pv)}`;
    if (m.avg) h += `<div class="mp-list">
        <div class="mp-li"><span class="l">${m.avg.n}-year average<small>FY ${m.avg.from}-${m.avg.to}</small></span><span class="r">${f(m.avg.v)}</span></div>
        <div class="mp-li"><span class="l">${m.avg.n}-year median</span><span class="r">${f(m.median)}</span></div>
        <div class="mp-li"><span class="l">Peak<small>${m.peak.label}</small></span><span class="r">${f(m.peak.v)}</span></div>
        <div class="mp-li"><span class="l">Low<small>${m.low.label}</small></span><span class="r">${f(m.low.v)}</span></div></div>
      <div class="mp-chips">${m.yoy.map(c => `<span class="mp-chip">${c.y} <b>${f(c.v)}</b> <span class="${c.c < 0 ? 'mp-down' : 'mp-up'}">${c.c >= 0 ? '+' : ''}${c.c.toFixed(1)}%</span></span>`).join('')}</div>`;
    h += `</div>`;
  }

  const vals = m.peers.filter(p => p.n !== null).map(p => p.n);
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), span = hi - lo || 1, zx = (0 - lo) / span * 100;
  h += `<div class="mp-sec"><h2>Compared with peers</h2><div class="mp-sub">Similar companies by industry, size and growth.</div>
    ${m.rank ? `<div class="mp-rank"><b>#${m.rank}</b> of ${m.ranked} companies</div>` : ''}
    <div class="mp-list">${m.peers.map(p => { const a = p.n === null ? 0 : (Math.min(0, p.n) - lo) / span * 100, w = p.n === null ? 0 : Math.abs(p.n) / span * 100;
      return `<div class="mp-peer ${p.me ? 'me' : ''} ${p.sector ? 'avg' : ''}"><div class="n">${p.me ? 'Apple' : p.sector ? 'IT sector' : p.name}${p.sector ? '<small>Sector</small>' : `<small>${p.tk}</small>`}</div><div class="track">${p.n === null ? '' : `${lo < 0 ? `<span class="zero" style="left:${zx}%"></span>` : ''}<i style="left:${a}%;width:${Math.max(w, 1)}%"></i>`}</div><div class="val">${p.n === null ? '-' : p.v}</div></div>`; }).join('')}</div></div>`;

  const scopes = ['Sector', 'Industry'].filter(k => m.sector[k]);
  if (scopes.length) {
    if (!m.sector[mpScope]) mpScope = scopes[0];
    const sc = m.sector[mpScope], ord = n => { const r = Math.round(n), t = ['th', 'st', 'nd', 'rd'], k = r % 100; return r + (t[(k - 20) % 10] || t[k] || t[0]); };
    // Web leaves out values far outside the typical range; place them at the matching end
    const above = sc.p === null && webNum(m.row[1]) > webNum(sc.max);
    const big = sc.p !== null ? `${ord(sc.p)}<small>percentile</small>` : `${above ? 'Above' : 'Below'} range<small>outside the typical range</small>`;
    const mk = sc.p !== null ? sc.p : above ? 100 : 0;
    h += `<div class="mp-sec"><h2>Sector benchmark</h2><div class="mp-sub">${sc.label} · Developed markets</div>
      <div class="mp-seg">${scopes.map(o => `<button class="${o === mpScope ? 'on' : ''}" onclick="mpScope='${o}';renderMetricPage(false)">${o}</button>`).join('')}</div>
      <div class="mp-big">${big}</div>
      <div class="mp-ptrack"><span class="mk" style="left:${mk}%"></span></div><div class="mp-pscale"><span>Lowest</span><span>Highest</span></div>
      <div class="mp-list">${[['Companies included', sc.count], ['Median', sc.median], ['Mean', sc.mean], ['Lowest', sc.min], ['Highest', sc.max], ['Standard deviation', sc.sd]]
        .filter(r => r[1]).map(r => `<div class="mp-li"><span class="l">${r[0]}</span><span class="r">${r[1]}</span></div>`).join('')}</div></div>`;
  }

  if (m.d.formula.length || m.d.prose.length || m.d.calc.length) {
    const calcRows = m.d.calc.map(l => { const k = l.match(/^(.*?)\s*\[\s*(.*?)\s*\]\s*(.*)$/); return k ? [k[1] + (k[3] ? ' ' + k[3].replace(/\[\s*(.*?)\s*\]/, '$1') : ''), k[2]] : [l, '']; });
    h += `<div class="mp-sec"><h2>How it's calculated</h2>${m.d.prose.map(l => `<p class="mp-p">${l}</p>`).join('')}
      ${m.d.formula.length ? `<div class="mp-formula"><div class="cap">Formula</div>${m.d.formula.join('<br>')}</div>` : ''}
      ${calcRows.length ? `<div class="mp-list mp-calc">${calcRows.map(r => `<div class="mp-li"><span class="l">${r[0]}</span><span class="r">${r[1]}</span></div>`).join('')}</div>` : ''}</div>`;
  }
  h += `<div class="mp-foot">Source: InvestingPro, Apple Inc (NASDAQ: AAPL), as of Oct 12, 2026.</div>`;
  document.getElementById('metricPageContent').innerHTML = h;
  if (pts) mpWireChart(pts, pv);
  screen.scrollTop = resetScroll ? 0 : keep;
}

function openMetricPage(cat, ri) {
  mpCat = cat; mpIdx = ri; mpPeriod = 'annual'; mpScope = 'Sector';
  renderMetricPage();
  document.getElementById('mpHeader').classList.remove('scrolled');
  document.getElementById('healthDetail').classList.add('pushed');
  document.getElementById('metricPage').classList.add('visible');
}
function closeMetricPage() {
  document.getElementById('healthDetail').classList.remove('pushed');
  document.getElementById('metricPage').classList.remove('visible');
}
document.addEventListener('DOMContentLoaded', () => {
  const sc = document.getElementById('metricPage');
  sc.addEventListener('scroll', () => document.getElementById('mpHeader').classList.toggle('scrolled', sc.scrollTop > 60));
});

// ===================== START =====================
document.addEventListener('DOMContentLoaded', init);
</script>
